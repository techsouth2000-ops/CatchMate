<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#081420; --s1:#0e1f2e; --s2:#16293a; --s3:#1d3447;
  --line:#22394d; --line2:#2c4a61;
  --ink:#eef4f8; --ink2:#9db2c4; --ink3:#7c93a9;
  --acc:#2fc49e; --acc2:#8ff0cd; --blue:#3987e5; --amber:#fab219; --red:#e66767;
  --pri:#4aa3ff; --sec:#2fc49e; --dark:#eef4f8; --bd:#22394d; --mut:#9db2c4; --light:#0e1f2e;
  --r:14px; --r2:10px;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
.wrap{display:flex;height:100vh}
.side{width:452px;background:var(--bg);display:flex;flex-direction:column;
  box-shadow:1px 0 0 var(--line);z-index:600;position:relative}
.mapwrap{flex:1;position:relative;background:var(--bg)}
#map{width:100%;height:100%}

/* ---------- header ---------- */
.head{padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--s1)}
.logo{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;flex-shrink:0;border-radius:9px}
.tag{font-size:10.5px;color:var(--ink3);margin-top:3px;letter-spacing:.01em}
.acct{flex-shrink:0;padding:7px 13px;font-size:11px;font-weight:650;border:1px solid var(--line2);
  background:var(--s2);color:var(--ink2);border-radius:20px;cursor:pointer;transition:.15s}
.acct:hover{border-color:var(--acc);color:var(--acc)}
.acct.in{background:var(--acc);color:#052419;border-color:var(--acc)}

/* ---------- body ---------- */
.body{flex:1;overflow-y:auto;padding:14px 16px 44px;overscroll-behavior:contain}
.empty{text-align:center;padding:56px 18px;color:var(--ink3)}
.empty .ic{font-size:46px;margin-bottom:14px;opacity:.85}
.status{font-size:12px;color:var(--acc);background:rgba(47,196,158,.09);
  border:1px solid rgba(47,196,158,.22);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px}
.err{font-size:12px;color:#ffc9b0;background:rgba(230,103,103,.1);
  border:1px solid rgba(230,103,103,.28);border-radius:var(--r2);padding:10px 12px;margin-bottom:10px;line-height:1.55}
.loc{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.sub{font-size:11px;color:var(--ink3);margin-top:5px}
.pill{display:inline-block;font-size:9.5px;font-weight:700;color:#052419;padding:4px 10px;
  border-radius:20px;margin-top:9px;letter-spacing:.04em;text-transform:uppercase}
.salt{background:#4aa3ff}.fresh{background:var(--acc)}.brack{background:#a78bfa}.unk{background:#64748b}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:16px 0 13px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--s1);color:var(--ink3);border-radius:20px;cursor:pointer;
  white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink2);border-color:var(--line2)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* ---------- hero score ---------- */
.hero{background:linear-gradient(160deg,var(--s2) 0%,var(--s1) 70%);
  border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;margin-bottom:11px}
.heroTop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.heroLbl{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.heroNum{font-size:54px;font-weight:800;line-height:.95;letter-spacing:-.045em;margin:6px 0 2px;
  font-variant-numeric:tabular-nums}
.heroOf{font-size:17px;font-weight:600;color:var(--ink3);letter-spacing:-.01em;margin-left:2px}
.heroBand{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.heroDots{font-size:8px;letter-spacing:2px;opacity:.85}
.heroMoon{text-align:center;flex-shrink:0;padding-top:2px}
.hmIcon{font-size:30px;line-height:1}
.hmTxt{font-size:9.5px;color:var(--ink3);margin-top:5px;line-height:1.45}
.heroWhy{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-top:13px;
  padding-top:13px;border-top:1px solid var(--line)}

/* ---------- condition strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:7px;margin-bottom:11px}
.stripCell{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);
  padding:9px 5px;text-align:center}
.scIco{font-size:14px;line-height:1;margin-bottom:4px}
.scVal{font-size:13px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.scLbl{font-size:8.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}

/* ---------- panels ---------- */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;margin-bottom:11px}
.pTitle{font-size:12.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.pSwap{background:var(--s2);border:1px solid var(--line2);color:var(--ink2);font-size:10px;
  font-weight:650;padding:4px 9px;border-radius:14px;cursor:pointer}
.pSwap:hover{color:var(--acc);border-color:var(--acc)}
.pBody{font-size:12px;color:var(--ink2);line-height:1.65}
.pFoot{font-size:10px;color:var(--ink3);line-height:1.6;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line)}

/* ---------- charts ---------- */
.chartWrap{margin:4px 0 10px}
.hchart{width:100%;height:78px;overflow:visible}
.hbase{stroke:var(--line2);stroke-width:.4}
.hb{transition:opacity .12s}
.hchart:hover .hb{opacity:.55}
.hchart .hb:hover{opacity:1}
.hbx{fill:var(--ink3);font-size:4.2px;font-family:inherit}
.sparkRow{display:flex;align-items:center;gap:13px;margin:6px 0 10px}
.spark{flex:1;height:38px;overflow:visible}
.sparkNum{text-align:right;flex-shrink:0}
.snV{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.snL{font-size:9px;color:var(--ink3);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- score breakdown ---------- */
.bdRow{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.bdRow:last-of-type{border-bottom:0}
.bdK{font-size:11px;font-weight:650;width:92px;flex-shrink:0;color:var(--ink)}
.bdD{font-size:11px;color:var(--ink3);flex:1;line-height:1.45}
.bdV{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:26px;text-align:right}
.bdV.up{color:var(--acc)}.bdV.dn{color:var(--amber)}.bdV.nil{color:var(--ink3)}

/* ---------- week ---------- */
.week{display:flex;gap:5px;margin:4px 0 2px}
.wDay{flex:1;text-align:center;background:var(--s2);border-radius:var(--r2);padding:9px 3px}
.wName{font-size:9.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.wIco{font-size:15px;margin:5px 0 4px;line-height:1}
.wBar{height:40px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:5px}
.wBar span{width:7px;border-radius:3px;display:block}
.wScore{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.wTemp{font-size:9.5px;color:var(--ink3);margin-top:2px}

/* ---------- generic cards / lists ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.chead{padding:12px 13px;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:11px}
.rank{font-size:9.5px;font-weight:700;background:var(--s3);color:var(--acc2);border-radius:5px;
  padding:3px 7px;margin-right:7px;letter-spacing:.02em}
.fname{font-weight:650;font-size:14px;letter-spacing:-.01em}
.sci{font-size:10px;color:var(--ink3);font-style:italic;margin-top:2px}
.cnt{font-size:10px;color:var(--ink3);margin-top:3px}
.arrow{color:var(--ink3);font-size:11px;flex-shrink:0}
.det{display:none;padding:0 13px 13px;border-top:1px solid var(--line)}
.det.on{display:block}
.fphoto{width:50px;height:50px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--s3)}
.fphoto.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
.fbig{display:block;width:100%;height:auto;max-height:320px;object-fit:contain;
  border-radius:var(--r2);margin-top:11px;background:#04101a}
.fbigwrap{display:block;position:relative;margin-top:11px}
.fbigwrap .fbig{margin-top:0}
.fbigcap{font-size:9px;color:var(--ink3);text-align:right;margin-top:4px}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--acc);margin:13px 0 6px}
.hint{font-size:11px;color:var(--ink3);margin-bottom:11px;line-height:1.6}
.hint2{font-size:10px;color:var(--ink3);margin-top:5px;line-height:1.55}
.nod{font-size:11.5px;color:var(--ink3);line-height:1.65;padding:11px 0}
.chip{display:inline-block;font-size:9.5px;font-weight:650;padding:4px 9px;border-radius:20px;
  background:var(--s3);color:var(--ink2);margin:0 5px 5px 0}
.foot{font-size:9.5px;color:var(--ink3);margin-top:18px;line-height:1.65;
  border-top:1px solid var(--line);padding-top:12px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line2);
  border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-1px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- bait / tackle blocks ---------- */
.bait{background:var(--s2);border-left:3px solid var(--acc);border-radius:var(--r2);
  padding:11px 12px;margin-bottom:9px;font-size:12px}
.bn{font-weight:650;margin-bottom:5px;color:var(--ink)}
.bd{font-size:11px;color:var(--ink2);line-height:1.6;margin-bottom:3px}
.rig{background:rgba(74,163,255,.08);border:1px solid rgba(74,163,255,.2);border-radius:9px;
  padding:10px 11px;font-size:11px;line-height:1.65;margin:8px 0;color:var(--ink2)}
.how{background:rgba(250,178,25,.07);border-left:3px solid var(--amber);border-radius:9px;
  padding:10px 11px;font-size:11px;line-height:1.65;margin-bottom:8px;color:var(--ink2)}
.why{background:rgba(167,139,250,.08);border-left:3px solid #a78bfa;border-radius:9px;
  padding:10px 11px;font-size:11px;line-height:1.65;color:var(--ink2)}
.tt{font-weight:700;font-size:9.5px;letter-spacing:.06em;margin-bottom:4px}
.when{background:rgba(47,196,158,.07);border-left:3px solid var(--acc);border-radius:9px;
  padding:10px 11px;font-size:11px;line-height:1.75;margin-top:9px;color:var(--ink2)}

/* ---------- regulations ---------- */
.reg{background:rgba(250,178,25,.06);border:1px solid rgba(250,178,25,.2);
  border-left:3px solid var(--amber);border-radius:var(--r2);padding:11px 12px;margin-top:12px;
  font-size:11px;line-height:1.65}
.reg.cr{background:rgba(230,103,103,.08);border-color:rgba(230,103,103,.3);border-left-color:var(--red)}
.rtitle{font-weight:700;font-size:9.5px;letter-spacing:.06em;color:var(--amber);margin-bottom:7px}
.reg.cr .rtitle{color:var(--red)}
.rrow{margin-bottom:4px;color:var(--ink2)}
.rnote{margin-top:6px;color:var(--ink3);font-style:italic}
.rflag{margin-top:8px;padding:7px 9px;background:rgba(250,178,25,.1);border-radius:7px;
  color:var(--amber);font-weight:650}
.rlink{display:inline-block;margin-top:9px;color:var(--pri);font-weight:700;
  text-decoration:none;font-size:11px}
.rdate{margin-top:7px;font-size:9px;color:var(--ink3)}

/* ---------- tides & solunar ---------- */
.daysw{display:flex;gap:5px;margin-bottom:12px}
.dbtn{flex:1;padding:9px;font-size:12px;font-weight:650;border:1px solid var(--line);
  background:var(--s1);color:var(--ink3);border-radius:var(--r2);cursor:pointer}
.dbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sol{background:linear-gradient(150deg,var(--s2),var(--s1));border:1px solid var(--line);
  border-radius:var(--r);padding:14px 15px}
.solhead{display:flex;justify-content:space-between;align-items:flex-start;gap:11px}
.solph{font-size:15px;font-weight:700;letter-spacing:-.015em}
.solsub{font-size:11px;color:var(--ink3);margin-top:4px}
.solrate{font-size:9.5px;font-weight:700;padding:5px 10px;border-radius:20px;flex-shrink:0;color:#052419}
.solnote{font-size:10px;color:var(--ink3);line-height:1.65;margin-top:10px}
.sol .solnote{color:var(--ink3)}
.win{display:flex;justify-content:space-between;align-items:center;gap:11px;
  border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;margin-bottom:7px;
  background:var(--s1)}
.win.major{border-left:3px solid var(--acc)}
.win.minor{border-left:3px solid var(--amber)}
.win.live{box-shadow:0 0 0 1px var(--acc);background:rgba(47,196,158,.07)}
.win.past{opacity:.4}
.winl{flex:1;min-width:0}
.wint{font-size:13px;font-weight:700;letter-spacing:-.01em}
.winn{font-size:10px;color:var(--ink3);margin-top:3px}
.winb{font-size:9px;font-weight:700;color:var(--ink3);letter-spacing:.06em}
.win.live .winb{color:var(--acc)}
.stn{font-size:11px;color:var(--ink3);margin-bottom:9px}
.tide{display:flex;justify-content:space-between;align-items:center;border-radius:var(--r2);
  padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);background:var(--s1)}
.tide.hi{border-left:3px solid var(--pri)}
.tide.lo{border-left:3px solid var(--ink3)}
.tide.past{opacity:.4}
.tidet{font-size:13px;font-weight:650;letter-spacing:-.01em}
.tidesub{font-size:10px;color:var(--ink3);margin-top:2px}
.tidein{font-size:11px;color:var(--ink3);font-weight:650}

/* ---------- spots ---------- */
.sctx{background:var(--s2);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r2);
  padding:10px 12px;font-size:11px;line-height:1.65;margin-bottom:11px;font-weight:600}
.whyblk{background:var(--s2);border-left:3px solid var(--acc);border-radius:var(--r2);
  padding:11px 12px;margin-top:12px}
.whyt{font-weight:700;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.whyl{font-size:11px;line-height:1.7;color:var(--ink2)}
.whyl.agn{margin-top:7px;color:var(--amber)}

/* ---------- map controls ---------- */
.ctl{position:absolute;top:11px;right:11px;z-index:500;display:flex;flex-direction:column;gap:5px}
.cbtn{padding:8px 12px;font-size:11px;font-weight:650;border:1px solid var(--line2);
  border-radius:9px;background:rgba(14,31,46,.94);color:var(--ink2);
  box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer;backdrop-filter:blur(8px);transition:.15s}
.cbtn:hover{color:var(--ink);border-color:var(--acc)}
.cbtn.on{background:var(--acc);color:#052419;border-color:var(--acc)}
.cbtn.loc{color:#9ecbff}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:17px;z-index:500;
  padding:12px 21px;font-size:13px;font-weight:700;border:0;border-radius:30px;
  background:var(--acc);color:#052419;box-shadow:0 4px 18px rgba(47,196,158,.34);cursor:pointer;
  letter-spacing:-.01em}
.fab:hover{background:var(--acc2)}

/* ---------- depth legend ---------- */
/* Leaflet's own chrome ships light; restyle it or it fights the theme */
.leaflet-control-zoom a{background:rgba(14,31,46,.94)!important;color:var(--ink2)!important;
  border-color:var(--line2)!important;backdrop-filter:blur(8px);font-weight:600}
.leaflet-control-zoom a:hover{background:var(--s3)!important;color:var(--ink)!important}
.leaflet-bar{border:1px solid var(--line2)!important;box-shadow:0 2px 10px rgba(0,0,0,.4)!important;
  border-radius:10px!important;overflow:hidden}
.leaflet-control-attribution{background:rgba(8,20,32,.82)!important;color:var(--ink3)!important;
  font-size:9px!important;padding:2px 6px!important;backdrop-filter:blur(6px)}
.leaflet-control-attribution a{color:var(--ink3)!important;text-decoration:none}
.leaflet-container{background:var(--bg)}
/* last-resort dark map: invert standard OSM tiles so the theme still holds */
.tileDark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.85)}
/* strip values must never wrap — a wrapped cell looks broken */
.scVal{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scLbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* show that the tab row scrolls */
.tabs{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 18px),transparent 100%)}
.hidectl{display:none}
.lySec{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);margin:16px 0 7px}
.lyRow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;background:var(--s2);
  border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;font-family:inherit;
  text-align:left;margin-bottom:7px;transition:.15s}
.lyRow:hover{border-color:var(--line2)}
.lyRow.on{border-color:var(--acc);background:rgba(47,196,158,.09)}
.lyIco{width:34px;height:34px;border-radius:10px;background:var(--s3);display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.lyTxt{flex:1;min-width:0}
.lyT{font-size:13.5px;font-weight:650;color:var(--ink)}
.lyD{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.lyAlt{padding:4px 2px 10px}
.lyAltT{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:8px}
.lyPill{background:var(--s2);border:1px solid var(--line2);color:var(--ink2);font-size:10.5px;
  font-weight:650;padding:6px 11px;border-radius:16px;cursor:pointer;margin:0 5px 5px 0}
.lyPill.on{background:var(--acc);color:#052419;border-color:var(--acc)}
.lyChk{color:var(--acc);font-weight:700;font-size:14px;flex-shrink:0;width:14px;text-align:center}
.dlegend{background:rgba(14,31,46,.96);border:1px solid var(--line2);padding:10px 12px;
  border-radius:var(--r2);max-width:250px;box-shadow:0 3px 14px rgba(0,0,0,.45);
  font-size:10px;line-height:1.55;color:var(--ink2);backdrop-filter:blur(8px)}
.dlt{font-weight:700;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);
  margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:7px}
.dlsw{background:none;border:0;color:var(--amber);font-size:9px;font-weight:700;cursor:pointer;
  padding:0;text-transform:none;letter-spacing:0}
.dlr{margin-bottom:5px}
.dline{display:inline-block;width:20px;height:0;border-top:1.5px dashed #6b9dc4;
  vertical-align:middle;margin-right:4px}
.dsw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-2px;
  border:1px solid var(--line2)}
.dsw.sh{background:#2f6d94}.dsw.dp{background:#0c2334}
.dlnote{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);color:var(--ink3);
  font-size:9px;line-height:1.55}
.dlnote:empty{display:none}
/* ENC draws black ink for a white paper chart; invert it so the contours and
   soundings read as white line-work on the dark map instead of vanishing. */
.encinv img, img.encinv{filter:invert(1) brightness(1.9) contrast(1.35)}
.dlminimsg{margin-top:5px;max-width:230px;background:rgba(14,31,46,.94);border:1px solid var(--line2);
  border-radius:8px;padding:6px 9px;color:var(--ink2);font-size:10px;line-height:1.5}
.dlegend.mini{padding:0;border:0;background:none;box-shadow:none;max-width:none}
.dlmini{background:rgba(14,31,46,.94);border:1px solid var(--line2);color:var(--ink2);
  font-size:10px;font-weight:650;padding:8px 11px;border-radius:9px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:inherit;
  white-space:nowrap}
.dlmini:hover{color:var(--acc);border-color:var(--acc)}
.dlcar{color:var(--acc);margin-left:3px}
.dlt span{display:flex;align-items:center;gap:8px}
.dlx{background:none;border:0;color:var(--ink3);font-size:12px;cursor:pointer;padding:0;
  line-height:1;text-transform:none;letter-spacing:0}
.dlx:hover{color:var(--red)}

/* ---------- shops ---------- */
.slrow{display:flex;align-items:center;gap:11px;width:100%;padding:12px 4px;background:none;
  border:0;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;text-align:left}
.slrow:hover{background:rgba(255,255,255,.02)}
.slic{width:34px;height:34px;border-radius:50%;background:var(--s3);display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.slname{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--ink)}
.slsub{font-size:10.5px;color:var(--ink3);margin-top:3px}
.shopblk{border-top:1px solid var(--line);padding:12px 0}
.sblbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink3);margin-bottom:5px}
.sbval{font-size:12.5px;line-height:1.6;color:var(--ink2)}
.ob{display:inline-block;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;margin-left:5px}
.ob.open{background:rgba(47,196,158,.17);color:var(--acc)}
.ob.shut{background:rgba(230,103,103,.17);color:var(--red)}
.ob.unk{background:var(--s3);color:var(--ink3)}

/* ---------- modal ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(4,10,16,.7);z-index:2000;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{background:var(--s1);border:1px solid var(--line2);width:100%;max-width:540px;
  max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:22px 19px 34px}
@media(min-width:821px){.modal{align-items:center}.sheet{border-radius:var(--r);max-height:86vh}}
.mtitle{font-size:20px;font-weight:700;letter-spacing:-.025em;margin-bottom:5px}
.msub{font-size:12px;color:var(--ink3);line-height:1.65;margin-bottom:17px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:9.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 13px;font-size:15px;
  border:1px solid var(--line2);border-radius:var(--r2);background:var(--s2);color:var(--ink);
  -webkit-appearance:none;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{min-height:76px;resize:vertical}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.btn{width:100%;padding:13px;font-size:14px;font-weight:700;border:0;border-radius:var(--r2);
  background:var(--acc);color:#052419;cursor:pointer;margin-top:7px;letter-spacing:-.01em}
.btn:hover{background:var(--acc2)}
.btn:disabled{opacity:.45}
.btn.alt{background:var(--s2);color:var(--ink2);border:1px solid var(--line2)}
.btn.alt:hover{color:var(--ink);border-color:var(--acc)}
.btn.danger{background:var(--s2);color:var(--red);border:1px solid rgba(230,103,103,.34)}
.linky{background:none;border:0;color:var(--pri);font-size:12px;font-weight:650;cursor:pointer;
  padding:9px 0;text-decoration:underline}
.msg{font-size:12px;padding:10px 12px;border-radius:9px;margin-bottom:13px;line-height:1.55}
.msg.bad{background:rgba(230,103,103,.1);color:#ffc9b0;border:1px solid rgba(230,103,103,.28)}
.msg.good{background:rgba(47,196,158,.1);color:var(--acc2);border:1px solid rgba(47,196,158,.28)}
.prev{width:100%;max-height:230px;object-fit:contain;border-radius:var(--r2);
  background:#04101a;margin-top:9px}

/* ---------- community ---------- */
.cc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;
  background:var(--s1)}
.ccimg{width:100%;max-height:270px;object-fit:contain;background:#04101a;display:block}
.ccb{padding:12px 13px}
.ccu{font-size:11.5px;font-weight:700;color:var(--acc)}
.ccs{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.ccm{font-size:10.5px;color:var(--ink3);line-height:1.65}
.ccact{display:flex;gap:16px;align-items:center;margin-top:10px;font-size:12px}
.ccact button{background:none;border:0;color:var(--ink3);font-size:12px;font-weight:650;
  cursor:pointer;padding:0}
.ccact button.liked{color:var(--amber)}
.obsmeta{background:var(--s2);border-left:3px solid var(--line2);border-radius:9px;
  padding:10px 11px;font-size:11px;line-height:1.75;color:var(--ink2);margin-top:11px}

/* ---------- peek bar: the score stays visible with the panel closed ---------- */
.peek{display:none;width:100%;align-items:center;gap:12px;padding:11px 16px 13px;
  background:none;border:0;cursor:pointer;text-align:left;font-family:inherit}
.pkScore{width:46px;height:46px;border-radius:13px;background:var(--s2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
  letter-spacing:-.03em;color:var(--ink3);flex-shrink:0;font-variant-numeric:tabular-nums}
.pkMid{flex:1;min-width:0}
.pkName{font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkSub{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pkUp{color:var(--ink3);font-size:11px;flex-shrink:0}

/* ---------- mobile ---------- */
.grab{display:none}
.side.small .head,.side.small .body{display:none}
@media(min-width:821px){
  .side{transition:width .25s ease}
  .side.small{width:0;min-width:0;overflow:hidden;box-shadow:none}
  .grab,.peek{display:none!important}
}
@media(max-width:820px){
  body{font-size:14.5px}
  .wrap{flex-direction:column-reverse}
  /* map-dominant by default: the chart is the app, data pulls up over it */
  .side{width:100%;height:96px;transition:height .26s cubic-bezier(.32,.72,0,1);
    border-radius:20px 20px 0 0;box-shadow:0 -6px 26px rgba(0,0,0,.55);
    border-top:1px solid var(--line2);background:var(--s1)}
  .side.mid{height:56%}
  .side.big{height:94%}
  .side.small{height:44px}
  .mapwrap{height:calc(100% - 96px);transition:height .26s cubic-bezier(.32,.72,0,1)}
  .side.mid ~ .mapwrap{height:44%}
  .side.big ~ .mapwrap{height:6%}
  .side.small ~ .mapwrap{height:calc(100% - 44px)}
  /* collapsed: only the peek bar shows */
  .side .head,.side .body{display:none}
  .side.mid .head,.side.mid .body,.side.big .head,.side.big .body{display:block}
  .side.mid .body,.side.big .body{flex:1;overflow-y:auto}
  .side.small .head,.side.small .body{display:none}
  .peek{display:flex}
  .side.mid .peek,.side.big .peek,.side.small .peek{display:none}
  .grab{display:block;width:100%;padding:9px 0 3px;border:0;background:none;cursor:pointer;flex-shrink:0}
  .grab span{display:block;width:44px;height:4px;border-radius:3px;background:var(--line2);margin:0 auto}
  .side.big .grab span{background:var(--acc)}
  .side.small .grab span{background:var(--amber);width:58px}
  .head{padding:9px 15px 10px}
  .body{padding:12px 15px 36px}
  .logo{font-size:17px}
  .mark{width:27px;height:27px}
  .tag{font-size:9.5px}
  .loc{font-size:20px}
  .heroNum{font-size:46px}
  /* bigger controls — wet fingers, sun glare, a moving boat */
  .ctl{top:10px;right:10px;gap:7px}
  .cbtn{padding:0;width:52px;height:52px;font-size:20px;line-height:1;border-radius:14px;
    display:flex;align-items:center;justify-content:center}
  .lw{display:none}
  .fab{bottom:14px;padding:13px 22px;font-size:13px}
  .dlegend{max-width:186px;font-size:9px;padding:8px 10px}
  .week{gap:3px}
  .wDay{padding:7px 2px}
  .strip{grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:5px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="side" id="side">
    <button class="grab" onclick="toggleSheetSize()" aria-label="Expand or shrink panel"><span></span></button>
    <button class="peek" id="peek" onclick="sheetSize('mid')" aria-label="Open the forecast panel">
      <div class="pkScore" id="pkScore">—</div>
      <div class="pkMid">
        <div class="pkName" id="pkName">Tap the water to start</div>
        <div class="pkSub" id="pkSub">Bitecast</div>
      </div>
      <div class="pkUp">▲</div>
    </button>
    <div class="head">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <div class="logo">
            <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Bitecast">
              <defs>
                <linearGradient id="bcBg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#12324d"/><stop offset="1" stop-color="#0a1c2c"/>
                </linearGradient>
                <clipPath id="bcClip"><rect x="2" y="2" width="60" height="60" rx="17"/></clipPath>
              </defs>
              <g clip-path="url(#bcClip)">
                <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bcBg)"/>
                <path d="M20.5 10.5a7.6 7.6 0 1 0 0 13.8 6 6 0 1 1 0-13.8z" fill="#F5C86B"/>
                <path d="M21 33.5 6.5 25a24 24 0 0 0 0 17z" fill="#1FA97A"/>
                <path d="M17 33.5c5.5-10.5 19-14 29.5-8 3.5 2 6 4.8 7 8-1 3.2-3.5 6-7 8-10.5 6-24 2.5-29.5-8z" fill="#3BE0A0"/>
                <path d="M30 22.6c-3.4 6.6-3.4 15.2 0 21.8-5.5-1.8-10-5.4-13-10.9 3-5.5 7.5-9.1 13-10.9z" fill="#25C289"/>
                <path d="M30.5 23.4c1.6-5.6 6-8.8 10.2-7.3l-4 7.9z" fill="#1FA97A"/>
                <circle cx="45" cy="30" r="3.1" fill="#0a1c2c"/>
                <path d="M2 50c5.5-3 9-3 14.5 0s9 3 14.5 0 9-3 14.5 0 9 3 14.5 0" stroke="#2E7FB8"
                      stroke-width="2.6" fill="none" opacity=".5" stroke-linecap="round"/>
                <path d="M2 57c5.5-3 9-3 14.5 0s9 3 14.5 0 9-3 14.5 0 9 3 14.5 0" stroke="#2E7FB8"
                      stroke-width="2.2" fill="none" opacity=".28" stroke-linecap="round"/>
              </g>
            </svg>
            <span>Bitecast</span>
          </div>
          <div class="tag">Tap any water. Know what's biting, when, and how. <span style="color:#0a8f5f;font-weight:700">· v34 spots</span></div>
        </div>
        <button class="acct" id="acctbtn" onclick="openAccount()">Sign in</button>
      </div>
    </div>
    <div class="body" id="out">
      <div class="empty">
        <div class="ic">🗺️</div>
        <div style="font-weight:600;color:var(--ink);margin-bottom:6px">Where do you want to fish?</div>
        <div style="font-size:12px">Tap a lake, river, bay, flat, inlet or the open Gulf.</div>
      </div>
    </div>
  </div>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="ctl">
      <button class="cbtn" id="b-layers" onclick="openLayers()" aria-label="Map layers">⧉<span class="lw"> Layers</span></button>
      <button class="cbtn loc" id="b-loc" onclick="locateMe()" aria-label="Find my location">📍<span class="lw"> Locate</span></button>
      <button class="cbtn" id="b-full" onclick="toggleFullMap()" aria-label="Full screen map">⤢<span class="lw"> Full map</span></button>
      <!-- kept for the layers sheet to drive; never shown on the map itself -->
      <span class="hidectl">
        <button id="b-map" class="on" onclick="setBase('map')"></button>
        <button id="b-sat" onclick="setBase('sat')"></button>
        <button id="b-depth" onclick="toggleDepth()"></button>
        <button id="b-radar" onclick="toggleRadar()"></button>
        <button id="b-shop" onclick="toggleShops()"></button>
      </span>
    </div>
    <button class="fab" id="fab" onclick="openLogCatch()">＋ Log a catch</button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ---------------------------------------------------------------
   Bitecast
   Water body ID : Overpass API (OpenStreetMap)
   Fish records  : iNaturalist API (real georeferenced observations)
   Tackle data   : curated, keyed to species actually returned
----------------------------------------------------------------*/

/* maxZoom 20 on the map, and every layer below carries maxNativeZoom at its
   real cache limit. Without that, one layer's ceiling caps the whole map —
   the dark basemap stops at 16, which was stopping the chart well short of
   where depth contours become readable. */
/* maxZoom 22, not 20. The depth layer is NOAA's vector ENC, rendered to order
   per tile, so it stays sharp as far in as you care to go — verified returning
   clean imagery at 1:282, about ten metres across a tile. Anglers read a drop
   by where the contours bunch, and that is a close-range judgement. Raster
   layers below simply stretch their last real tile. */
const map = L.map('map', {zoomControl:true, maxZoom:22}).setView([27.6,-81.6], 7);

/* Fixed panes, so stacking order is declared rather than inherited from the
   order layers happened to be added. Everything used to share Leaflet's one
   tilePane, where a layer sits above whatever was added before it — so any
   basemap or satellite failover (removeLayer then addTo) re-inserted the base
   ON TOP of depth and radar and quietly buried them. That fires hardest on a
   phone: more tiles at high zoom over a weaker connection means more tile
   errors, which is exactly when the failover trips. Panes make it impossible.
   All three sit below overlayPane (400) so markers and rings still draw over. */
map.createPane('baseTiles').style.zIndex  = 200;
map.createPane('depthTiles').style.zIndex = 250;
map.createPane('radarTiles').style.zIndex = 260;
/* Dark basemap chain. Two hard lessons are baked into this list.

   First, water comes before looks: this is a fishing app, and Esri's Dark Gray
   Canvas is explicitly a muted backdrop meant to sit UNDER your own data, so it
   renders the Caloosahatchee and the rim canals faintly or not at all.

   Second, every source here must work with no API key. Carto was the obvious
   choice on cartography and had to be dropped: it now requires a key, and
   rather than failing with an HTTP error it returns a normal 200 tile with
   "API KEY REQUIRED" watermarked into the image — which no tileerror handler
   can ever catch. RainViewer does the same thing with its zoom limit. A tile
   source that reports failure as a picture cannot be trusted in a failover
   chain, so the chain only contains sources that are free of keys outright.

   OpenStreetMap leads because it draws every waterway and needs no key. It is
   inverted with a CSS filter to match the dark interface. */
const BASE_SOURCES=[
  {n:'OpenStreetMap dark', d:'Draws every river, canal and lake \u2014 no key needed',
   u:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
   a:'\u00A9 OpenStreetMap', max:22, nat:19, sub:'abc', filter:true},
  {n:'Esri Dark Gray', d:'Cleaner, but inland rivers and canals are faint or absent',
   u:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
   a:'\u00A9 Esri', max:22, nat:16, sub:'abc', filter:false}
];
let baseIdx=0, baseMap=null, baseFails=0;

function buildBase(){
  const s=BASE_SOURCES[baseIdx];
  const l=L.tileLayer(s.u,{maxZoom:s.max,maxNativeZoom:s.nat||s.max,subdomains:s.sub,attribution:s.a,
                           pane:'baseTiles',className:s.filter?'tileDark':''});
  baseFails=0;
  l.on('tileerror',()=>{
    // a few misses are normal past a source's zoom ceiling; a wall of them is not
    if(++baseFails<8) return;
    if(baseIdx>=BASE_SOURCES.length-1){
      console.warn('no dark basemap reachable; staying on', s.n);
      baseFails=-1e9;
      return;
    }
    baseIdx++; baseFails=-1e9;
    console.warn('basemap "'+s.n+'" unreachable, trying "'+BASE_SOURCES[baseIdx].n+'"');
    const was=map.hasLayer(l);
    if(was) map.removeLayer(l);
    baseMap=buildBase();
    if(was) baseMap.addTo(map);
  });
  return l;
}
baseMap=buildBase();

/* Let the angler force a specific basemap rather than wait on detection. */
function setBaseSource(i){
  baseIdx=Math.max(0,Math.min(BASE_SOURCES.length-1,i));
  const was=map.hasLayer(baseMap);
  if(was) map.removeLayer(baseMap);
  baseMap=buildBase();
  if(was||!map.hasLayer(baseSat)) baseMap.addTo(map);
  if(typeof openLayers==='function') openLayers();
}

const SAT_SOURCES=[
  {n:'Esri',u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',a:'© Esri'},
  {n:'USGS',u:'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',a:'USGS'},
  {n:'Google',u:'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',a:'Google'}
];
let satIdx=0, baseSat=L.tileLayer(SAT_SOURCES[0].u,{maxZoom:22,maxNativeZoom:19,pane:'baseTiles',attribution:SAT_SOURCES[0].a});
let satFails=0;
function wireSat(){
  satFails=0;
  baseSat.on('tileerror',()=>{
    if(++satFails<4) return;
    if(satIdx>=SAT_SOURCES.length-1) return;
    satIdx++;
    const s=SAT_SOURCES[satIdx];
    console.warn('satellite source failed, switching to',s.n);
    const was=map.hasLayer(baseSat);
    if(was) map.removeLayer(baseSat);
    baseSat=L.tileLayer(s.u,{maxZoom:22,maxNativeZoom:19,pane:'baseTiles',attribution:s.a});
    wireSat();
    if(was) baseSat.addTo(map);
    document.getElementById('b-sat').textContent='🛰️ Satellite ('+s.n+')';
  });
}

baseMap.addTo(map);

  if(map.hasLayer(baseMap)) map.removeLayer(baseMap);
  if(map.hasLayer(baseSat)) map.removeLayer(baseSat);

/* ============ DEPTH CONTOURS (NOAA nautical charts) ============
   NOAA's official charts carry printed soundings and depth contour lines —
   the thing an angler actually reads. Several candidate endpoints, tried in
   order, because a silently-dead tile host is how the old depth layer failed. */
/* NOAA retired the old Raster Navigational Chart tile service along with
   its paper charts, so the original host is gone. The replacement is the
   NOAA Chart Display Service — a cached Esri tile service.

   The catch that cost several attempts: its cache numbers levels two lower
   than standard web mercator. Level 0 is a 4x4 grid (standard zoom 2) and
   level 16 is standard zoom 18 — a clean -2 across every LOD, confirmed
   from the service's own resolution figures. The tile grid itself is
   identical, so only the z in the URL shifts, which is exactly what
   Leaflet's zoomOffset does. Ask for level 12 at zoom-12 coordinates and
   every tile 404s, which is precisely how this looked broken.

   maxNativeZoom stops the chart vanishing past the cache: Leaflet stretches
   the last real tile instead, the way a plotter does. */
/* ENC_BASE: NOAA's vector chart service. Unlike the raster chart it is drawn
   on demand per tile, so it stays sharp at zoom 20 instead of turning to mush
   the moment you pass the cache \u2014 and it comes back with a transparent
   background, so the dark basemap survives underneath.

   Layer 104 is Depth_Contour_line, 76 is Sounding_point. Those two alone are
   what an angler wants; the full ENC also paints land, buildings and berths
   over everything. dpi 192 doubles ArcGIS's symbol sizing so the numbers are
   legible on a phone. Verified live against the service on 2026-09-30. */
const ENC_ROOT='https://gis.charttools.noaa.gov/arcgis/rest/services/encdirect/';

/* NOAA splits its vector charts into scale bands, and a given piece of water
   lives in exactly one of them. Harbour is the most detailed but it only
   covers harbours and passes; Lake Okeechobee and the Okeechobee Waterway,
   for instance, are charted in Approach, not Harbour. Querying Harbour alone
   reported "no charted depths" over water NOAA charts perfectly well.

   Layer numbers differ per band, so they are looked up per service rather
   than assumed. Verified against each service on 2026-10-01. */
const ENC_BANDS=[
  {svc:'enc_harbour',  snd:76, cnt:104, n:'Harbour'},
  {svc:'enc_approach', snd:80, cnt:108, n:'Approach'},
  {svc:'enc_coastal',  snd:61, cnt:82,  n:'Coastal'}
];
let encBand=0;
const encUrl=(b)=>ENC_ROOT+ENC_BANDS[b].svc+'/MapServer';
const WM_R=20037508.342789244;   // web mercator half-circumference, metres

/* Drawn as ONE image for the whole view, not as a tile grid.

   This service renders every request to order — it is not a tile cache — so a
   tile layer meant a dozen live renders per pan and per zoom step. Under that
   burst some requests fail or time out, the failure counter trips, and the app
   demotes the real depth layer to a chart that has no bathymetry. From the
   angler's side the depths simply vanish the moment they zoom in, which is
   exactly the symptom reported. One request per view is roughly a twelfth of
   the load, has no seams, and renders at the exact scale on screen, so it
   stays sharp all the way to zoom 22. Verified against the live service. */
const EncDepthLayer = L.Layer.extend({
  options:{minZoom:12, opacity:1, className:'encinv', pane:'depthTiles', dpi:300, maxPx:2048},
  initialize:function(opts){ L.setOptions(this,opts); },
  onAdd:function(map){
    this._map=map;
    map.on('moveend zoomend', this._schedule, this);
    this._schedule();
    return this;
  },
  onRemove:function(map){
    map.off('moveend zoomend', this._schedule, this);
    clearTimeout(this._t);
    this._clear();
    this._map=null;
    return this;
  },
  getContainer:function(){ return this._cur ? this._cur.getElement() : null; },
  redraw:function(){ this._schedule(); return this; },
  _clear:function(){
    if(this._cur && this._map) this._map.removeLayer(this._cur);
    this._cur=null;
  },
  _schedule:function(){
    clearTimeout(this._t);
    this._t=setTimeout(this._draw.bind(this), 180);   // one render per settle, not per frame
  },
  _draw:function(){
    const map=this._map; if(!map) return;
    if(map.getZoom() < (this.options.minZoom||0)){ this._clear(); return; }
    const b=map.getBounds();
    const sw=L.CRS.EPSG3857.project(b.getSouthWest());
    const ne=L.CRS.EPSG3857.project(b.getNorthEast());
    const size=map.getSize();
    const r=Math.min(window.devicePixelRatio||1, 2);
    let w=Math.max(1,Math.round(size.x*r)), hh=Math.max(1,Math.round(size.y*r));
    const cap=this.options.maxPx, big=Math.max(w,hh);
    if(big>cap){ const k=cap/big; w=Math.round(w*k); hh=Math.round(hh*k); }
    const band=ENC_BANDS[this.options.band!=null?this.options.band:encBand];
    const url=ENC_ROOT+band.svc+'/MapServer/export?bbox='+[sw.x,sw.y,ne.x,ne.y].join(',')+
      '&bboxSR=3857&imageSR=3857&size='+w+','+hh+'&format=png32&transparent=true'+
      '&layers=show:'+band.snd+','+band.cnt+'&dpi='+this.options.dpi+'&f=image';
    const self=this;
    const ov=L.imageOverlay(url, b, {opacity:this.options.opacity, pane:this.options.pane,
                                     className:this.options.className, interactive:false});
    ov.on('load', function(){
      if(self._cur && self._cur!==ov && self._map) self._map.removeLayer(self._cur);
      self._cur=ov;
      depthFails=0;                 // a good render clears the failure streak
      self.fire('chartload');
    });
    ov.on('error', function(){
      if(self._map) self._map.removeLayer(ov);
      self.fire('tileerror',{});     // keeps the existing failover plumbing working
    });
    ov.addTo(map);
  }
});

const DEPTH_SOURCES=[
  {n:'Depth contours', kind:'enc',
   a:'NOAA Office of Coast Survey (ENC)', max:22, nat:22, min:12, auto:true,
   note:'Vector nautical chart \u2014 stays sharp however far you zoom in.'},
  {n:'Full NOAA chart', kind:'raster',
   u:'https://gis.charttools.noaa.gov/arcgis/rest/services/MarineChart_Services/NOAACharts/MapServer/tile/{z}/{y}/{x}',
   a:'NOAA Office of Coast Survey', max:22, nat:18, zoff:-2, min:2, opaque:true, auto:true,
   note:'The whole printed chart: channels, marks and hazards. Hides the basemap.'},
  {n:'OpenSeaMap', kind:'raster',
   u:'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
   a:'OpenSeaMap', max:22, nat:18, zoff:0, min:2, auto:false,
   note:'Community marine overlay \u2014 marks, buoys and hazards, not full bathymetry.'}
];
let depthIdx=0, depthLayer=null, depthOn=false, depthFails=0, depthLegend=null;

function buildDepthLayer(){
  const s=DEPTH_SOURCES[depthIdx];
  let l;
  if(s.kind==='enc'){
    /* Each tile is rendered live by ArcGIS rather than served from a cache, so
       every request costs real time. On a phone that is the difference between
       a layer that appears and one that seems not to work, so only ask for
       tiles once the map has settled, and keep little off-screen buffer. */
    l=new EncDepthLayer({minZoom:s.min, band:null, opacity:1,
                         pane:'depthTiles', className:'encinv', attribution:s.a});
  } else {
    l=L.tileLayer(s.u,{maxZoom:s.max,maxNativeZoom:s.nat||s.max,minZoom:s.min||0,
                       zoomOffset:s.zoff||0,opacity:s.opaque?0.95:0.85,
                       pane:'depthTiles',attribution:s.a});
  }
  depthFails=0;
  /* Clear a stale "charts are not loading" note the moment one does. It was
     left on screen underneath a perfectly good chart. */
  l.on('chartload',()=>{
    if(/not loading/.test(depthMsgText)) depthNote('');
  });
  l.on('tileerror',()=>{
    /* Six errors used to demote the source. That was far too twitchy for ENC:
       it is rendered to order, so a screenful of tiles at high zoom can have
       several time out under load while the service is perfectly healthy — and
       the app would quietly demote the real depth layer all the way down to
       OpenSeaMap, which carries buoys and marks and NO bathymetry at all. The
       angler was then looking at a layer called "depths" showing none.
       Tolerate bursts, and never auto-fall-back onto a source that cannot
       answer the question: OpenSeaMap is a manual choice only (auto:false). */
    if(++depthFails<5) return;
    let nxt=-1;
    for(let i=depthIdx+1;i<DEPTH_SOURCES.length;i++){ if(DEPTH_SOURCES[i].auto!==false){ nxt=i; break; } }
    if(nxt<0){
      depthNote('Charts are not loading here just now. Tap "change" to pick another source.');
      depthFails=0;                      // let it keep trying rather than give up
      return;
    }
    depthIdx=nxt;
    console.warn('depth source failed, switching to',DEPTH_SOURCES[depthIdx].n);
    const was=depthOn;
    if(depthLayer) map.removeLayer(depthLayer);
    depthLayer=buildDepthLayer();
    if(was){ depthLayer.addTo(map); paintDepthLegend(); }
  });
  return l;
}

/* The charted-depth readout is the most useful thing the depth feature says,
   and it was being thrown away: #depthmsg lives only in the EXPANDED legend,
   and the legend is collapsed by default, so every message hit the if(el)
   guard and vanished. Keep the text in a variable that both states render. */
let depthMsgText='';
function depthNote(msg){
  depthMsgText=msg||'';
  const el=document.getElementById('depthmsg');
  if(el) el.textContent=depthMsgText;
  else if(depthLegend) paintDepthLegend();   // collapsed: repaint so the chip shows it
}

function toggleDepth(){
  const btn=document.getElementById('b-depth');
  if(depthOn){
    if(depthLayer) map.removeLayer(depthLayer);
    if(depthLegend){ depthLegend.remove(); depthLegend=null; }
    depthLegendOpen=false;
    depthOn=false; btn.classList.remove('on');
    return;
  }
  if(!depthLayer) depthLayer=buildDepthLayer();
  depthLayer.addTo(map);
  depthOn=true; btn.classList.add('on');
  paintDepthLegend();
  /* Soundings only render from about zoom 13. Zooming in on whatever the map
     happened to be centred on, though, is how this looked broken: from the
     opening statewide view that lands in the middle of the peninsula, miles
     from any charted water, and every tile comes back correctly drawn and
     completely empty. Go to the water the angler actually picked. */
  const here = (state && state.lat!=null) ? [state.lat,state.lng] : null;
  if(here) map.setView(here, Math.max(map.getZoom(),14));
  else if(map.getZoom()<13) map.setZoom(13);
  checkDepthCoverage();
}

/* NOAA charts only exist for tidal and coastal water. Inland lakes, ponds and
   the upper rivers have no soundings at all — not a failure, but the angler
   deserves to be told rather than left staring at an empty map. */
async function checkDepthCoverage(){
  const c=map.getCenter();
  depthNote('Checking chart coverage here…');
  const picked=await pickEncBand(c.lat,c.lng);
  const b=picked.band;
  if(b<0){
    depthNote('No charted depths here. NOAA charts tidal and coastal water plus the Okeechobee Waterway — most inland lakes and ponds are not charted.');
    return;
  }
  if(b!==encBand){                       // a different chart band covers this water
    encBand=b;
    if(depthLayer && DEPTH_SOURCES[depthIdx].kind==='enc') depthLayer.redraw();
  }
  const d=picked.data;                    // already fetched above; no second trip
  if(d===null){ depthNote('Could not reach the chart service just now.'); return; }
  const ft=d.soundings.map(v=>v*3.28084);
  const ftTxt=v=>v<1?'under 1':v.toFixed(0);
  depthNote(ft.length
    ? 'Charted here: '+ftTxt(Math.min(...ft))+'–'+ftTxt(Math.max(...ft))+' ft at low water.'
    : 'Contours charted here.');
}

/* ENC stores depths in METRES. Everything shown to the angler is converted to
   feet, because a Florida fisherman does not think in metres and a mistaken
   3.6 reads as feet when it is really 11.8. */
async function encDepths(lat,lng,radius,band){
  const base=encUrl(band!=null?band:encBand);
  const q=(layer,field)=>base+'/'+layer+'/query?geometry='+lng+','+lat+
    '&geometryType=esriGeometryPoint&inSR=4326&distance='+radius+
    '&units=esriSRUnit_Meter&spatialRel=esriSpatialRelIntersects&outFields='+field+
    '&returnGeometry=false&resultRecordCount=200&f=json';
  const B=ENC_BANDS[band!=null?band:encBand];
  try{
    const [s,c]=await Promise.all([
      Promise.race([fetch(q(B.snd,'Z')).then(r=>r.json()), timeout(9000)]),
      Promise.race([fetch(q(B.cnt,'VALDCO')).then(r=>r.json()), timeout(9000)])
    ]);
    const nums=(j,f)=>(j&&j.features?j.features:[]).map(x=>x.attributes[f])
                        .filter(v=>typeof v==='number'&&v>0);
    return {soundings:nums(s,'Z'), contours:[...new Set(nums(c,'VALDCO'))].sort((a,b)=>a-b)};
  }catch(e){ return null; }
}

/* Pick the band that actually charts this water, most detailed first, the way
   you would reach for the largest-scale chart that covers where you are. */
async function pickEncBand(lat,lng){
  /* Asked each band in turn and awaited it, so uncharted inland water cost up
     to six serial round trips against a 9 s timeout before answering "no".
     Ask all three at once and take the most detailed one that has data. */
  const res=await Promise.all(ENC_BANDS.map((_,i)=>encDepths(lat,lng,3000,i)));
  for(let i=0;i<res.length;i++){
    const d=res[i];
    if(d && (d.soundings.length || d.contours.length)) return {band:i, data:d};
  }
  return {band:-1, data:null};
}

/* Chart coverage varies by area, so let the angler pick the source rather
   than being stuck with whichever one loaded first. */
function setDepthSource(i){
  depthIdx=Math.max(0,Math.min(DEPTH_SOURCES.length-1,i));
  const was=depthOn;
  if(depthLayer) map.removeLayer(depthLayer);
  depthLayer=buildDepthLayer();
  if(was){ depthLayer.addTo(map); paintDepthLegend(); }
  closeModal();
}

/* ============ WATER BODY IDENTIFICATION (Overpass / OSM) ============ */
/* overpass.osm.ch removed 2026-10-03: it answers HTTP 200 with a valid but
   EMPTY element set for perfectly good queries — a search around Sanibel
   Island came back with nothing named at all. Because the mirrors are raced
   and the first answer wins, a fast mirror serving an empty database beat the
   working ones, and the app announced "no mapped structure within 7 miles"
   over the Sanibel Causeway. Same shape as RainViewer's zoom tiles and Carto's
   key notice: a 200 that means no. */
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];

/* NOTE: no AbortController / no fetch options object.
   Some in-app webviews throw DataCloneError when a fetch init object
   containing an AbortSignal is passed. Plain GET + Promise.race timeout
   is the portable version. */
function timeout(ms){
  return new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out after '+(ms/1000)+'s')),ms));
}
async function getJSON(url,ms){
  const r = await Promise.race([fetch(url), timeout(ms||20000)]);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
let overpassTurn=0;
async function overpass(q){
  // Race the mirrors instead of trying them one at a time. Overpass servers
  // vary wildly in load, so the sequential version waited out a slow one
  // before even trying a fast one.
  const url=u=>u+'?data='+encodeURIComponent(q);
  /* Race at most two mirrors, rotating which. Racing every mirror on every
     query multiplies our request count, and a single tap fires several
     queries — that is how an IP gets throttled, and a throttled Overpass
     answers with nothing rather than an error. */
  const n=OVERPASS.length;
  const pick=[OVERPASS[overpassTurn%n], OVERPASS[(overpassTurn+1)%n]];
  overpassTurn=(overpassTurn+1)%n;
  const tries=pick.map(u=>getJSON(url(u),25000));
  tries.forEach(p=>p.catch(()=>{}));   // losers must not raise unhandled rejections
  if(typeof Promise.any==='function'){
    const empties=[];
    try{
      const bad=d=>d && d.remark && /error|timed out|runtime/i.test(d.remark);
      /* Overpass answers 200 with an error note instead of failing, and a
         mirror can also answer 200 with a valid but EMPTY element set while
         its database is broken. Promise.any hands back whichever mirror
         replied first, so either of those used to win the race and be taken
         as truth — which is how "no mapped structure within 7 miles" appeared
         over the Sanibel Causeway. Prefer a mirror that actually found
         something; only believe empty when every mirror says empty. */
      const d=await Promise.any(tries.map(pr=>pr.then(v=>{
        if(bad(v)) throw new Error('Overpass: '+v.remark);
        if(!v || !Array.isArray(v.elements))
          throw new Error('Overpass returned no result set');
        if(!v.elements.length){ empties.push(v); throw new Error('__empty__'); }
        return v;
      })));
      return d;
    }
    catch(e){
      if(empties.length) return empties[0];   // unanimous: genuinely nothing here
      throw new Error(e.message&&e.message.startsWith('Overpass:')?e.message:'all Overpass mirrors failed or timed out');
    }
  }
  let lastErr;
  for(const p of tries){ try{ return await p; }catch(e){ lastErr=e; } }
  throw lastErr||new Error('all Overpass mirrors failed');
}

// Score a candidate so we prefer a named lake/bay over a generic coastline
function scoreTags(tg){
  if(!tg || !tg.name) return -1;
  if(tg.boundary==='administrative') return -1;
  if(tg.natural==='water') return 100;
  if(tg.natural==='bay'||tg.natural==='strait') return 95;
  if(tg.waterway==='riverbank') return 92;
  if(tg.waterway==='river') return 88;
  if(tg.waterway==='canal'||tg.waterway==='stream') return 80;
  if(tg.place==='sea'||tg.place==='ocean') return 40;
  if(tg.leisure==='marina') return 30;
  return -1;
}

function classify(tg){
  const n=(tg.name||'').toLowerCase();
  const w=tg.water||'', nat=tg.natural||'', ww=tg.waterway||'';
  if(tg.salt==='yes') return 'salt';
  if(nat==='bay'||nat==='strait'||tg.place==='sea'||tg.place==='ocean') return 'salt';
  if(/gulf|ocean|atlantic|sound|pass|inlet|harbor|harbour|bight|key|cay/.test(n)) return 'salt';
  if(/lagoon/.test(n)||w==='lagoon') return 'brack';
  if(w==='lake'||w==='pond'||w==='reservoir'||w==='oxbow'||w==='basin') return 'fresh';
  if(ww==='river'||ww==='stream'||ww==='canal'||ww==='ditch'||ww==='riverbank') return 'brack';
  if(/lake|pond|reservoir|slough|creek(?!.*(bay|inlet))/.test(n)) return 'fresh';
  return 'unk';
}

async function identify(lat,lng){
  /* Pass 0: what you are standing ON.
     Ranking by tag type alone put natural=water (100) above waterway=canal
     (80) with distance only ever used to break a tie, so at Moore Haven a tap
     in the middle of the Caloosahatchee came back "Lake Okeechobee" — the lake
     outscored the canal from the better part of a mile away, and the same
     thing happens anywhere a river meets a bay or a sound. If a named river or
     canal runs within 70 m of the tap, that is the water the angler is on. */
  const q0 = `[out:json][timeout:15];(`+
    `way(around:70,${lat},${lng})["waterway"~"^(river|canal|stream|tidal_channel)$"]["name"];`+
    `);out tags center 12;`;
  try{
    const d = await overpass(q0);
    const near = (d.elements||[]).map(e=>{
      const tg=e.tags||{};
      const c = e.center || (e.lat!=null?{lat:e.lat,lon:e.lon}:null);
      const dist = c ? Math.hypot(c.lat-lat,(c.lon-lng)*Math.cos(lat*Math.PI/180))*111320 : 9e9;
      return {tg,dist};
    }).filter(x=>x.tg.name).sort((a,b)=>a.dist-b.dist)[0];
    if(near) return {name:near.tg.name, type:classify(near.tg), src:'waterway you tapped', tags:near.tg};
  }catch(e){ console.warn('waterway pass failed',e); }

  /* One request for both remaining passes: what encloses the point, and what
     named water lies near it. These used to be two round trips; a tap already
     fires several Overpass queries and the service throttles by IP, so every
     request saved is one less chance of being cut off and told "nothing here". */
  const q = `[out:json][timeout:25];is_in(${lat},${lng})->.a;`+
    `(area.a["natural"="water"];area.a["natural"="bay"];area.a["natural"="strait"];`+
    `area.a["waterway"];area.a["place"="sea"];);out tags;`+
    `(way(around:900,${lat},${lng})["natural"="water"]["name"];`+
    `rel(around:900,${lat},${lng})["natural"="water"]["name"];`+
    `way(around:900,${lat},${lng})["waterway"]["name"];`+
    `rel(around:2500,${lat},${lng})["waterway"="river"]["name"];`+
    `way(around:4000,${lat},${lng})["natural"~"bay|strait"]["name"];`+
    `node(around:6000,${lat},${lng})["natural"~"bay|strait"]["name"];`+
    `node(around:30000,${lat},${lng})["place"="sea"]["name"];);out tags center 60;`;
  try{
    const d = await overpass(q);
    const els = d.elements||[];
    // areas come from is_in, so the point is inside them: no distance penalty
    const areas = els.filter(e=>e.type==='area')
      .map(e=>({tg:e.tags||{}, sc:scoreTags(e.tags), rank:scoreTags(e.tags)}))
      .filter(x=>x.sc>0);
    const near = els.filter(e=>e.type!=='area').map(e=>{
      const tg=e.tags||{}, sc=scoreTags(tg);
      const c = e.center || (e.lat!=null?{lat:e.lat,lon:e.lon}:null);
      const dm = c ? Math.hypot(c.lat-lat,(c.lon-lng)*Math.cos(lat*Math.PI/180))*111320 : 9e5;
      /* Score and distance together. Score alone let a large water body
         anywhere in the search radius beat the creek under the boat; one point
         of tag score is worth about 90 m here. */
      return {tg, sc, rank: sc - dm/90};
    }).filter(x=>x.sc>0);
    const all=[...areas,...near].sort((a,b)=>b.rank-a.rank);
    if(all.length){
      const b=all[0];
      return {name:b.tg.name, type:classify(b.tg),
              src: areas.includes(b)?'contained polygon':'nearest named feature', tags:b.tg};
    }
  }catch(e){ console.warn('identify failed',e); throw e; }

  return {name:null, type:'unk', src:'not found', tags:{}};
}

/* ============ FISH RECORDS (iNaturalist) ============ */
const INAT='https://api.inaturalist.org/v1';
const FISH_TAXA='47178,47273'; // ray-finned fishes + cartilaginous fishes

async function fishHere(lat,lng,radiusKm){
  const base=`lat=${lat}&lng=${lng}&radius=${radiusKm}&taxon_id=${FISH_TAXA}&verifiable=true`;
  let err=null;
  const [counts,recent] = await Promise.all([
    getJSON(`${INAT}/observations/species_counts?${base}&per_page=40`)
      .catch(e=>{err=e.message; console.warn('iNat species_counts failed:',e.message); return {results:[]};}),
    getJSON(`${INAT}/observations?${base}&order_by=observed_on&order=desc&per_page=25&photos=true`)
      .catch(e=>{err=err||e.message; console.warn('iNat observations failed:',e.message); return {results:[]};})
  ]);
  const cs=counts.results||[], rs=recent.results||[];

  /* species_counts does not always carry default_photo, so backfill:
     1) /taxa lookup for the exact species, 2) a photo from a nearby observation. */
  const need=cs.filter(c=>c.taxon && c.taxon.id && !(c.taxon.default_photo)).map(c=>c.taxon.id);
  if(need.length){
    try{
      const tx=await getJSON(`${INAT}/taxa?id=${need.slice(0,30).join(',')}&per_page=30`);
      const byId={};
      (tx.results||[]).forEach(t=>{ if(t.default_photo) byId[t.id]=t.default_photo; });
      cs.forEach(c=>{ if(c.taxon && !c.taxon.default_photo && byId[c.taxon.id]) c.taxon.default_photo=byId[c.taxon.id]; });
    }catch(e){ console.warn('iNat taxa photo lookup failed:',e.message); }
  }
  const obsPhoto={};
  rs.forEach(o=>{
    const id=o.taxon&&o.taxon.id, p=o.photos&&o.photos[0]&&o.photos[0].url;
    if(id && p && !obsPhoto[id]) obsPhoto[id]=p.replace('square','medium');
  });
  cs.forEach(c=>{
    if(c.taxon && !c.taxon.default_photo && obsPhoto[c.taxon.id])
      c.taxon.default_photo={medium_url:obsPhoto[c.taxon.id]};
  });

  return {counts:cs, recent:rs, err};
}

function gazLookup(lat,lng){
  let best=null,bd=1e9;
  for(const g of GAZ){
    const dy=lat-g.la, dx=(lng-g.lo)*Math.cos(lat*Math.PI/180);
    const d=Math.hypot(dy,dx);
    if(d<=g.r && d<bd){ bd=d; best=g; }
  }
  return best;
}

/* ============ DIAGNOSTICS ============ */
function probeImage(url,ms){
  return new Promise(res=>{
    const i=new Image(); let done=false;
    const t=setTimeout(()=>{if(!done){done=true;res(false);}},ms||8000);
    i.onload=()=>{if(!done){done=true;clearTimeout(t);res(true);}};
    i.onerror=()=>{if(!done){done=true;clearTimeout(t);res(false);}};
    i.src=url;
  });
}
async function probeJSON(url,ms){
  try{ await getJSON(url,ms||10000); return true; }catch(e){ return false; }
}

       working fine through a mirror. */
    ['Overpass (water names)', Promise.any(OVERPASS.map(u=>
        getJSON(u+'?data='+encodeURIComponent('[out:json][timeout:10];node(26.72,-81.84,26.73,-81.83);out count;'),12000)

    ['RainViewer (radar)', probeJSON('https://api.rainviewer.com/public/weather-maps.json')],
    ['Esri dark basemap', probeImage('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/7/54/34')],
    /* Chart sources start here; CHART_FROM below must match this index.
       The old NOAA probe asked for tile/10/1732/1113 — the URL template is
       {z}/{y}/{x} and at zoom 10 the highest valid index is 1023, so it was
       out of range and ALWAYS reported blocked. The ENC service, which is the
       default depth source, was not probed at all. */
    ['NOAA ENC (depth contours)', probeImage('https://gis.charttools.noaa.gov/arcgis/rest/services/encdirect/enc_harbour/MapServer/export?bbox=-9150000,3100000,-9145000,3105000&bboxSR=3857&imageSR=3857&size=64,64&format=png32&transparent=true&layers=show:76,104&f=image')],
    ['NOAA raster charts', probeImage('https://gis.charttools.noaa.gov/arcgis/rest/services/MarineChart_Services/NOAACharts/MapServer/tile/8/108/69')],
    ['OpenSeaMap (marine overlay)', probeImage('https://tiles.openseamap.org/seamark/12/1113/1732.png')]
  ];
  const CHART_FROM=8;                     // index of the first chart source above
  const results=await Promise.all(tests.map(t=>t[1]));
  const blocked=results.filter((r,i)=>i>=3&&i<=4&&!r).length;
  const charts=results.slice(CHART_FROM);
  const chartsOk=charts.filter(Boolean).length;
  let h='<div class="loc">Connection test</div><div class="sub">What this browser is allowed to reach</div>';
  h+='<div style="margin-top:14px">';
  tests.forEach((t,i)=>{
    h+=`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px">
          <span>${esc(t[0])}</span>
          <b style="color:${results[i]?'#0a8f5f':'#c2410c'}">${results[i]?'reachable':'blocked'}</b>
        </div>`;
  });
  h+='</div>';
  if(blocked){
    h+=`<div class="err" style="margin-top:14px">
      The data APIs are blocked here. That is a restriction of this preview window, not a fault in the app — it will not fetch live water names or fish records until you open it somewhere without that restriction.
      <br><br><b>Push it to GitHub Pages and open the real URL in Safari or Chrome.</b> Everything marked blocked above should turn green there.
      <br><br>Until then the app runs on its built-in Florida list, which is marked "offline" wherever it appears.</div>`;
  } else {
    h+=`<div style="margin-top:14px;padding:10px;background:rgba(47,196,158,.10);color:var(--ink);border-left:3px solid var(--sec);border-radius:6px;font-size:12px;line-height:1.6">
      Everything is reachable. Tap the map and you will get live water names and live fish records.</div>`;
  }
  if(!chartsOk){
    h+=`<div class="err" style="margin-top:12px">
      No chart source is answering, so the 🌊 fishing map will have nothing to draw.
      If the other rows above are green, the chart hosts themselves are the problem rather than your connection.</div>`;
  } else if(chartsOk<charts.length){
    h+=`<div style="margin-top:12px;padding:10px;background:rgba(214,169,62,.12);color:var(--ink);border-left:3px solid #d6a93e;border-radius:6px;font-size:12px;line-height:1.6">
      ${chartsOk} of ${charts.length} chart sources are reachable. Open the 🌊 fishing map and use
      <b>change ›</b> on the legend to pick one that works where you fish.</div>`;
  }
  h+='<div class="foot">Tap the map to go back to fishing.</div>';
  out().innerHTML=h;
}

/* ============ SOLUNAR (computed on device, no network) ============
   Moon/sun position math adapted from the standard astronomical routines
   used by SunCalc (Vladimir Agafonkin, BSD). Feeding windows follow the
   classic solunar model: major periods when the moon is overhead or
   underfoot, minor periods at moonrise and moonset. */
const RAD=Math.PI/180, DAYMS=864e5, J1970=2440588, J2000=2451545, OBL=RAD*23.4397;
const toJulian=d=>d.valueOf()/DAYMS-0.5+J1970;
const toDays=d=>toJulian(d)-J2000;
const rightAsc=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const decl=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l));
const sidereal=(d,lw)=>RAD*(280.16+360.9856235*d)-lw;
const altOf=(H,phi,dec)=>Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));

function moonCoords(d){
  const L=RAD*(218.316+13.176396*d), M=RAD*(134.963+13.064993*d), F=RAD*(93.272+13.229350*d);
  const l=L+RAD*6.289*Math.sin(M), b=RAD*5.128*Math.sin(F), dt=385001-20905*Math.cos(M);
  return {ra:rightAsc(l,b),dec:decl(l,b),dist:dt};
}
function sunCoords(d){
  const M=RAD*(357.5291+0.98560028*d);
  const C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+RAD*102.9372+Math.PI;
  return {ra:rightAsc(L,0),dec:decl(L,0)};
}
function moonAlt(date,lat,lng){
  const lw=RAD*-lng, phi=RAD*lat, d=toDays(date), c=moonCoords(d);
  return altOf(sidereal(d,lw)-c.ra,phi,c.dec);
}
function sunAlt(date,lat,lng){
  const lw=RAD*-lng, phi=RAD*lat, d=toDays(date), c=sunCoords(d);
  return altOf(sidereal(d,lw)-c.ra,phi,c.dec);
}
function moonPhase(date){
  const d=toDays(date), s=sunCoords(d), m=moonCoords(d), sdist=149598000;
  const phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  const inc=Math.atan2(sdist*Math.sin(phi),m.dist-sdist*Math.cos(phi));
  const angle=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),
    Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
  const phase=0.5+0.5*inc*(angle<0?-1:1)/Math.PI;
  return {phase, illum:(1+Math.cos(inc))/2};
}
function phaseName(p){
  if(p<0.03||p>0.97) return 'New moon';
  if(p<0.22) return 'Waxing crescent';
  if(p<0.28) return 'First quarter';
  if(p<0.47) return 'Waxing gibbous';
  if(p<0.53) return 'Full moon';
  if(p<0.72) return 'Waning gibbous';
  if(p<0.78) return 'Last quarter';
  return 'Waning crescent';
}
function phaseEmoji(p){
  const i=Math.round(p*8)%8;
  return ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][i];
}
/* Scan a day at 10-minute steps for rise, set and the overhead/underfoot times */
function scanDay(altFn,base,lat,lng){
  const step=10*60000, n=(24*60)/10;
  let prev=altFn(base,lat,lng), rise=null,set=null,peak=base,low=base,pv=prev,lv=prev;
  for(let i=1;i<=n;i++){
    const t=new Date(base.getTime()+i*step), a=altFn(t,lat,lng);
    if(prev<0&&a>=0&&!rise) rise=t;
    if(prev>0&&a<=0&&!set) set=t;
    if(a>pv){pv=a;peak=t;}
    if(a<lv){lv=a;low=t;}
    prev=a;
  }
  return {rise,set,peak,low};
}
function localMidnight(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0); }
const fmtT=d=>d?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—';

/* scanDay walks a whole day in ten-minute steps evaluating moon and sun
   altitude — ~145 trig-heavy samples. solunar() is called once per hour per
   day by the forecast (8 days x 24 hours), and every one of those 24 calls was
   re-scanning the SAME day from the same local midnight: roughly 55,000
   evaluations on the main thread for one render, 24x more than needed. The
   scan depends only on the place and the calendar day, so cache it. */
const _solCache=new Map();
function scanDayCached(fn,base,lat,lng,tag){
  const k=tag+'|'+base.getTime()+'|'+lat.toFixed(3)+'|'+lng.toFixed(3);
  let v=_solCache.get(k);
  if(v===undefined){
    v=scanDay(fn,base,lat,lng);
    if(_solCache.size>400) _solCache.clear();   // bounded: a few days of panning
    _solCache.set(k,v);
  }
  return v;
}
function solunar(lat,lng,when){
  const now=when||new Date(), base=localMidnight(now);
  const m=scanDayCached(moonAlt,base,lat,lng,'m'), s=scanDayCached(sunAlt,base,lat,lng,'s');
  const ph=moonPhase(now);
  const win=(c,mins,kind,label)=>c?{start:new Date(c.getTime()-mins*60000),end:new Date(c.getTime()+mins*60000),kind,label,peak:c}:null;
  let periods=[
    win(m.peak,60,'major','Moon overhead'),
    win(m.low,60,'major','Moon underfoot'),
    win(m.rise,45,'minor','Moonrise'),
    win(m.set,45,'minor','Moonset')
  ].filter(Boolean).sort((a,b)=>a.start-b.start);
  // a window straddling sunrise or sunset is the strongest of all
  periods.forEach(p=>{
    p.prime=[s.rise,s.set].some(t=>t && Math.abs(t-p.peak)<75*60000);
    p.active = now>=p.start && now<=p.end;
  });
  const d=Math.min(Math.abs(ph.phase-0),Math.abs(ph.phase-0.5),Math.abs(ph.phase-1));
  const rating = d<0.045?{t:'Excellent',c:'#0a8f5f'} : d<0.11?{t:'Good',c:'#4a9d3f'}
               : d<0.20?{t:'Fair',c:'#b08a2e'} : {t:'Average',c:'#8b95a1'};
  return {periods,sun:s,moon:m,phase:ph,rating,now};
}

/* ============ TIDES (NOAA CO-OPS) ============ */

// Verified primary Florida stations, used if the full station list will not load

  {id:'8729840',name:'Pensacola',lat:30.404,lng:-87.211}
];
let STATION_CACHE=null;
async function stationList(){
  if(STATION_CACHE) return STATION_CACHE;
  try{
    const d=await getJSON(`${CO_OPS}/mdapi/prod/webapi/stations.json?type=tidepredictions&units=english`,20000);
    const fl=(d.stations||[]).filter(s=>s.lat>23.5&&s.lat<31.5&&s.lng>-88.5&&s.lng<-79.5)
      .map(s=>({id:s.id,name:s.name,lat:s.lat,lng:s.lng}));
    STATION_CACHE = fl.length>20 ? fl : FALLBACK_STATIONS;
    console.log('tide stations loaded:',STATION_CACHE.length);
  }catch(e){
    console.warn('station list failed, using fallback:',e.message);
    STATION_CACHE=FALLBACK_STATIONS;
  }
  return STATION_CACHE;
}
function haversineKm(a,b,c,d){
  const R=6371,dLat=(c-a)*RAD,dLon=(d-b)*RAD;
  const x=Math.sin(dLat/2)**2+Math.cos(a*RAD)*Math.cos(c*RAD)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
/* Distances are computed in km internally but always shown in miles. */
const KM_PER_MI=1.609344;
function mi(km,dp){ return (km/KM_PER_MI).toFixed(dp==null?1:dp); }
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
async function tidesFor(lat,lng){
  const st=await stationList();
  let best=null,bd=1e9;
  st.forEach(s=>{const d=haversineKm(lat,lng,s.lat,s.lng); if(d<bd){bd=d;best=s;}});
  if(!best||bd>120) return {station:null,dist:bd,preds:[]};
  const today=new Date(), tmr=new Date(today.getTime()+DAYMS);
  const url=`${CO_OPS}/api/prod/datagetter?product=predictions&application=Bitecast`+
    `&begin_date=${ymd(today)}&end_date=${ymd(tmr)}&datum=MLLW&station=${best.id}`+
    `&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
  const d=await getJSON(url,20000);
  /* NOAA reports failure as HTTP 200 with an {error:{message}} body, so a
     status-code check sees success and the tide panel just goes quietly
     empty. Surface it instead. */
  if(d && d.error) throw new Error('NOAA tides: '+(d.error.message||'request rejected'));
  const preds=(d.predictions||[]).map(p=>({t:new Date(p.t.replace(' ','T')),v:parseFloat(p.v),hi:p.type==='H'}));
  let temp=null;
  try{
    const w=await getJSON(`${CO_OPS}/api/prod/datagetter?product=water_temperature&application=Bitecast`+
      `&date=latest&station=${best.id}&time_zone=lst_ldt&units=english&format=json`,12000);
    if(w && !w.error && w.data && w.data[0]) temp=parseFloat(w.data[0].v);
  }catch(e){}
  return {station:best,dist:bd,preds,temp};
}
function setCondDay(d){ state.condDay=d; render(); }

function condHTML(){
  const {lat,lng,type,tide,tideErr}=state;
  const day = state.condDay||'today';
  const isTom = day==='tomorrow';
  const now=new Date();
  const target = isTom ? new Date(now.getTime()+DAYMS) : now;
  const s=solunar(lat,lng,target);
  let h='';

  h+=`<div class="daysw">
        <button class="dbtn ${!isTom?'on':''}" onclick="setCondDay('today')">Today</button>
        <button class="dbtn ${isTom?'on':''}" onclick="setCondDay('tomorrow')">Tomorrow</button>
      </div>`;

  h+=`<div class="sol">
        <div class="solhead">
          <div><div class="solph">${phaseEmoji(s.phase.phase)} ${esc(phaseName(s.phase.phase))}</div>
          <div class="solsub">${Math.round(s.phase.illum*100)}% lit · ☀️ ${fmtT(s.sun.rise)} – ${fmtT(s.sun.set)}</div></div>
          <div class="solrate" style="background:${s.rating.c}">${s.rating.t}</div>
        </div>
        <div class="solnote">Solunar theory: fish feed hardest when the moon is directly overhead or underfoot, and again at moonrise and moonset. New and full moons are strongest.</div>
      </div>`;

  h+=`<div class="lbl">Feeding windows ${isTom?'tomorrow':'today'}</div>`;
  s.periods.forEach(p=>{
    const past = !isTom && p.end<now;
    const live = !isTom && p.active;
    h+=`<div class="win ${p.kind}${live?' live':''}${past?' past':''}">
          <div class="winl">
            <div class="wint">${fmtT(p.start)} – ${fmtT(p.end)}</div>
            <div class="winn">${esc(p.label)} · ${p.kind==='major'?'Major':'Minor'}${p.prime?' · 🔥 overlaps sun':''}</div>
          </div>
          <div class="winb">${live?'NOW':past?'past':isTom?'':'later'}</div>
        </div>`;
  });
  if(!isTom && s.periods.every(p=>p.end<now))
    h+=`<div class="nod">Today's windows have all passed. Check tomorrow — they shift about 50 minutes later each day.</div>`;

  h+=`<div class="lbl" style="margin-top:16px">Tide ${isTom?'tomorrow':'today'}</div>`;
  if(type==='fresh'){
    h+=`<div class="nod">This is fresh water — no tide. Use the feeding windows above, plus first and last light.</div>`;
  } else if(tideErr){
    h+=`<div class="err">Tide lookup failed: ${esc(tideErr)}</div>`;
  } else if(!tide){
    h+=`<div class="nod"><span class="spin"></span>Loading tide predictions…</div>`;
  } else if(!tide.station){
    h+=`<div class="nod">No NOAA tide station within range of this spot.</div>`;
  } else {
    const tgt=isTom?new Date(now.getTime()+DAYMS):now;
    const sameDay=d=>d.getFullYear()===tgt.getFullYear()&&d.getMonth()===tgt.getMonth()&&d.getDate()===tgt.getDate();
    const rows=tide.preds.filter(p=>sameDay(p.t));
    h+=`<div class="stn">📍 ${esc(tide.station.name)} · ${mi(tide.dist,0)} mi away${tide.temp?` · 🌡️ ${tide.temp.toFixed(0)}°F water`:''}</div>`;
    if(!rows.length){
      h+=`<div class="nod">No predictions returned for ${isTom?'tomorrow':'today'}.</div>`;
    }
    rows.forEach(p=>{
      const mins=Math.round((p.t-now)/60000);
      let when;
      if(mins<0) when='passed';
      else if(mins<60) when=`in ${mins} min`;
      else when=`in ${Math.floor(mins/60)}h ${mins%60}m`;
      h+=`<div class="tide ${p.hi?'hi':'lo'}${mins<0?' past':''}">
            <div><div class="tidet">${p.hi?'▲ High':'▼ Low'} · ${fmtT(p.t)}</div>
            <div class="tidesub">${p.v.toFixed(1)} ft</div></div>
            <div class="tidein">${esc(when)}</div>
          </div>`;
    });
    h+=`<div class="solnote" style="margin-top:8px">Moving water beats slack water. The hour either side of a tide change is usually the best bite, especially where the current squeezes past a point, bridge or pass.</div>`;
  }

  h+=`<div class="foot">Feeding windows are calculated on your device from the moon's position — they work with no signal. Tide predictions from NOAA CO-OPS. Predictions are astronomical; wind and pressure can shift real water levels.</div>`;
  return h;
}

/* ============================================================
   BITECAST ACCOUNTS & COMMUNITY  (Supabase)
   The anon key is meant to live in client code. It is only safe
   because row-level security is enabled on every table — see
   bitecast-schema.sql. Never put the service_role key here.
   ============================================================ */
const CFG = window.BITECAST || {};
const SUPABASE_URL = CFG.SUPABASE_URL || 'https://ufubcigcoqlpmcmcsneq.supabase.co';

let sb=null, ME=null, MYPROFILE=null;

/* Key comes from the config block first so it works for everyone, then falls
   back to whatever this device saved. The anon key is meant to be public —
   row-level security is what protects the data. */
function anonKey(){
  return (CFG.SUPABASE_ANON_KEY||'').trim() || localStorage.getItem('bc_key') || '';
}
function initSupabase(){
  const key=anonKey();
  if(!key || !window.supabase) return false;
  try{
    sb=window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true}});
    sb.auth.onAuthStateChange((_e,session)=>{ ME=session?session.user:null; loadMyProfile(); paintAcct(); });
    sb.auth.getSession().then(({data})=>{ ME=data.session?data.session.user:null; loadMyProfile(); paintAcct(); });
    return true;
  }catch(e){ console.warn('supabase init failed',e); return false; }
}
async function loadMyProfile(){
  if(!sb||!ME){ MYPROFILE=null; return; }
  const {data}=await sb.from('profiles').select('*').eq('id',ME.id).maybeSingle();
  MYPROFILE=data||null; paintAcct();
}
function paintAcct(){
  const b=document.getElementById('acctbtn'); if(!b) return;
  if(ME){ b.textContent='@'+((MYPROFILE&&MYPROFILE.username)||'me'); b.classList.add('in'); }
  else { b.textContent='Sign in'; b.classList.remove('in'); }
}

/* ---------- photo handling ---------- */
function shrinkImage(file,maxPx){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,(maxPx||1600)/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('could not process image')),'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('could not read that image'));};
    img.src=url;
  });
}
let PENDING_PHOTO=null;
async function pickPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{
    PENDING_PHOTO=await shrinkImage(f,1600);
    const pv=document.getElementById('pv');
    pv.src=URL.createObjectURL(PENDING_PHOTO); pv.style.display='block';
  }catch(e){ setMsg(e.message); }
}
