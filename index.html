<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatchMate - Detailed Fishing Guide</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0066cc;
            --secondary: #00a86b;
            --accent: #ff6b35;
            --dark: #1a1a2e;
            --light: #f5f7fa;
            --border: #e0e6ed;
        }
        html, body { height: 100%; width: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--light); }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 450px; background: white; display: flex; flex-direction: column; box-shadow: 2px 0 12px rgba(0,0,0,0.1); }
        .map-area { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .header { padding: 18px; border-bottom: 1px solid var(--border); }
        .logo { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .instruction { font-size: 11px; color: #666; padding: 8px; background: #f0f7ff; border-radius: 6px; border-left: 3px solid var(--primary); }
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .location-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: var(--dark); }
        .location-sub { font-size: 12px; color: #666; margin-bottom: 16px; }
        .fish-section { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .fish-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; cursor: pointer; }
        .fish-title { font-weight: 600; font-size: 15px; color: var(--dark); }
        .fish-rank { font-size: 12px; font-weight: 700; padding: 3px 8px; background: var(--secondary); color: white; border-radius: 4px; }
        .fish-meta { font-size: 11px; color: #666; margin-bottom: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
        .toggle-icon { color: var(--primary); font-weight: 700; }
        .fish-details { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
        .fish-details.active { display: block; }
        .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary); margin-top: 10px; margin-bottom: 6px; }
        .bait-option { background: #f9f9f9; border-left: 3px solid var(--secondary); padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; }
        .bait-name { font-weight: 600; color: var(--dark); margin-bottom: 4px; }
        .bait-detail { font-size: 11px; color: #666; line-height: 1.5; margin-bottom: 4px; }
        .setup-box { background: #f0f7ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 11px; line-height: 1.6; color: var(--dark); }
        .setup-title { font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .how-to { background: linear-gradient(135deg, #fff3f0 0%, #ffe8e0 100%); border-left: 3px solid var(--accent); padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 11px; line-height: 1.6; }
        .how-title { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
        .best-time { background: #f0fdf4; border-left: 3px solid var(--secondary); padding: 8px; margin-top: 8px; border-radius: 6px; font-size: 11px; }
        .best-title { font-weight: 700; color: var(--secondary); margin-bottom: 2px; }
        .best-text { color: #666; line-height: 1.5; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 700px; margin: 20px auto; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; }
        .modal-title { font-size: 22px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; }
        .modal-body { padding: 20px; }
        .species-list { display: flex; flex-direction: column; gap: 12px; }
        .species-card { background: var(--light); padding: 14px; border-radius: 8px; border-left: 4px solid var(--primary); cursor: pointer; transition: all 0.2s; }
        .species-card:hover { background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .species-rank { font-size: 12px; font-weight: 700; color: var(--primary); }
        .species-name { font-size: 16px; font-weight: 700; color: var(--dark); margin: 4px 0; }
        .species-note { font-size: 12px; color: #666; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: 45%; }
            .map-area { height: 55%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <div class="logo">🎣 CatchMate</div>
                <div class="instruction">📍 Click anywhere on map to see detailed fishing guides for that location</div>
            </div>
            <div class="content" id="sidebar-content">
                <div class="empty-state">
                    <div class="empty-icon">🗺️</div>
                    <div style="font-weight: 600; margin-bottom: 8px;">Select a Location</div>
                    <div>Zoom in and click on Florida map</div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="map-area" id="map"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Species Guide</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([27.5, -81.5], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);

        let mapMarker = null;

        // Comprehensive fishing database
        const fishingData = {
            'moore-haven': {
                name: 'Moore Haven',
                water: 'Lake Okeechobee',
                species: [
                    {
                        rank: '#1 Most Popular',
                        name: 'Largemouth Bass',
                        emoji: '🐟',
                        difficulty: 'Intermediate',
                        score: 9,
                        description: 'Trophy bass, 2-12+ lbs. Available year-round.',
                        baits: [
                            {
                                name: 'Senko Worm (5" Yamamoto)',
                                colors: 'Green Pumpkin, Watermelon Red Flake, Black/Blue',
                                size: '5 inches',
                                rigging: 'WEIGHTLESS TEXAS RIG • Hook: 3/0-4/0 offset worm hook • Insert hook 1/4" into worm head, exit middle of worm, keep worm straight',
                                technique: 'Cast near grass/cover → twitch 2x → let fall freely on slack line → watch for bite during fall → SET HARD when you feel weight',
                                attract: 'Bass chase falling baits. Slow wobble as it falls = irresistible. Small twitches trigger strikes in heavy cover.'
                            },
                            {
                                name: 'Live Golden Shiners',
                                size: '4-6 inches',
                                colors: 'Silver/gold with black stripe',
                                rigging: 'TEXAS RIG WEIGHTED • Slip 1/4-5/8 oz bullet weight on line → 3/0 worm hook → hook shiner through lips or behind gill',
                                technique: 'Cast to brush piles → pitch into shallow vegetation → let sit briefly → slow retrieve near bottom → pause at cover edges',
                                attract: 'Bass hunt live baitfish. Natural swimming action + vibrations = predatory strikes. Keep shiner lively.'
                            }
                        ],
                        bestTime: { season: 'March-May (spawn), Sept-Nov (fall)', time: 'Sunrise-8am, sunset-dark', temp: '60-75°F', moon: 'Full moon (spring spawn)' }
                    },
                    {
                        rank: '#2 Most Popular',
                        name: 'Black Crappie (Speckled Perch)',
                        emoji: '🐟',
                        difficulty: 'Easy',
                        score: 8,
                        description: 'Schools of 12-15 inch fish. Easy to catch, great table fare.',
                        baits: [
                            {
                                name: 'Live Shiners/Minnows',
                                size: '2-4 inches (small)',
                                colors: 'Silver, white belly',
                                rigging: 'SLIP FLOAT RIG • Main line → bobber stop knot 6-10 ft above hook → slip bobber → split shot 12" above hook → 1/16 oz jig or #4 Aberdeen hook → minnow through lips',
                                technique: 'Cast near brush piles, docks, vegetation → let bait suspend → watch bobber twitch → bobber goes under = REEL UP AND SET HOOK immediately',
                                attract: 'Crappie hover in cover waiting for small prey to pass. Suspended minnow = easy meal. Vertical jigging of minnow triggers strikes.'
                            },
                            {
                                name: 'Small Jigs (1/32-1/16 oz)',
                                colors: 'White, chartreuse, yellow',
                                size: '1-2 inches',
                                rigging: 'JIG+MINNOW BOBBER • Slip bobber → bobber stop 6-8 ft → 1/16 oz jig (white) → thread minnow on jig hook by lips',
                                technique: 'Vertical drop-jigging near structure → subtle up/down motion 6-12 inches → pause → watch for bobber twitch → SET on any movement',
                                attract: 'Small jigging action mimics baitfish behavior. Subtle bobbing = wounded minnow = instinctive strike.'
                            }
                        ],
                        bestTime: { season: 'November - February (peak)', time: 'Early morning, dusk, overcast days', temp: '50-60°F', moon: 'Any phase' }
                    },
                    {
                        rank: '#3 Most Popular',
                        name: 'Bluegill (Bream)',
                        emoji: '🐟',
                        difficulty: 'Very Easy',
                        score: 7,
                        description: 'Classic panfish, 6-10 inches, abundant, fun for kids.',
                        baits: [
                            {
                                name: 'Live Crickets or Red Worms',
                                size: 'Whole cricket or 2-3" worm segment',
                                rigging: 'SIMPLE BOBBER RIG • Line → bobber 2-3 ft above hook → #8-10 small hook → worm or cricket on hook',
                                technique: 'Cast near reeds/grass beds in shallow water → bobber keeps bait suspended • Bluegill will strike immediately • Reel up when bobber dips',
                                attract: 'Bluegill eat insects constantly. Natural live bait = irresistible. They feed aggressively year-round.'
                            },
                            {
                                name: 'Live Minnows (small)',
                                size: '2-3 inches',
                                colors: 'Silvery white',
                                rigging: 'SMALL BOBBER + LIGHT RIG • Bobber 3-4 ft up → #6 hook through minnow lips lightly → NO weight needed',
                                technique: 'Cast to bed locations (spring/summer) → let sit • Bluegill spawn in circles = easy spotting • Watch for bobber movement',
                                attract: 'Easy prey. Minnow wiggling triggers feeding reflex. Focus on beds (sandy/gravelly areas 1-4 ft deep).'
                            }
                        ],
                        bestTime: { season: 'Year-round, best spring-summer (bedding)', time: 'Warm daylight hours, shallow beds', temp: 'Any, aggressive 65-80°F', moon: 'Any' }
                    },
                    {
                        rank: '#4 Most Popular',
                        name: 'Redear Sunfish (Shellcracker)',
                        emoji: '🐟',
                        difficulty: 'Easy',
                        score: 7,
                        description: 'Large panfish 10-12 inches. Excellent eating, visual spawning beds.',
                        baits: [
                            {
                                name: 'Small Crayfish or Softshell Crabs',
                                size: '1-2 inches',
                                rigging: 'BOBBER + SMALL HOOK • Bobber 3-4 ft • #6-8 hook • Crayfish hooked lightly through tail',
                                technique: 'Target sandy/rocky beds spring-early summer → cast near bed perimeter → let sit • Shellcrackers crush hard-shell prey → QUICK HOOK SET',
                                attract: 'Shellcrackers are bottom feeders that crush snails and crabs. Hard-shell crayfish = natural prey. Watch for nests in shallow water.'
                            },
                            {
                                name: 'Red Worms or Earthworms',
                                size: '4-6 inches full worm',
                                rigging: 'WEIGHTED BOBBER RIG • Bobber 3-4 ft • Small split shot 12" above hook • #6-8 hook • Thread worm naturally',
                                technique: 'Cast to weed edges and structures • Keep worm moving slowly • Gentle vibrations attract bottom-feeders',
                                attract: 'Natural bottom prey. Moving worm = feeding response. Deeper structure = bigger shellcrackers.'
                            }
                        ],
                        bestTime: { season: 'Spring-early summer (spawn), year-round possible', time: 'Sunrise-9am, late afternoon-dusk', temp: '65-75°F optimal', moon: 'Full moon (spawn trigger)' }
                    },
                    {
                        rank: '#5 Most Popular',
                        name: 'Channel Catfish',
                        emoji: '🐟',
                        difficulty: 'Easy',
                        score: 7,
                        description: 'Steady action, nocturnal, 2-20 lbs, catfish everywhere.',
                        baits: [
                            {
                                name: 'Chicken Liver or Stink Bait',
                                size: 'Golf ball-sized chunks',
                                rigging: 'SIMPLE BOTTOM RIG • Slip sinker on line → swivel → 3-4" leader → #2-4 circle hook → bait on hook',
                                technique: 'Cast to deep holes, channel drops • Let sit on bottom • Catfish find bait by smell (no vision needed) • Wait for run/hard bite → REEL',
                                attract: 'Catfish hunt by smell + lateral line sensing. Strong-smelling baits create scent clouds = attract from far away. Movement = dinner bell.'
                            },
                            {
                                name: 'Fresh Cut Mullet or Shad',
                                size: '3-4" chunks with skin on',
                                colors: 'Silver flesh, dark skin',
                                rigging: '3-WAY RIG • Main line → 3-way swivel → 12" dropper with sinker (stays on bottom) + 18" leader with #2 circle hook + cut bait',
                                technique: 'Night fishing best • Cast to holes/bends in Rim Canal • Catfish track scent plume • Multiple rods allowed = cover more water',
                                attract: 'Cut bait releases strong odor into water. Catfish have incredible nose - can smell from 100s of yards away. Oily fish = best catfish attractant.'
                            }
                        ],
                        bestTime: { season: 'Year-round (best warm months)', time: 'NIGHT FISHING peak (dusk-dawn)', temp: 'Active 65-85°F', moon: 'Any (nocturnal)' }
                    }
                ],
                guides: [
                    { name: 'Bass Flats & Beyond - Capt. John Larsen', rating: '4.9/5', link: 'https://fishingbooker.com' },
                    { name: 'On The Hook Guide Fishing', rating: '4.8/5', link: 'https://fishingbooker.com' }
                ]
            }
        };

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (mapMarker) map.removeLayer(mapMarker);
            mapMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#ff6b35', color: 'white', weight: 2, opacity: 1, fillOpacity: 0.8 }).addTo(map);

            // Get location (hardcoded for Moore Haven, expandable to other areas)
            const location = fishingData['moore-haven'];
            displayLocation(location, lat, lng);
        });

        function displayLocation(loc, lat, lng) {
            const sidebar = document.getElementById('sidebar-content');
            let html = `
                <div class="location-title">${loc.name}</div>
                <div class="location-sub">📍 ${lat.toFixed(4)}, ${lng.toFixed(4)} • ${loc.water}</div>
            `;

            loc.species.forEach((fish, idx) => {
                html += `
                    <div class="fish-section" onclick="toggleFish(this)">
                        <div class="fish-header">
                            <div>
                                <div class="fish-rank">${fish.rank}</div>
                                <div class="fish-title">${fish.emoji} ${fish.name}</div>
                                <div class="fish-meta">
                                    <span>${fish.difficulty}</span>
                                    <span>⭐ ${fish.score}/10</span>
                                </div>
                            </div>
                            <div class="toggle-icon">▼</div>
                        </div>
                        <div class="fish-details" id="fish-${idx}">
                            <div style="color: #666; font-size: 12px; margin-bottom: 12px;">${fish.description}</div>
                            
                            <div class="section-label">🎣 Verified Baits & Rigs</div>
                `;

                fish.baits.forEach(bait => {
                    html += `
                        <div class="bait-option">
                            <div class="bait-name">${bait.name}</div>
                            ${bait.size ? `<div class="bait-detail"><strong>Size:</strong> ${bait.size}</div>` : ''}
                            ${bait.colors ? `<div class="bait-detail"><strong>Colors:</strong> ${bait.colors}</div>` : ''}
                            
                            <div class="setup-box">
                                <div class="setup-title">🔧 RIG SETUP (Step-by-Step)</div>
                                ${bait.rigging}
                            </div>
                            
                            <div class="how-to">
                                <div class="how-title">🎯 HOW TO FISH IT</div>
                                ${bait.technique}
                            </div>
                            
                            <div class="how-to" style="background: #f3f0ff; border-left-color: #9333ea;">
                                <div class="how-title" style="color: #9333ea;">✨ WHAT ATTRACTS THE FISH</div>
                                ${bait.attract}
                            </div>
                        </div>
                    `;
                });

                html += `
                            <div class="best-time">
                                <div class="best-title">⏰ Best Time to Catch</div>
                                <div class="best-text">
                                    📅 Season: ${fish.bestTime.season}<br>
                                    🌅 Time: ${fish.bestTime.time}<br>
                                    🌡️ Water: ${fish.bestTime.temp}<br>
                                    🌙 Moon: ${fish.bestTime.moon}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            sidebar.innerHTML = html;
        }

        function toggleFish(element) {
            const details = element.querySelector('.fish-details');
            const icon = element.querySelector('.toggle-icon');
            details.classList.toggle('active');
            icon.textContent = details.classList.contains('active') ? '▲' : '▼';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>
</body>
</html>
