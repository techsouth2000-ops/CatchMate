            attribution: '© OpenStreetMap',
            maxZoom: 19
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        const hybridLayer = L.tileLayer.wms('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        // Water depth contours layer (GeoServer or custom)
        const depthLayer = L.tileLayer('https://tiles.gebco.net/gebco_latest/gebco_latest.png', {
            attribution: 'GEBCO',
            maxZoom: 15,
            opacity: 0.6
        });

        // Weather radar layer (NOAA)
        const radarLayer = L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png', {
            attribution: 'NOAA',
            maxZoom: 15,
            opacity: 0.7
        });

        osmLayer.addTo(map);
        let currentLayer = 'osm';
        let depthLayerActive = false;
        let radarLayerActive = false;

        function switchLayer(layerName) {
            // Remove all base layers
            map.eachLayer(layer => {
                if (layer instanceof L.TileLayer && layer !== depthLayer && layer !== radarLayer) {
                    map.removeLayer(layer);
                }
            });

            // Add selected layer
            if (layerName === 'osm') {
                osmLayer.addTo(map);
                currentLayer = 'osm';
            } else if (layerName === 'satellite') {
                satelliteLayer.addTo(map);
                currentLayer = 'satellite';
            } else if (layerName === 'hybrid') {
                hybridLayer.addTo(map);
                currentLayer = 'hybrid';
            }

            // Update button states
            document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function toggleDepth() {
            if (depthLayerActive) {
                map.removeLayer(depthLayer);
                depthLayerActive = false;
                event.target.classList.remove('active');
            } else {
                depthLayer.addTo(map);
                depthLayerActive = true;
                event.target.classList.add('active');
            }
        }

        function toggleRadar() {
            if (radarLayerActive) {
                map.removeLayer(radarLayer);
                radarLayerActive = false;
                event.target.classList.remove('active');
            } else {
                radarLayer.addTo(map);
                radarLayerActive = true;
                event.target.classList.add('active');

        function getDistanceBetweenCoords(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getNearestLocation(lat, lng) {
            let nearest = null;
            let minDistance = Infinity;

            Object.values(fishingLocations).forEach(loc => {
                const distance = getDistanceBetweenCoords(lat, lng, loc.lat, loc.lng);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearest = loc;
                }
            });

            return nearest || fishingLocations['moore-haven'];
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (mapMarker) map.removeLayer(mapMarker);
            mapMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#ff6b35', color: 'white', weight: 2, opacity: 1, fillOpacity: 0.8 }).addTo(map);

            const location = getNearestLocation(lat, lng);
            displayLocation(location, lat, lng);
        });

                        </div>
