            attribution: '© OpenStreetMap',
            maxZoom: 19

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        const depthLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: 'OpenTopoMap',
            maxZoom: 17,
            opacity: 0.7
        });

        const radarLayer = L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=1d4bc3066afee898d66e3f1da4760505', {
            attribution: 'OpenWeatherMap',
            maxZoom: 16,
            opacity: 0.7
        });

        osmLayer.addTo(map);
        let depthLayerActive = false;
        let radarLayerActive = false;

        function switchLayer(layerName) {
            map.eachLayer(layer => {
                if (layer instanceof L.TileLayer && layer !== depthLayer && layer !== radarLayer) {
                    map.removeLayer(layer);
                }
            });

            document.getElementById('mapbtn').classList.remove('active');
            document.getElementById('satbtn').classList.remove('active');

            if (layerName === 'osm') {
                osmLayer.addTo(map);
                document.getElementById('mapbtn').classList.add('active');
            } else if (layerName === 'satellite') {
                satelliteLayer.addTo(map);
                document.getElementById('satbtn').classList.add('active');
            }
        }

        function toggleDepth() {
            const btn = document.getElementById('depthbtn');
            if (depthLayerActive) {
                map.removeLayer(depthLayer);
                depthLayerActive = false;
                btn.classList.remove('active');
            } else {
                depthLayer.addTo(map);
                depthLayerActive = true;
                btn.classList.add('active');
            }
        }

        function toggleRadar() {
            const btn = document.getElementById('radarbtn');
            if (radarLayerActive) {
                map.removeLayer(radarLayer);
                radarLayerActive = false;
                btn.classList.remove('active');
            } else {
                radarLayer.addTo(map);

                                attract: 'Hunt small shrimp. Easy strikes.'
                            }
                        ],
                        bestTime: { season: 'Sept-April', time: 'Early morning', temp: '70-78°F', moon: 'Any phase' }
                    },
                    {
                        rank: '#5 Most Popular',
                        name: 'Black Drum',
                        emoji: '🐟',
                        difficulty: 'Intermediate',
                        score: 7,
                        description: 'Bottom feeder, 5-50+ lbs. Crustacean hunter.',
                        baits: [
                            {
                                name: 'Live Crabs',
                                size: '2-3 inches',
                                rigging: 'BOTTOM RIG • 30 lb leader • #2 hook',
                                technique: 'Fish bottom near structure • Hard pull = bite',
                                attract: 'Powerful crushing jaws.'
                            }
                        ],
                        bestTime: { season: 'Oct-May', time: 'Early morning', temp: '70-78°F', moon: 'Any phase' }
                    }
                ]
            }
        ];

        function getLocationAtPoint(lat, lng) {
            for (let region of fishingRegions) {
                if (lat >= region.bounds.minLat && lat <= region.bounds.maxLat &&
                    lng >= region.bounds.minLng && lng <= region.bounds.maxLng) {
                    return region;
                }
            }
            return fishingRegions[0]; // Default to Moore Haven
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (mapMarker) map.removeLayer(mapMarker);
            mapMarker = L.circleMarker([lat, lng], { 
                radius: 8, 
                fillColor: '#ff6b35', 
                color: 'white', 
                weight: 2, 
                opacity: 1, 
                fillOpacity: 0.8 
            }).addTo(map);

            const location = getLocationAtPoint(lat, lng);
            displayLocation(location, lat, lng);
        });

        function displayLocation(loc, lat, lng) {
            const sidebar = document.getElementById('sidebar-content');
            let html = `
                <div class="location-title">${loc.name}</div>
                <div class="location-sub">📍 ${lat.toFixed(4)}, ${lng.toFixed(4)} • ${loc.water}</div>
            `;

            loc.species.forEach((fish, idx) => {
                html += `
                    <div class="fish-section" onclick="toggleFish(this)">
                        <div class="fish-header">
                            <div>
                                <div class="fish-rank">${fish.rank}</div>
                                <div class="fish-title">${fish.emoji} ${fish.name}</div>
                                <div class="fish-meta">
                                    <span>${fish.difficulty}</span>
                                    <span>⭐ ${fish.score}/10</span>
                                </div>
                            </div>
                            <div class="toggle-icon">▼</div>
                        </div>
                        <div class="fish-details" id="fish-${idx}">
                            <div style="color: #666; font-size: 12px; margin-bottom: 12px;">${fish.description}</div>
                            
                            <div class="section-label">🎣 Verified Baits & Rigs</div>
                `;

                fish.baits.forEach(bait => {
                    html += `
                        <div class="bait-option">
                            <div class="bait-name">${bait.name}</div>
                            ${bait.size ? `<div class="bait-detail"><strong>Size:</strong> ${bait.size}</div>` : ''}
                            ${bait.colors ? `<div class="bait-detail"><strong>Colors:</strong> ${bait.colors}</div>` : ''}
                            
                            <div class="setup-box">
                                <div class="setup-title">🔧 RIG SETUP</div>
                                ${bait.rigging}
                            </div>
                            
                            <div class="how-to">
                                <div class="how-title">🎯 HOW TO FISH IT</div>
                                ${bait.technique}
                            </div>
                            
                            <div class="how-to" style="background: #f3f0ff; border-left-color: #9333ea;">
                                <div class="how-title" style="color: #9333ea;">✨ ATTRACTS FISH</div>
                                ${bait.attract}
                            </div>
                        </div>
                    `;
                });

                html += `
                            <div class="best-time">
                                <div class="best-title">⏰ Best Time to Catch</div>
                                <div class="best-text">
                                    📅 Season: ${fish.bestTime.season}<br>
                                    🌅 Time: ${fish.bestTime.time}<br>
                                    🌡️ Water: ${fish.bestTime.temp}<br>
                                    🌙 Moon: ${fish.bestTime.moon}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            sidebar.innerHTML = html;
        }

        function toggleFish(element) {
            const details = element.querySelector('.fish-details');
            const icon = element.querySelector('.toggle-icon');
            details.classList.toggle('active');
            icon.textContent = details.classList.contains('active') ? '▲' : '▼';
        }
    </script>
</body>
</html>
