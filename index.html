<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatchMate - Florida Fishing Guide</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0066cc;
            --secondary: #00a86b;
            --accent: #ff6b35;
            --dark: #1a1a2e;
            --light: #f5f7fa;
            --border: #e0e6ed;
            --text-dark: #2d3748;
            --text-light: #718096;
        }
        html, body { height: 100%; width: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif; background: var(--light); color: var(--text-dark); }
        .container { display: flex; height: 100vh; width: 100%; }
        .sidebar { width: 380px; background: white; display: flex; flex-direction: column; box-shadow: 2px 0 12px rgba(0,0,0,0.08); overflow-y: auto; }
        .map-area { flex: 1; background: linear-gradient(135deg, #e3f2fd 0%, #f0f4ff 100%); position: relative; overflow: hidden; }
        .header { padding: 24px 20px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        .logo-text { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .search-box { display: flex; gap: 8px; }
        .search-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; transition: all 0.3s; }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
        .btn-search { padding: 10px 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; }
        .btn-search:hover { background: #0052a3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3); }
        .content { flex: 1; overflow-y: auto; padding: 24px 20px; }
        .section { margin-bottom: 32px; }
        .section-title { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .location-name { font-size: 24px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .location-coords { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
        .fish-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); transition: all 0.3s; }
        .fish-item:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(0, 102, 204, 0.15); transform: translateY(-2px); }
        .fish-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .fish-name { font-weight: 600; font-size: 16px; color: var(--dark); }
        .fish-difficulty { display: inline-block; font-size: 11px; font-weight: 600; padding: 4px 10px; background: #fef3c7; color: #92400e; border-radius: 6px; text-transform: uppercase; }
        .fish-score { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--secondary); }
        .fish-reason { font-size: 12px; color: var(--text-light); margin-bottom: 10px; line-height: 1.5; }
        .baits { display: flex; flex-wrap: wrap; gap: 6px; }
        .bait-tag { font-size: 11px; padding: 4px 10px; background: #dbeafe; color: var(--primary); border-radius: 6px; font-weight: 500; }
        .guide-item { background: linear-gradient(135deg, #f0f9ff 0%, #f5f8ff 100%); border: 1px solid #bfdbfe; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .guide-name { font-weight: 600; font-size: 14px; color: var(--dark); margin-bottom: 4px; }
        .guide-rating { font-size: 12px; color: #0284c7; margin-bottom: 8px; }
        .guide-action { display: inline-block; font-size: 12px; padding: 6px 12px; background: var(--primary); color: white; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .guide-action:hover { background: #0052a3; }
        .report-item { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 12px; line-height: 1.6; }
        .report-date { font-weight: 600; color: var(--secondary); margin-bottom: 4px; }
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
        .empty-text { font-size: 16px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .empty-subtext { font-size: 13px; color: var(--text-light); }
        svg { width: 100%; height: 100%; }
        .location-marker { cursor: pointer; transition: all 0.3s; }
        .location-marker:hover { r: 8; opacity: 0.8; }
        .location-marker.active { r: 10; fill: #ff6b35; filter: drop-shadow(0 0 8px rgba(255, 107, 53, 0.5)); }
        .location-label { pointer-events: none; font-size: 12px; font-weight: 600; text-anchor: middle; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { padding: 24px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 20px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-light); }
        .modal-body { padding: 24px 20px; }
        .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .tab { padding: 12px 0; border: none; background: none; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-light); border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .info-card { background: var(--light); padding: 12px; border-radius: 8px; }
        .info-label { font-size: 12px; color: var(--text-light); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
        .info-value { font-size: 16px; font-weight: 700; color: var(--dark); }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; }
            .map-area { height: 60%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">🎣</div>
                    <div class="logo-text">CatchMate</div>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" id="search-input" placeholder="Search location...">
                    <button class="btn-search" onclick="performSearch()">Search</button>
                </div>
            </div>
            <div class="content" id="sidebar-content">
                <div class="empty-state">
                    <div class="empty-icon">🗺️</div>
                    <div class="empty-text">Click on Florida Map</div>
                    <div class="empty-subtext">Select a location to see fishing reports</div>
                </div>
            </div>
        </div>
        <div class="map-area">
            <svg class="florida-map" id="florida-map" viewBox="0 0 500 700"></svg>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Location Details</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab active" onclick="switchModalTab('overview')">Overview</button>
                    <button class="tab" onclick="switchModalTab('guides')">Guides</button>
                    <button class="tab" onclick="switchModalTab('reports')">Reports</button>
                </div>
                <div id="modal-content"></div>
            </div>
        </div>
    </div>

    <script>
        const floridaLocations = {
            'moore-haven': { name: 'Moore Haven', lat: 26.8, lng: -81.1, mapX: 120, mapY: 450, water: 'Lake Okeechobee', topFish: [{ name: 'Largemouth Bass', difficulty: 'Intermediate', score: 9, reason: 'Trophy bass available year-round', baits: ['Live shiners', 'Soft plastics', 'Jigs'] }, { name: 'Crappie', difficulty: 'Easy', score: 8, reason: 'Peak Nov-Feb in shallow vegetation', baits: ['Live minnows', 'Small jigs', 'Soft plastics'] }], guides: [{ name: 'Bass Flats & Beyond (Capt. John Larsen)', rating: '4.9/5 ⭐', link: 'https://fishingbooker.com' }], reports: [{ date: 'Today', content: '56 bass caught, dozen over 5 lbs. Soft plastics working best.' }] },
            'key-west': { name: 'Key West', lat: 24.55, lng: -81.78, mapX: 200, mapY: 650, water: 'Gulf of Mexico', topFish: [{ name: 'Tarpon', difficulty: 'Advanced', score: 9, reason: 'Available May-Oct, aggressive fighter', baits: ['Live mullet', 'Crabs', 'Mackerel'] }], guides: [{ name: 'Key West Pro Guides', rating: '4.9/5 ⭐', link: 'https://fishingbooker.com' }], reports: [{ date: 'Today', content: 'Tarpon schools active in channels.' }] },
            'tampa-bay': { name: 'Tampa Bay', lat: 27.78, lng: -82.65, mapX: 100, mapY: 320, water: 'Tampa Bay', topFish: [{ name: 'Redfish', difficulty: 'Intermediate', score: 9, reason: 'Abundant in shallow flats', baits: ['Live shrimp', 'Crabs'] }], guides: [{ name: 'Tampa Bay Charter Fishing', rating: '4.8/5 ⭐', link: 'https://fishingbooker.com' }], reports: [{ date: 'Today', content: 'Redfish feeding actively on morning tide.' }] },
            'miami': { name: 'Miami / Biscayne Bay', lat: 25.76, lng: -80.19, mapX: 230, mapY: 500, water: 'Biscayne Bay', topFish: [{ name: 'Permit', difficulty: 'Advanced', score: 9, reason: 'Shallow flats, year-round', baits: ['Crabs', 'Shrimp'] }], guides: [{ name: 'Miami Saltwater Guides', rating: '4.9/5 ⭐', link: 'https://fishingbooker.com' }], reports: [{ date: 'Today', content: 'Permit cruising flats.' }] },
            'everglades': { name: 'Everglades / 10000 Islands', lat: 25.95, lng: -81.35, mapX: 80, mapY: 520, water: 'Everglades', topFish: [{ name: 'Tarpon', difficulty: 'Advanced', score: 9, reason: 'Backcountry runs, seasonal', baits: ['Mullet', 'Crabs'] }], guides: [{ name: 'Everglades Backcountry Guides', rating: '4.9/5 ⭐', link: 'https://fishingbooker.com' }], reports: [{ date: 'Today', content: 'Tarpon cruising passes with incoming tide.' }] }
        };

        function initMap() {
            const svg = document.getElementById('florida-map');
            Object.entries(floridaLocations).forEach(([key, loc]) => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', loc.mapX);
                circle.setAttribute('cy', loc.mapY);
                circle.setAttribute('r', '6');
                circle.setAttribute('fill', '#0066cc');
                circle.setAttribute('class', 'location-marker');
                circle.setAttribute('data-location', key);
                circle.onclick = () => selectLocation(key);
                svg.appendChild(circle);

                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', loc.mapX);
                label.setAttribute('y', loc.mapY - 20);
                label.setAttribute('class', 'location-label');
                label.setAttribute('fill', '#0066cc');
                label.textContent = loc.name;
                svg.appendChild(label);
            });
        }

        function selectLocation(key) {
            const loc = floridaLocations[key];
            document.querySelectorAll('.location-marker').forEach(m => m.classList.remove('active'));
            document.querySelector(`[data-location="${key}"]`).classList.add('active');
            
            let html = `<div class="location-name">${loc.name}</div><div class="location-coords">${loc.water}</div><div class="section"><div class="section-title"><span>🐟</span> Top Fish</div>`;
            loc.topFish.forEach(f => {
                html += `<div class="fish-item"><div class="fish-header"><div><div class="fish-name">${f.name}</div><div class="fish-difficulty">${f.difficulty}</div></div><div class="fish-score">⭐ ${f.score}/10</div></div><div class="fish-reason">${f.reason}</div><div class="baits">${f.baits.map(b => `<span class="bait-tag">${b}</span>`).join('')}</div></div>`;
            });
            html += `</div><div class="section"><div class="section-title"><span>👨‍⚓</span> Guides</div>`;
            loc.guides.forEach(g => {
                html += `<div class="guide-item"><div class="guide-name">${g.name}</div><div class="guide-rating">${g.rating}</div><a href="${g.link}" target="_blank" class="guide-action">Book on FishingBooker →</a></div>`;
            });
            html += `</div>`;
            document.getElementById('sidebar-content').innerHTML = html;
            
            displayModal(loc);
        }

        function displayModal(loc) {
            document.getElementById('modal-title').textContent = loc.name;
            let html = `<div class="info-grid"><div class="info-card"><div class="info-label">Water</div><div class="info-value">${loc.water}</div></div><div class="info-card"><div class="info-label">Top Fish</div><div class="info-value">${loc.topFish[0].name}</div></div></div>`;
            html += `<div id="overview"><div class="section-title" style="margin-bottom:16px;">All Fish Species</div>`;
            loc.topFish.forEach(f => {
                html += `<div style="background:var(--light);padding:12px;border-radius:8px;margin-bottom:10px;"><div style="font-weight:600;margin-bottom:4px;">${f.name} - ${f.difficulty}</div><div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">${f.reason}</div></div>`;
            });
            html += `</div><div id="guides" style="display:none;">`;
            loc.guides.forEach(g => {
                html += `<div style="background:var(--light);padding:14px;border-radius:8px;margin-bottom:10px;"><div style="font-weight:600;">${g.name}</div><div style="font-size:12px;color:var(--secondary);margin:8px 0;">${g.rating}</div><a href="${g.link}" target="_blank" style="display:inline-block;padding:8px 14px;background:var(--primary);color:white;text-decoration:none;border-radius:6px;font-size:12px;font-weight:600;">View on FishingBooker</a></div>`;
            });
            html += `</div><div id="reports" style="display:none;">`;
            loc.reports.forEach(r => {
                html += `<div class="report-item"><div class="report-date">📅 ${r.date}</div>${r.content}</div>`;
            });
            html += `</div>`;
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function switchModalTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('overview').style.display = tab === 'overview' ? 'block' : 'none';
            document.getElementById('guides').style.display = tab === 'guides' ? 'block' : 'none';
            document.getElementById('reports').style.display = tab === 'reports' ? 'block' : 'none';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function performSearch() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const match = Object.keys(floridaLocations).find(k => floridaLocations[k].name.toLowerCase().includes(search));
            if (match) {
                selectLocation(match);
                document.getElementById('search-input').value = '';
            }
        }

        initMap();
    </script>
</body>
</html>
