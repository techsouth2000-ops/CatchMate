<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitecast — Florida Fishing Intel</title>
<meta name="theme-color" content="#0a1c2c">

<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#0b5fa5;--sec:#0a8f5f;--acc:#e2622c;--dark:#16202b;--bg:#f4f6f8;--bd:#dce3ea;--mut:#6b7885}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--dark)}
.wrap{display:flex;height:100vh}
.side{width:430px;background:#fff;display:flex;flex-direction:column;box-shadow:2px 0 14px rgba(0,0,0,.09);z-index:600}
.mapwrap{flex:1;position:relative}
#map{width:100%;height:100%}
.head{padding:14px 16px;border-bottom:1px solid var(--bd)}
.logo{font-size:20px;font-weight:700;color:var(--pri);display:flex;align-items:center;gap:8px}
.mark{width:30px;height:30px;flex-shrink:0}
.slrow{display:flex;align-items:center;gap:11px;width:100%;padding:11px 4px;background:none;
  border:0;border-bottom:1px solid var(--bd);cursor:pointer;font-family:inherit}
.slic{width:34px;height:34px;border-radius:50%;background:#eef3f7;display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0}
.slname{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slsub{font-size:11px;color:var(--mut);margin-top:2px}
.shopblk{border-top:1px solid var(--bd);padding:11px 0}
.sblbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
.sbval{font-size:13px;line-height:1.5}
.ob{display:inline-block;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;margin-left:4px}
.ob.open{background:#e4f7ee;color:#0a6b48}
.ob.shut{background:#fdeceb;color:#b0342c}
.ob.unk{background:#f0f2f5;color:var(--mut)}
.tag{font-size:11px;color:var(--mut);margin-top:2px}
.body{flex:1;overflow-y:auto;padding:14px 16px 40px}
.empty{text-align:center;padding:50px 16px;color:var(--mut)}
.empty .ic{font-size:44px;margin-bottom:12px}
.status{font-size:12px;color:var(--pri);background:#eef5fc;border-radius:6px;padding:8px 10px;margin-bottom:10px}
.err{font-size:12px;color:#9a3412;background:#fff3ec;border:1px solid #ffd9c4;border-radius:6px;padding:8px 10px;margin-bottom:10px}
.loc{font-size:20px;font-weight:700;line-height:1.2}
.sub{font-size:11px;color:var(--mut);margin-top:4px}
.pill{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:3px 8px;border-radius:20px;margin-top:8px;letter-spacing:.03em}
.salt{background:var(--pri)}.fresh{background:var(--sec)}.brack{background:#7a5cbf}.unk{background:#8b95a1}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tab{flex:1;padding:8px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:#fff;color:var(--mut);border-radius:7px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.hint{font-size:11px;color:var(--mut);margin-bottom:10px;line-height:1.5}
.card{border:1px solid var(--bd);border-radius:10px;margin-bottom:9px;overflow:hidden;background:#fff}
.chead{padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rank{font-size:10px;font-weight:700;background:var(--sec);color:#fff;border-radius:4px;padding:2px 6px;margin-right:6px}
.fname{font-weight:650;font-size:14px}
.sci{font-size:10px;color:var(--mut);font-style:italic;margin-top:2px}
.cnt{font-size:10px;color:var(--mut);margin-top:3px}
.arrow{color:var(--pri);font-size:11px;flex-shrink:0}
.det{display:none;padding:0 12px 12px;border-top:1px solid var(--bd)}
.fphoto{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#e8edf1}
.fphoto.ph{display:flex;align-items:center;justify-content:center;font-size:24px}
.fbig{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;border-radius:8px;margin-top:11px;background:#11202b}
.fbigwrap{display:block;position:relative;margin-top:11px}
.fbigwrap .fbig{margin-top:0}
.fbigcap{font-size:9px;color:#9aa5b1;text-align:right;margin-top:3px}
.reg{background:#fbfaf5;border:1px solid #e8e2cf;border-left:3px solid #b08a2e;border-radius:7px;padding:10px 11px;margin-top:12px;font-size:11px;line-height:1.6}
.reg.cr{background:#fff2f2;border-color:#f2cccc;border-left-color:#c0392b}
.rtitle{font-weight:700;font-size:10px;letter-spacing:.05em;color:#8a6a17;margin-bottom:6px}
.reg.cr .rtitle{color:#c0392b}
.rrow{margin-bottom:3px;color:#4a5560}
.rnote{margin-top:5px;color:#6b7885;font-style:italic}
.rflag{margin-top:7px;padding:6px 8px;background:#fff6e0;border-radius:5px;color:#8a6a17;font-weight:600}
.rlink{display:inline-block;margin-top:8px;color:var(--pri);font-weight:700;text-decoration:none;font-size:11px}
.rdate{margin-top:6px;font-size:9px;color:#9aa5b1}
.det.on{display:block}
.lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pri);margin:12px 0 6px}
.bait{background:#f7f9fa;border-left:3px solid var(--sec);border-radius:5px;padding:9px 10px;margin-bottom:8px;font-size:12px}
.bn{font-weight:650;margin-bottom:4px}
.bd{font-size:11px;color:#4a5560;line-height:1.55;margin-bottom:3px}
.rig{background:#eef5fc;border:1px solid #cfe2f4;border-radius:6px;padding:9px 10px;font-size:11px;line-height:1.6;margin:7px 0}
.how{background:#fff4ee;border-left:3px solid var(--acc);border-radius:6px;padding:9px 10px;font-size:11px;line-height:1.6;margin-bottom:7px}
.why{background:#f5f1fd;border-left:3px solid #7a5cbf;border-radius:6px;padding:9px 10px;font-size:11px;line-height:1.6}
.tt{font-weight:700;font-size:10px;letter-spacing:.04em;margin-bottom:3px}
.when{background:#f0fbf5;border-left:3px solid var(--sec);border-radius:6px;padding:9px 10px;font-size:11px;line-height:1.7;margin-top:8px;color:#41505c}
.nod{font-size:11px;color:var(--mut);line-height:1.6;padding:10px 0}
.obsmeta{background:#f4f7fa;border-left:3px solid var(--mut);border-radius:6px;padding:9px 10px;font-size:11px;line-height:1.7;color:#4a5560;margin-top:11px}
.sol{background:linear-gradient(135deg,#1b2a3a 0%,#22384c 100%);color:#fff;border-radius:10px;padding:13px;margin-top:4px}
.solhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.solph{font-size:15px;font-weight:700}
.solsub{font-size:11px;color:#a8bccd;margin-top:3px}
.solrate{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;flex-shrink:0}
.solnote{font-size:10px;color:#9aa5b1;line-height:1.6;margin-top:9px}
.sol .solnote{color:#8fa6ba}
.win{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:8px;padding:10px 11px;margin-bottom:7px}
.win.major{border-left:4px solid var(--sec);background:#f6fdf9}
.win.minor{border-left:4px solid #b08a2e;background:#fdfbf5}
.win.live{box-shadow:0 0 0 2px var(--sec);background:#eafaf1}
.win.past{opacity:.45}
.wint{font-size:13px;font-weight:700}
.winn{font-size:10px;color:var(--mut);margin-top:2px}
.winb{font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.05em}
.win.live .winb{color:var(--sec)}
.stn{font-size:11px;color:var(--mut);margin-bottom:8px}
.tide{display:flex;justify-content:space-between;align-items:center;border-radius:8px;padding:9px 11px;margin-bottom:6px;border:1px solid var(--bd)}
.tide.hi{border-left:4px solid var(--pri);background:#f4f9ff}
.tide.lo{border-left:4px solid #8b95a1;background:#fafbfc}
.tidet{font-size:13px;font-weight:650}
.tidesub{font-size:10px;color:var(--mut);margin-top:2px}
.daysw{display:flex;gap:6px;margin-bottom:12px}
.dbtn{flex:1;padding:8px;font-size:12px;font-weight:700;border:1px solid var(--bd);background:#fff;color:var(--mut);border-radius:7px;cursor:pointer}
.dbtn.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.tide.past{opacity:.45}
.tidein{font-size:11px;color:var(--mut);font-weight:600}
.acct{flex-shrink:0;padding:7px 12px;font-size:11px;font-weight:700;border:1px solid var(--pri);background:#fff;color:var(--pri);border-radius:20px;cursor:pointer}
.acct.in{background:var(--pri);color:#fff}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:500;padding:12px 20px;font-size:13px;font-weight:700;border:0;border-radius:30px;background:var(--acc);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.3);cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(12,20,28,.55);z-index:2000;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 18px 32px}
@media(min-width:821px){.modal{align-items:center}.sheet{border-radius:14px;max-height:84vh}}
.mtitle{font-size:19px;font-weight:700;margin-bottom:4px}
.msub{font-size:12px;color:var(--mut);line-height:1.6;margin-bottom:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-family:inherit;-webkit-appearance:none}
.fld textarea{min-height:72px;resize:vertical}
.fld .hint2{font-size:10px;color:var(--mut);margin-top:4px;line-height:1.5}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.btn{width:100%;padding:13px;font-size:14px;font-weight:700;border:0;border-radius:9px;background:var(--pri);color:#fff;cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.5}
.btn.alt{background:#fff;color:var(--pri);border:1px solid var(--bd)}
.btn.danger{background:#fff;color:#c0392b;border:1px solid #f0d0cc}
.linky{background:none;border:0;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer;padding:8px 0;text-decoration:underline}
.msg{font-size:12px;padding:9px 11px;border-radius:7px;margin-bottom:12px;line-height:1.5}
.msg.bad{background:#fff3ec;color:#9a3412;border:1px solid #ffd9c4}
.msg.good{background:#f0fbf5;color:#0a6b48;border:1px solid #c6ecd9}
.prev{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#11202b;margin-top:8px}
.cc{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ccimg{width:100%;max-height:260px;object-fit:contain;background:#11202b;display:block}
.ccb{padding:11px 12px}
.ccu{font-size:12px;font-weight:700}
.ccs{font-size:14px;font-weight:700;margin:3px 0}
.ccm{font-size:11px;color:var(--mut);line-height:1.6}
.ccact{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:12px}
.ccact button{background:none;border:0;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;padding:0}
.ccact button.liked{color:var(--acc)}
.chip{display:inline-block;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;background:#eef3f7;color:var(--mut);margin-right:5px}
.obs img{width:46px;height:46px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--bd)}
.on1{font-size:13px;font-weight:600}
.on2{font-size:10px;color:var(--mut);margin-top:2px}
.ctl{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:5px}
.cbtn{padding:7px 11px;font-size:11px;font-weight:600;border:0;border-radius:6px;background:#fff;color:var(--dark);box-shadow:0 1px 6px rgba(0,0,0,.28);cursor:pointer}
.cbtn.on{background:var(--pri);color:#fff}
.cbtn.loc{background:var(--sec);color:#fff;margin-top:4px}
.foot{font-size:10px;color:var(--mut);margin-top:16px;line-height:1.6;border-top:1px solid var(--bd);padding-top:10px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #cfe2f4;border-top-color:var(--pri);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.grab{display:none}
@media(max-width:820px){
  .wrap{flex-direction:column-reverse}
  .side{width:100%;height:52%;transition:height .25s ease;border-radius:14px 14px 0 0;
        box-shadow:0 -3px 16px rgba(0,0,0,.16)}
  .side.big{height:93%}
  .mapwrap{height:48%;transition:height .25s ease}
  .side.big ~ .mapwrap{height:7%}
  .grab{display:block;width:100%;padding:9px 0 4px;border:0;background:none;cursor:pointer;flex-shrink:0}
  .grab span{display:block;width:40px;height:4px;border-radius:3px;background:#cfd8e0;margin:0 auto}
  .side.big .grab span{background:var(--pri)}
  .ctl{top:8px;right:8px;gap:5px}
  .cbtn{padding:9px 10px;font-size:15px;line-height:1;min-width:40px}
  .lw{display:none}
  .fab{bottom:10px;padding:10px 17px;font-size:12px}
  .head{padding:10px 14px}
  .body{padding:12px 14px 34px}
  .logo{font-size:18px}
  .tag{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="side" id="side">
    <button class="grab" onclick="toggleSheetSize()" aria-label="Expand or shrink panel"><span></span></button>
    <div class="head">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <div class="logo">
            <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Bitecast">
              <defs>
                <linearGradient id="bcBg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#12324d"/><stop offset="1" stop-color="#0a1c2c"/>
                </linearGradient>
                <clipPath id="bcClip"><rect x="2" y="2" width="60" height="60" rx="17"/></clipPath>
              </defs>
              <g clip-path="url(#bcClip)">
                <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bcBg)"/>
                <path d="M20.5 10.5a7.6 7.6 0 1 0 0 13.8 6 6 0 1 1 0-13.8z" fill="#F5C86B"/>
                <path d="M21 33.5 6.5 25a24 24 0 0 0 0 17z" fill="#1FA97A"/>
                <path d="M17 33.5c5.5-10.5 19-14 29.5-8 3.5 2 6 4.8 7 8-1 3.2-3.5 6-7 8-10.5 6-24 2.5-29.5-8z" fill="#3BE0A0"/>
                <path d="M30 22.6c-3.4 6.6-3.4 15.2 0 21.8-5.5-1.8-10-5.4-13-10.9 3-5.5 7.5-9.1 13-10.9z" fill="#25C289"/>
                <path d="M30.5 23.4c1.6-5.6 6-8.8 10.2-7.3l-4 7.9z" fill="#1FA97A"/>
                <circle cx="45" cy="30" r="3.1" fill="#0a1c2c"/>
                <path d="M2 50c5.5-3 9-3 14.5 0s9 3 14.5 0 9-3 14.5 0 9 3 14.5 0" stroke="#2E7FB8"
                      stroke-width="2.6" fill="none" opacity=".5" stroke-linecap="round"/>
                <path d="M2 57c5.5-3 9-3 14.5 0s9 3 14.5 0 9-3 14.5 0 9 3 14.5 0" stroke="#2E7FB8"
                      stroke-width="2.2" fill="none" opacity=".28" stroke-linecap="round"/>
              </g>
            </svg>
            <span>Bitecast</span>
          </div>
          <div class="tag">Tap any water. Know what's biting, when, and how. <span style="color:#0a8f5f;font-weight:700">· v14 in-app-shops</span></div>
        </div>
        <button class="acct" id="acctbtn" onclick="openAccount()">Sign in</button>
      </div>
    </div>
    <div class="body" id="out">
      <div class="empty">
        <div class="ic">🗺️</div>
        <div style="font-weight:600;color:var(--dark);margin-bottom:6px">Where do you want to fish?</div>
        <div style="font-size:12px">Tap a lake, river, bay, flat, inlet or the open Gulf.</div>
      </div>
    </div>
  </div>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="ctl">
      <button class="cbtn on" id="b-map" onclick="setBase('map')">🗺️<span class="lw"> Map</span></button>
      <button class="cbtn" id="b-sat" onclick="setBase('sat')">🛰️<span class="lw"> Satellite</span></button>
      <button class="cbtn loc" id="b-loc" onclick="locateMe()">📍<span class="lw"> Locate me</span></button>
      <button class="cbtn" id="b-shop" onclick="toggleShops()">🪱<span class="lw"> Shops</span></button>
      <button class="cbtn" id="b-diag" onclick="runDiagnostics()">🩺<span class="lw"> Test</span></button>
    </div>
    <button class="fab" id="fab" onclick="openLogCatch()">＋ Log a catch</button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ---------------------------------------------------------------
   Bitecast
   Water body ID : Overpass API (OpenStreetMap)
   Fish records  : iNaturalist API (real georeferenced observations)
   Tackle data   : curated, keyed to species actually returned
----------------------------------------------------------------*/

const map = L.map('map', {zoomControl:true}).setView([27.6,-81.6], 7);
const baseMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const SAT_SOURCES=[
  {n:'Esri',u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',a:'© Esri'},
  {n:'USGS',u:'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',a:'USGS'},
  {n:'Google',u:'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',a:'Google'}
];
let satIdx=0, baseSat=L.tileLayer(SAT_SOURCES[0].u,{maxZoom:19,attribution:SAT_SOURCES[0].a});
let satFails=0;
function wireSat(){
  satFails=0;
  baseSat.on('tileerror',()=>{
    if(++satFails<4) return;
    if(satIdx>=SAT_SOURCES.length-1) return;
    satIdx++;
    const s=SAT_SOURCES[satIdx];
    console.warn('satellite source failed, switching to',s.n);
    const was=map.hasLayer(baseSat);
    if(was) map.removeLayer(baseSat);
    baseSat=L.tileLayer(s.u,{maxZoom:19,attribution:s.a});
    wireSat();
    if(was) baseSat.addTo(map);
    document.getElementById('b-sat').textContent='🛰️ Satellite ('+s.n+')';
  });
}
wireSat();
baseMap.addTo(map);
function setBase(k){
  if(map.hasLayer(baseMap)) map.removeLayer(baseMap);
  if(map.hasLayer(baseSat)) map.removeLayer(baseSat);
  (k==='sat'?baseSat:baseMap).addTo(map);
  document.getElementById('b-map').classList.toggle('on',k==='map');
  document.getElementById('b-sat').classList.toggle('on',k==='sat');
}

/* ============ WATER BODY IDENTIFICATION (Overpass / OSM) ============ */
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.osm.ch/api/interpreter'
];

/* NOTE: no AbortController / no fetch options object.
   Some in-app webviews throw DataCloneError when a fetch init object
   containing an AbortSignal is passed. Plain GET + Promise.race timeout
   is the portable version. */
function timeout(ms){
  return new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out after '+(ms/1000)+'s')),ms));
}
async function getJSON(url,ms){
  const r = await Promise.race([fetch(url), timeout(ms||20000)]);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function overpass(q){
  // Race the mirrors instead of trying them one at a time. Overpass servers
  // vary wildly in load, so the sequential version waited out a slow one
  // before even trying a fast one.
  const url=u=>u+'?data='+encodeURIComponent(q);
  const tries=OVERPASS.map(u=>getJSON(url(u),25000));
  tries.forEach(p=>p.catch(()=>{}));   // losers must not raise unhandled rejections
  if(typeof Promise.any==='function'){
    try{
      const d=await Promise.any(tries);
      // Overpass sometimes answers 200 with an error note instead of failing
      if(d && d.remark && /error|timed out|runtime/i.test(d.remark))
        throw new Error('Overpass: '+d.remark);
      return d;
    }
    catch(e){ throw new Error(e.message&&e.message.startsWith('Overpass:')?e.message:'all Overpass mirrors failed or timed out'); }
  }
  let lastErr;
  for(const p of tries){ try{ return await p; }catch(e){ lastErr=e; } }
  throw lastErr||new Error('all Overpass mirrors failed');
}

// Score a candidate so we prefer a named lake/bay over a generic coastline
function scoreTags(tg){
  if(!tg || !tg.name) return -1;
  if(tg.boundary==='administrative') return -1;
  if(tg.natural==='water') return 100;
  if(tg.natural==='bay'||tg.natural==='strait') return 95;
  if(tg.waterway==='riverbank') return 92;
  if(tg.waterway==='river') return 88;
  if(tg.waterway==='canal'||tg.waterway==='stream') return 80;
  if(tg.place==='sea'||tg.place==='ocean') return 40;
  if(tg.leisure==='marina') return 30;
  return -1;
}

function classify(tg){
  const n=(tg.name||'').toLowerCase();
  const w=tg.water||'', nat=tg.natural||'', ww=tg.waterway||'';
  if(tg.salt==='yes') return 'salt';
  if(nat==='bay'||nat==='strait'||tg.place==='sea'||tg.place==='ocean') return 'salt';
  if(/gulf|ocean|atlantic|sound|pass|inlet|harbor|harbour|bight|key|cay/.test(n)) return 'salt';
  if(/lagoon/.test(n)||w==='lagoon') return 'brack';
  if(w==='lake'||w==='pond'||w==='reservoir'||w==='oxbow'||w==='basin') return 'fresh';
  if(ww==='river'||ww==='stream'||ww==='canal'||ww==='ditch'||ww==='riverbank') return 'brack';
  if(/lake|pond|reservoir|slough|creek(?!.*(bay|inlet))/.test(n)) return 'fresh';
  return 'unk';
}

async function identify(lat,lng){
  // Pass 1: which mapped water polygon actually CONTAINS this point
  const q1 = `[out:json][timeout:20];is_in(${lat},${lng})->.a;`+
             `(area.a["natural"="water"];area.a["natural"="bay"];area.a["natural"="strait"];`+
             `area.a["waterway"];area.a["place"="sea"];);out tags;`;
  try{
    const d = await overpass(q1);
    const best = (d.elements||[]).map(e=>({tg:e.tags||{},sc:scoreTags(e.tags)}))
      .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc)[0];
    if(best) return {name:best.tg.name, type:classify(best.tg), src:'contained polygon', tags:best.tg};
  }catch(e){ console.warn('is_in failed',e); }

  // Pass 2: nearest named water feature
  const q2 = `[out:json][timeout:20];(`+
    `way(around:900,${lat},${lng})["natural"="water"]["name"];`+
    `rel(around:900,${lat},${lng})["natural"="water"]["name"];`+
    `way(around:900,${lat},${lng})["waterway"]["name"];`+
    `rel(around:2500,${lat},${lng})["waterway"="river"]["name"];`+
    `way(around:4000,${lat},${lng})["natural"~"bay|strait"]["name"];`+
    `node(around:6000,${lat},${lng})["natural"~"bay|strait"]["name"];`+
    `node(around:30000,${lat},${lng})["place"="sea"]["name"];`+
    `);out tags center 40;`;
  try{
    const d = await overpass(q2);
    const cands = (d.elements||[]).map(e=>{
      const tg=e.tags||{}, sc=scoreTags(tg);
      const c = e.center || (e.lat!=null?{lat:e.lat,lon:e.lon}:null);
      const dist = c ? Math.hypot(c.lat-lat,(c.lon-lng)*Math.cos(lat*Math.PI/180)) : 9;
      return {tg,sc,dist};
    }).filter(x=>x.sc>0);
    if(cands.length){
      cands.sort((a,b)=> (b.sc - a.sc) || (a.dist - b.dist));
      const b = cands[0];
      return {name:b.tg.name, type:classify(b.tg), src:'nearest named feature', tags:b.tg};
    }
  }catch(e){ console.warn('around failed',e); }

  return {name:null, type:'unk', src:'not found', tags:{}};
}

/* ============ FISH RECORDS (iNaturalist) ============ */
const INAT='https://api.inaturalist.org/v1';
const FISH_TAXA='47178,47273'; // ray-finned fishes + cartilaginous fishes

async function fishHere(lat,lng,radiusKm){
  const base=`lat=${lat}&lng=${lng}&radius=${radiusKm}&taxon_id=${FISH_TAXA}&verifiable=true`;
  let err=null;
  const [counts,recent] = await Promise.all([
    getJSON(`${INAT}/observations/species_counts?${base}&per_page=40`)
      .catch(e=>{err=e.message; console.warn('iNat species_counts failed:',e.message); return {results:[]};}),
    getJSON(`${INAT}/observations?${base}&order_by=observed_on&order=desc&per_page=25&photos=true`)
      .catch(e=>{err=err||e.message; console.warn('iNat observations failed:',e.message); return {results:[]};})
  ]);
  const cs=counts.results||[], rs=recent.results||[];

  /* species_counts does not always carry default_photo, so backfill:
     1) /taxa lookup for the exact species, 2) a photo from a nearby observation. */
  const need=cs.filter(c=>c.taxon && c.taxon.id && !(c.taxon.default_photo)).map(c=>c.taxon.id);
  if(need.length){
    try{
      const tx=await getJSON(`${INAT}/taxa?id=${need.slice(0,30).join(',')}&per_page=30`);
      const byId={};
      (tx.results||[]).forEach(t=>{ if(t.default_photo) byId[t.id]=t.default_photo; });
      cs.forEach(c=>{ if(c.taxon && !c.taxon.default_photo && byId[c.taxon.id]) c.taxon.default_photo=byId[c.taxon.id]; });
    }catch(e){ console.warn('iNat taxa photo lookup failed:',e.message); }
  }
  const obsPhoto={};
  rs.forEach(o=>{
    const id=o.taxon&&o.taxon.id, p=o.photos&&o.photos[0]&&o.photos[0].url;
    if(id && p && !obsPhoto[id]) obsPhoto[id]=p.replace('square','medium');
  });
  cs.forEach(c=>{
    if(c.taxon && !c.taxon.default_photo && obsPhoto[c.taxon.id])
      c.taxon.default_photo={medium_url:obsPhoto[c.taxon.id]};
  });

  return {counts:cs, recent:rs, err};
}

function gazLookup(lat,lng){
  let best=null,bd=1e9;
  for(const g of GAZ){
    const dy=lat-g.la, dx=(lng-g.lo)*Math.cos(lat*Math.PI/180);
    const d=Math.hypot(dy,dx);
    if(d<=g.r && d<bd){ bd=d; best=g; }
  }
  return best;
}

/* ============ DIAGNOSTICS ============ */
function probeImage(url,ms){
  return new Promise(res=>{
    const i=new Image(); let done=false;
    const t=setTimeout(()=>{if(!done){done=true;res(false);}},ms||8000);
    i.onload=()=>{if(!done){done=true;clearTimeout(t);res(true);}};
    i.onerror=()=>{if(!done){done=true;clearTimeout(t);res(false);}};
    i.src=url;
  });
}
async function probeJSON(url,ms){
  try{ await getJSON(url,ms||10000); return true; }catch(e){ return false; }
}
async function runDiagnostics(){
  out().innerHTML='<div class="status"><span class="spin"></span>Testing which services this browser can reach…</div>';
  const tests=[
    ['OpenStreetMap tiles', probeImage('https://a.tile.openstreetmap.org/7/34/54.png')],
    ['Esri satellite tiles', probeImage('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/7/54/34')],
    ['Google satellite tiles', probeImage('https://mt1.google.com/vt/lyrs=s&x=34&y=54&z=7')],

  ];
  const results=await Promise.all(tests.map(t=>t[1]));
  const blocked=results.filter((r,i)=>i>=3&&!r).length;
  let h='<div class="loc">Connection test</div><div class="sub">What this browser is allowed to reach</div>';
  h+='<div style="margin-top:14px">';
  tests.forEach((t,i)=>{
    h+=`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px">
          <span>${esc(t[0])}</span>
          <b style="color:${results[i]?'#0a8f5f':'#c2410c'}">${results[i]?'reachable':'blocked'}</b>
        </div>`;
  });
  h+='</div>';
  if(blocked){
    h+=`<div class="err" style="margin-top:14px">
      The data APIs are blocked here. That is a restriction of this preview window, not a fault in the app — it will not fetch live water names or fish records until you open it somewhere without that restriction.

  } else {

  }
  h+='<div class="foot">Tap the map to go back to fishing.</div>';
  out().innerHTML=h;
}

/* ============ SOLUNAR (computed on device, no network) ============
   Moon/sun position math adapted from the standard astronomical routines
   used by SunCalc (Vladimir Agafonkin, BSD). Feeding windows follow the
   classic solunar model: major periods when the moon is overhead or
   underfoot, minor periods at moonrise and moonset. */
const RAD=Math.PI/180, DAYMS=864e5, J1970=2440588, J2000=2451545, OBL=RAD*23.4397;
const toJulian=d=>d.valueOf()/DAYMS-0.5+J1970;
const toDays=d=>toJulian(d)-J2000;
const rightAsc=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l));
const decl=(l,b)=>Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l));
const sidereal=(d,lw)=>RAD*(280.16+360.9856235*d)-lw;
const altOf=(H,phi,dec)=>Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));

function moonCoords(d){
  const L=RAD*(218.316+13.176396*d), M=RAD*(134.963+13.064993*d), F=RAD*(93.272+13.229350*d);
  const l=L+RAD*6.289*Math.sin(M), b=RAD*5.128*Math.sin(F), dt=385001-20905*Math.cos(M);
  return {ra:rightAsc(l,b),dec:decl(l,b),dist:dt};
}
function sunCoords(d){
  const M=RAD*(357.5291+0.98560028*d);
  const C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+RAD*102.9372+Math.PI;
  return {ra:rightAsc(L,0),dec:decl(L,0)};
}
function moonAlt(date,lat,lng){
  const lw=RAD*-lng, phi=RAD*lat, d=toDays(date), c=moonCoords(d);
  return altOf(sidereal(d,lw)-c.ra,phi,c.dec);
}
function sunAlt(date,lat,lng){
  const lw=RAD*-lng, phi=RAD*lat, d=toDays(date), c=sunCoords(d);
  return altOf(sidereal(d,lw)-c.ra,phi,c.dec);
}
function moonPhase(date){
  const d=toDays(date), s=sunCoords(d), m=moonCoords(d), sdist=149598000;
  const phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  const inc=Math.atan2(sdist*Math.sin(phi),m.dist-sdist*Math.cos(phi));
  const angle=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),
    Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
  const phase=0.5+0.5*inc*(angle<0?-1:1)/Math.PI;
  return {phase, illum:(1+Math.cos(inc))/2};
}
function phaseName(p){
  if(p<0.03||p>0.97) return 'New moon';
  if(p<0.22) return 'Waxing crescent';
  if(p<0.28) return 'First quarter';
  if(p<0.47) return 'Waxing gibbous';
  if(p<0.53) return 'Full moon';
  if(p<0.72) return 'Waning gibbous';
  if(p<0.78) return 'Last quarter';
  return 'Waning crescent';
}
function phaseEmoji(p){
  const i=Math.round(p*8)%8;
  return ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][i];
}
/* Scan a day at 10-minute steps for rise, set and the overhead/underfoot times */
function scanDay(altFn,base,lat,lng){
  const step=10*60000, n=(24*60)/10;
  let prev=altFn(base,lat,lng), rise=null,set=null,peak=base,low=base,pv=prev,lv=prev;
  for(let i=1;i<=n;i++){
    const t=new Date(base.getTime()+i*step), a=altFn(t,lat,lng);
    if(prev<0&&a>=0&&!rise) rise=t;
    if(prev>0&&a<=0&&!set) set=t;
    if(a>pv){pv=a;peak=t;}
    if(a<lv){lv=a;low=t;}
    prev=a;
  }
  return {rise,set,peak,low};
}
function localMidnight(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0); }
const fmtT=d=>d?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'—';

function solunar(lat,lng,when){
  const now=when||new Date(), base=localMidnight(now);
  const m=scanDay(moonAlt,base,lat,lng), s=scanDay(sunAlt,base,lat,lng);
  const ph=moonPhase(now);
  const win=(c,mins,kind,label)=>c?{start:new Date(c.getTime()-mins*60000),end:new Date(c.getTime()+mins*60000),kind,label,peak:c}:null;
  let periods=[
    win(m.peak,60,'major','Moon overhead'),
    win(m.low,60,'major','Moon underfoot'),
    win(m.rise,45,'minor','Moonrise'),
    win(m.set,45,'minor','Moonset')
  ].filter(Boolean).sort((a,b)=>a.start-b.start);
  // a window straddling sunrise or sunset is the strongest of all
  periods.forEach(p=>{
    p.prime=[s.rise,s.set].some(t=>t && Math.abs(t-p.peak)<75*60000);
    p.active = now>=p.start && now<=p.end;
  });
  const d=Math.min(Math.abs(ph.phase-0),Math.abs(ph.phase-0.5),Math.abs(ph.phase-1));
  const rating = d<0.045?{t:'Excellent',c:'#0a8f5f'} : d<0.11?{t:'Good',c:'#4a9d3f'}
               : d<0.20?{t:'Fair',c:'#b08a2e'} : {t:'Average',c:'#8b95a1'};
  return {periods,sun:s,moon:m,phase:ph,rating,now};
}

let STATION_CACHE=null;
async function stationList(){
  if(STATION_CACHE) return STATION_CACHE;
  try{
    const d=await getJSON(`${CO_OPS}/mdapi/prod/webapi/stations.json?type=tidepredictions&units=english`,20000);
    const fl=(d.stations||[]).filter(s=>s.lat>23.5&&s.lat<31.5&&s.lng>-88.5&&s.lng<-79.5)
      .map(s=>({id:s.id,name:s.name,lat:s.lat,lng:s.lng}));
    STATION_CACHE = fl.length>20 ? fl : FALLBACK_STATIONS;
    console.log('tide stations loaded:',STATION_CACHE.length);
  }catch(e){
    console.warn('station list failed, using fallback:',e.message);
    STATION_CACHE=FALLBACK_STATIONS;
  }
  return STATION_CACHE;
}
function haversineKm(a,b,c,d){
  const R=6371,dLat=(c-a)*RAD,dLon=(d-b)*RAD;
  const x=Math.sin(dLat/2)**2+Math.cos(a*RAD)*Math.cos(c*RAD)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
async function tidesFor(lat,lng){
  const st=await stationList();
  let best=null,bd=1e9;
  st.forEach(s=>{const d=haversineKm(lat,lng,s.lat,s.lng); if(d<bd){bd=d;best=s;}});
  if(!best||bd>120) return {station:null,dist:bd,preds:[]};
  const today=new Date(), tmr=new Date(today.getTime()+DAYMS);
  const url=`${CO_OPS}/api/prod/datagetter?product=predictions&application=Bitecast`+
    `&begin_date=${ymd(today)}&end_date=${ymd(tmr)}&datum=MLLW&station=${best.id}`+
    `&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
  const d=await getJSON(url,20000);
  const preds=(d.predictions||[]).map(p=>({t:new Date(p.t.replace(' ','T')),v:parseFloat(p.v),hi:p.type==='H'}));
  let temp=null;
  try{
    const w=await getJSON(`${CO_OPS}/api/prod/datagetter?product=water_temperature&application=Bitecast`+
      `&date=latest&station=${best.id}&time_zone=lst_ldt&units=english&format=json`,12000);
    if(w.data&&w.data[0]) temp=parseFloat(w.data[0].v);
  }catch(e){}
  return {station:best,dist:bd,preds,temp};
}
function setCondDay(d){ state.condDay=d; render(); }

function condHTML(){
  const {lat,lng,type,tide,tideErr}=state;
  const day = state.condDay||'today';
  const isTom = day==='tomorrow';
  const now=new Date();
  const target = isTom ? new Date(now.getTime()+DAYMS) : now;
  const s=solunar(lat,lng,target);
  let h='';

  h+=`<div class="daysw">
        <button class="dbtn ${!isTom?'on':''}" onclick="setCondDay('today')">Today</button>
        <button class="dbtn ${isTom?'on':''}" onclick="setCondDay('tomorrow')">Tomorrow</button>
      </div>`;

  h+=`<div class="sol">
        <div class="solhead">
          <div><div class="solph">${phaseEmoji(s.phase.phase)} ${esc(phaseName(s.phase.phase))}</div>
          <div class="solsub">${Math.round(s.phase.illum*100)}% lit · ☀️ ${fmtT(s.sun.rise)} – ${fmtT(s.sun.set)}</div></div>
          <div class="solrate" style="background:${s.rating.c}">${s.rating.t}</div>
        </div>
        <div class="solnote">Solunar theory: fish feed hardest when the moon is directly overhead or underfoot, and again at moonrise and moonset. New and full moons are strongest.</div>
      </div>`;

  h+=`<div class="lbl">Feeding windows ${isTom?'tomorrow':'today'}</div>`;
  s.periods.forEach(p=>{
    const past = !isTom && p.end<now;
    const live = !isTom && p.active;
    h+=`<div class="win ${p.kind}${live?' live':''}${past?' past':''}">
          <div class="winl">
            <div class="wint">${fmtT(p.start)} – ${fmtT(p.end)}</div>
            <div class="winn">${esc(p.label)} · ${p.kind==='major'?'Major':'Minor'}${p.prime?' · 🔥 overlaps sun':''}</div>
          </div>
          <div class="winb">${live?'NOW':past?'past':isTom?'':'later'}</div>
        </div>`;
  });
  if(!isTom && s.periods.every(p=>p.end<now))
    h+=`<div class="nod">Today's windows have all passed. Check tomorrow — they shift about 50 minutes later each day.</div>`;

  h+=`<div class="lbl" style="margin-top:16px">Tide ${isTom?'tomorrow':'today'}</div>`;
  if(type==='fresh'){
    h+=`<div class="nod">This is fresh water — no tide. Use the feeding windows above, plus first and last light.</div>`;
  } else if(tideErr){
    h+=`<div class="err">Tide lookup failed: ${esc(tideErr)}</div>`;
  } else if(!tide){
    h+=`<div class="nod"><span class="spin"></span>Loading tide predictions…</div>`;
  } else if(!tide.station){
    h+=`<div class="nod">No NOAA tide station within range of this spot.</div>`;
  } else {
    const tgt=isTom?new Date(now.getTime()+DAYMS):now;
    const sameDay=d=>d.getFullYear()===tgt.getFullYear()&&d.getMonth()===tgt.getMonth()&&d.getDate()===tgt.getDate();
    const rows=tide.preds.filter(p=>sameDay(p.t));
    h+=`<div class="stn">📍 ${esc(tide.station.name)} · ${tide.dist.toFixed(0)} km away${tide.temp?` · 🌡️ ${tide.temp.toFixed(0)}°F water`:''}</div>`;
    if(!rows.length){
      h+=`<div class="nod">No predictions returned for ${isTom?'tomorrow':'today'}.</div>`;
    }
    rows.forEach(p=>{
      const mins=Math.round((p.t-now)/60000);
      let when;
      if(mins<0) when='passed';
      else if(mins<60) when=`in ${mins} min`;
      else when=`in ${Math.floor(mins/60)}h ${mins%60}m`;
      h+=`<div class="tide ${p.hi?'hi':'lo'}${mins<0?' past':''}">
            <div><div class="tidet">${p.hi?'▲ High':'▼ Low'} · ${fmtT(p.t)}</div>
            <div class="tidesub">${p.v.toFixed(1)} ft</div></div>
            <div class="tidein">${esc(when)}</div>
          </div>`;
    });
    h+=`<div class="solnote" style="margin-top:8px">Moving water beats slack water. The hour either side of a tide change is usually the best bite, especially where the current squeezes past a point, bridge or pass.</div>`;
  }

  h+=`<div class="foot">Feeding windows are calculated on your device from the moon's position — they work with no signal. Tide predictions from NOAA CO-OPS. Predictions are astronomical; wind and pressure can shift real water levels.</div>`;
  return h;
}

/* ============================================================
   BITECAST ACCOUNTS & COMMUNITY  (Supabase)
   The anon key is meant to live in client code. It is only safe
   because row-level security is enabled on every table — see
   bitecast-schema.sql. Never put the service_role key here.
   ============================================================ */
const SUPABASE_URL = 'https://ufubcigcoqlpmcmcsneq.supabase.co';
// Leave blank to be prompted once in the app; the key is then remembered
// on this device. Or paste it between the quotes to ship it for everyone.
const SUPABASE_ANON_KEY = '';

let sb=null, ME=null, MYPROFILE=null;

function anonKey(){
  return SUPABASE_ANON_KEY || localStorage.getItem('bc_key') || '';
}
function initSupabase(){
  const key=anonKey();
  if(!key || !window.supabase) return false;
  try{
    sb=window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true}});
    sb.auth.onAuthStateChange((_e,session)=>{ ME=session?session.user:null; loadMyProfile(); paintAcct(); });
    sb.auth.getSession().then(({data})=>{ ME=data.session?data.session.user:null; loadMyProfile(); paintAcct(); });
    return true;
  }catch(e){ console.warn('supabase init failed',e); return false; }
}
async function loadMyProfile(){
  if(!sb||!ME){ MYPROFILE=null; return; }
  const {data}=await sb.from('profiles').select('*').eq('id',ME.id).maybeSingle();
  MYPROFILE=data||null; paintAcct();
}
function paintAcct(){
  const b=document.getElementById('acctbtn'); if(!b) return;
  if(ME){ b.textContent='@'+((MYPROFILE&&MYPROFILE.username)||'me'); b.classList.add('in'); }
  else { b.textContent='Sign in'; b.classList.remove('in'); }
}

/* ---------- photo handling ---------- */
function shrinkImage(file,maxPx){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,(maxPx||1600)/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('could not process image')),'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('could not read that image'));};
    img.src=url;
  });
}
let PENDING_PHOTO=null;
async function pickPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  try{

    pv.src=URL.createObjectURL(PENDING_PHOTO); pv.style.display='block';
  }catch(e){ setMsg(e.message); }
}

async function doLogCatch(){

  if(!species) return setMsg('Which species was it?');

        .upload(name,PENDING_PHOTO,{contentType:'image/jpeg',upsert:false});

      photo_path=name;
    }

    const sol=solunar(st.lat,st.lng);

    if(st.tide&&st.tide.preds&&st.tide.preds.length){
      const nxt=st.tide.preds.find(p=>p.t>=new Date());
      if(nxt){
        const mins=Math.round((nxt.t-new Date())/60000);
        tide_state=(mins<60?'near ':'')+(nxt.hi?'incoming to high':'falling to low');
      }
    }

    const wt=parseFloat(document.getElementById('wt').value);

      bait:(document.getElementById('bait').value||'').trim()||null,
      notes:(document.getElementById('notes').value||'').trim()||null,
      photo_path, tide_state,
      moon_phase: phaseName(sol.phase.phase),
      water_temp_f: (st.tide&&st.tide.temp)||null
    });
    if(error) throw error;
    PENDING_PHOTO=null;

let shopLayer=null, SHOPS=[], shopsOn=false, GERR=null;

/* Google Places gives far better small-business coverage than OSM, which is
   volunteer-mapped and thin in rural Florida. Optional: needs the user's own
   API key. Without it we fall back to OSM plus a Google Maps deep link. */
function gKey(){ return localStorage.getItem('bc_gkey')||''; }

async function fetchPlacesGoogle(lat,lng,radiusM){
  const key=gKey(); if(!key) return null;
  const queries=['bait and tackle shop','fishing tackle store'];
  const seen={}, out=[];
  for(const q of queries){
    const res=await fetch('https://places.googleapis.com/v1/places:searchText',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':key,
        'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.location,'+
          'places.regularOpeningHours,places.currentOpeningHours,places.nationalPhoneNumber,'+
          'places.websiteUri,places.rating,places.userRatingCount,places.businessStatus'},
      body:JSON.stringify({textQuery:q,maxResultCount:20,
        locationBias:{circle:{center:{latitude:lat,longitude:lng},radius:Math.min(radiusM,50000)}}})
    });
    if(!res.ok){
      const t=await res.text().catch(()=>'');
      throw new Error('Google Places '+res.status+(t?': '+t.slice(0,140):''));
    }
    const d=await res.json();
    (d.places||[]).forEach(p=>{
      if(!p.location||seen[p.id]) return;
      seen[p.id]=1;
      const oh=p.currentOpeningHours||p.regularOpeningHours||null;
      out.push({
        id:'g'+p.id, kind:'shop', icon:'🪱', label:'Bait & tackle', src:'google',
        name:(p.displayName&&p.displayName.text)||'Bait & tackle', named:true,
        lat:p.location.latitude, lng:p.location.longitude,
        dist:haversineKm(lat,lng,p.location.latitude,p.location.longitude),
        gOpenNow: oh&&typeof oh.openNow==='boolean' ? oh.openNow : null,
        gHours: oh&&oh.weekdayDescriptions ? oh.weekdayDescriptions : null,
        rating:p.rating||null, ratings:p.userRatingCount||0,
        closed: p.businessStatus && p.businessStatus!=='OPERATIONAL',
        tags:{ 'addr:full':p.formattedAddress||'', phone:p.nationalPhoneNumber||'',
               website:p.websiteUri||'', shop:'fishing' }
      });
    });
  }
  return out.filter(s=>!s.closed);
}

async function fetchShops(lat,lng,radiusM){
  const r=radiusM||25000;
  const q=`[out:json][timeout:25];(`+
    `nwr(around:${r},${lat},${lng})["shop"="fishing"];`+
    `nwr(around:${r},${lat},${lng})["shop"="bait"];`+
    `nwr(around:${r},${lat},${lng})["shop"="outdoor"];`+
    `nwr(around:${r},${lat},${lng})["shop"="hunting"];`+
    `nwr(around:${r},${lat},${lng})["shop"="sports"]["sport"~"fishing"];`+
    `nwr(around:${r},${lat},${lng})["fishing"="yes"]["shop"];`+
    `nwr(around:${r},${lat},${lng})["leisure"="marina"];`+
    `nwr(around:${r},${lat},${lng})["leisure"="slipway"];`+
    `nwr(around:${r},${lat},${lng})["leisure"="fishing"];`+
    `);out tags center 120;`;
  const d=await overpass(q);
  const list=(d.elements||[]).map(e=>{
    const t=e.tags||{};
    const c=e.center||(e.lat!=null?{lat:e.lat,lon:e.lon}:null);
    if(!c) return null;
    let kind='shop', icon='🪱', label='Bait & tackle';
    if(t.leisure==='marina'){ kind='marina'; icon='⚓'; label='Marina'; }
    else if(t.leisure==='slipway'){ kind='ramp'; icon='🛥️'; label='Boat ramp'; }
    else if(t.leisure==='fishing'){ kind='pier'; icon='🎣'; label='Fishing spot'; }
    else if(t.shop==='outdoor'||t.shop==='hunting'||t.shop==='sports'){ label='Outdoor & sports'; }
    const nm = t.name || t.operator || t.brand || t.ref || null;
    return { id:(e.type||'n')+e.id, kind, icon, label,
      name:nm, named:!!nm, lat:c.lat, lng:c.lon, tags:t,
      dist:haversineKm(lat,lng,c.lat,c.lon) };
  }).filter(Boolean).sort((a,b)=>a.dist-b.dist);

  await nameTheUnnamed(list);
  list.forEach(s=>{
    if(!s.name) s.name = s.kind==='ramp'?'Unnamed boat ramp'
                       : s.kind==='marina'?'Unnamed marina'
                       : s.kind==='pier'?'Unnamed fishing spot':'Bait & tackle';
  });
  return list;
}

/* OSM rarely puts a name on a slipway itself — the name usually lives on the
   park, marina or parking area around it. One extra query borrows it, and the
   result is flagged so the UI can say the name was inferred. */
async function nameTheUnnamed(list){
  const blanks=list.filter(s=>!s.name).slice(0,14);
  if(!blanks.length) return;
  const clauses=blanks.map(s=>
    `way(around:300,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["leisure"];`+
    `way(around:300,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["amenity"~"parking|boat_rental|marina"];`+
    `nwr(around:300,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["boundary"="protected_area"];`+
    `node(around:400,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["place"];`
  ).join('');
  try{
    const d=await overpass(`[out:json][timeout:25];(${clauses});out tags center 150;`);
    const anchors=(d.elements||[]).map(e=>{
      const c=e.center||(e.lat!=null?{lat:e.lat,lon:e.lon}:null);
      return (c&&e.tags&&e.tags.name)?{name:e.tags.name,lat:c.lat,lng:c.lon,tags:e.tags}:null;
    }).filter(Boolean);
    blanks.forEach(s=>{
      let best=null,bd=1e9;
      anchors.forEach(a=>{
        const dd=haversineKm(s.lat,s.lng,a.lat,a.lng);
        if(dd<bd){ bd=dd; best=a; }
      });
      if(best && bd<0.6){
        const n=best.name;
        s.name = /ramp|launch|landing|marina|pier|dock/i.test(n)
          ? n
          : n + (s.kind==='ramp'?' boat ramp':s.kind==='marina'?' marina':'');
        s.derived=true;
      }
    });
  }catch(e){ console.warn('name enrichment failed:',e.message); }
}

/* Opening-hours reader for the common formats. OSM allows far more
   complexity than this; anything it cannot parse is reported as unknown
   rather than guessed at, because a wrong "Open now" sends someone
   driving to a locked door. */
const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
function readHours(spec){
  if(!spec) return {state:'unknown', today:null};
  const s=spec.trim();
  if(/^24\/7$/i.test(s)) return {state:'open', today:'Open 24 hours'};
  if(/PH|easter|sunrise|sunset|week|\bJan\b|\bFeb\b|\bMar\b|\bApr\b|\bMay\b|\bJun\b|\bJul\b|\bAug\b|\bSep\b|\bOct\b|\bNov\b|\bDec\b/i.test(s))
    return {state:'unknown', today:s};
  const now=new Date(), di=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  let todayRanges=null;
  for(const rule of s.split(';')){
    const r=rule.trim(); if(!r) continue;
    const m=r.match(/^([A-Za-z,\-]+)?\s*(.*)$/); if(!m) continue;
    const dayPart=(m[1]||'').trim(), timePart=(m[2]||'').trim();
    let days=[];
    if(!dayPart||/^\d/.test(r)){ days=[0,1,2,3,4,5,6]; }
    else{
      for(const tok of dayPart.split(',')){
        const rg=tok.trim().match(/^([A-Za-z]{2})\s*-\s*([A-Za-z]{2})$/);
        if(rg){
          let a=DAYS.indexOf(rg[1]), b=DAYS.indexOf(rg[2]);
          if(a<0||b<0) continue;
          for(let i=a;;i=(i+1)%7){ days.push(i); if(i===b) break; }
        } else {
          const i=DAYS.indexOf(tok.trim()); if(i>=0) days.push(i);
        }
      }
    }
    if(!days.includes(di)) continue;
    const tp = timePart || dayPart;
    if(/^off|closed$/i.test(tp.trim())){ todayRanges=[]; continue; }
    const ranges=[...tp.matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)]
      .map(x=>[ +x[1]*60 + +x[2], +x[3]*60 + +x[4] ]);
    if(ranges.length) todayRanges=ranges;
  }
  if(todayRanges===null) return {state:'unknown', today:s};
  if(!todayRanges.length) return {state:'closed', today:'Closed today'};
  const open=todayRanges.some(([a,b]) => b<a ? (mins>=a||mins<b) : (mins>=a&&mins<b));
  const fmt=n=>{const h=Math.floor(n/60)%24,m=n%60;const ap=h<12?'am':'pm';const hh=h%12===0?12:h%12;
                return hh+(m?':'+String(m).padStart(2,'0'):'')+ap;};
  return {state:open?'open':'closed',
          today:todayRanges.map(([a,b])=>fmt(a)+'–'+fmt(b)).join(', ')};
}

function shopIcon(s){
  const col = s.kind==='shop' ? '#e2622c' : s.kind==='marina' ? '#0b5fa5' : '#0a8f5f';
  return L.divIcon({className:'', iconSize:[26,26], iconAnchor:[13,13],
    html:`<div style="width:26px;height:26px;border-radius:50%;background:${col};border:2px solid #fff;
            box-shadow:0 1px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
            font-size:13px">${s.icon}</div>`});
}

async function toggleShops(){
  const btn=document.getElementById('b-shop');
  if(shopsOn){
    if(shopLayer) map.removeLayer(shopLayer);
    shopsOn=false; btn.classList.remove('on');
    return;
  }
  btn.classList.add('on');
  btn.innerHTML='⏳<span class="lw"> Finding…</span>';
  openModal(`<div class="mtitle">Searching…</div>
    <div class="msub"><span class="spin"></span> Looking for bait shops, marinas and ramps near the middle of your map.</div>`);
  const c=map.getCenter();
  GERR=null;
  try{
    let google=null;
    try{ google=await fetchPlacesGoogle(c.lat,c.lng,50000); }
    catch(e){ GERR=e.message; console.warn('google places failed:',e.message); }

    SHOPS=await fetchShops(c.lat,c.lng,25000);
    if(!SHOPS.length && !(google&&google.length)) SHOPS=await fetchShops(c.lat,c.lng,60000);

    if(google&&google.length){
      // Google for the shops, OSM for ramps and marinas it does not cover well
      const osmOther=SHOPS.filter(s=>s.kind!=='shop');
      const merged=[...google,...osmOther];
      // drop OSM shops that duplicate a Google result within 150 m
      SHOPS.filter(s=>s.kind==='shop').forEach(o=>{
        if(!google.some(g=>haversineKm(g.lat,g.lng,o.lat,o.lng)<0.15)) merged.push(o);
      });
      SHOPS=merged.sort((a,b)=>a.dist-b.dist);
    }
    if(shopLayer) map.removeLayer(shopLayer);
    shopLayer=L.layerGroup();
    SHOPS.forEach((s,i)=>{
      L.marker([s.lat,s.lng],{icon:shopIcon(s)})
        .on('click',()=>openShop(i))
        .addTo(shopLayer);
    });
    shopLayer.addTo(map);
    shopsOn=true;
    btn.innerHTML='🪱<span class="lw"> Shops</span>';
    showShopList();
  }catch(e){
    btn.classList.remove('on');
    btn.innerHTML='🪱<span class="lw"> Shops</span>';
    openModal(`<div class="mtitle">Could not load shops</div>
      <div class="msub">${esc(e.message||'network error')}</div>
      <button class="btn" onclick="closeModal()">OK</button>`);
  }
}

    }

    return `<button class="slrow" onclick="openShop(${i})">

        <div class="slname">${esc(s.name)}${s.derived?' <span class="chip">name inferred</span>':''}</div>
        <div class="slsub">${esc(s.label)} · ${s.dist.toFixed(1)} km${stars} ${badge}</div>
      </div><div class="arrow">›</div></button>`;
  }).join('');

  openModal(`
    <div class="mtitle">Nearby</div>
    <div class="msub">${SHOPS.length} place${SHOPS.length===1?'':'s'} · orange bait and tackle, blue marina, green ramp.
      ${fromG?`<br><span class="chip">${fromG} from Google</span>`:''}
      ${!shops&&!gOn?'<br><b>No tackle shops in OpenStreetMap here.</b> Rural Florida is thinly mapped — add a Google key below to get real listings.':''}</div>
    ${GERR?`<div class="msg bad">Google Places error: ${esc(GERR)}</div>`:''}
    ${rows}
    ${gOn?`<button class="linky" onclick="openMapsKeySetup()">Manage Google key</button>`

    <button class="btn alt" onclick="closeModal()">Close</button>

function openShop(i){
  const s=SHOPS[i]; if(!s) return;
  const t=s.tags||{};
  const isG = s.src==='google';
  const hrs = isG ? null : readHours(t.opening_hours);
  const badge = isG
    ? (s.gOpenNow===true?'<span class="ob open">Open now</span>'
      : s.gOpenNow===false?'<span class="ob shut">Closed now</span>'
      : '<span class="ob unk">Hours not listed</span>')
    : (hrs.state==='open'?'<span class="ob open">Open now</span>'
      : hrs.state==='closed'?'<span class="ob shut">Closed now</span>'
      : '<span class="ob unk">Hours not confirmed</span>');

  const svc=[];
  if(t.shop==='fishing'||t.shop==='bait') svc.push('Bait &amp; tackle');
  if(t.fishing==='yes') svc.push('Fishing gear');
  if(t.leisure==='marina') svc.push('Marina berths');
  if(t.leisure==='slipway') svc.push('Boat launch');
  if(t.boat_rental==='yes'||t.rental) svc.push('Rentals');
  if(t.fuel==='yes'||t.amenity==='fuel'||t['fuel:diesel']==='yes') svc.push('Fuel');
  if(t.ice==='yes') svc.push('Ice');
  if(t.toilets==='yes'||t.amenity==='toilets') svc.push('Restrooms');
  if(t.parking||t.amenity==='parking') svc.push('Parking');
  if(t.drinking_water==='yes') svc.push('Water');
  if(t.repair==='yes'||t.service==='repair') svc.push('Repairs');
  if(t.charter==='yes') svc.push('Charters');
  if(t.payment_cards==='yes'||t['payment:credit_cards']==='yes') svc.push('Cards accepted');

  const addr = t['addr:full'] ||
    [t['addr:housenumber'],t['addr:street'],t['addr:city'],t['addr:state']].filter(Boolean).join(' ');
  const phone=t.phone||t['contact:phone'];
  const web=t.website||t['contact:website'];

  const hoursBlock = isG
    ? (s.gHours&&s.gHours.length
        ? `<div class="sbval">${s.gHours.map(x=>esc(x)).join('<br>')}</div>`
        : `<div class="sbval">Not listed on Google</div>`)
    : `<div class="sbval">${hrs.today?esc(hrs.today):'Not recorded in OpenStreetMap'}</div>
       ${t.opening_hours&&hrs.state==='unknown'
         ? `<div class="hint2">Raw value: ${esc(t.opening_hours)} — too complex to read reliably, so call ahead.</div>`:''}`;

  openModal(`
    <div class="mtitle">${s.icon} ${esc(s.name)}</div>
    <div class="msub">${esc(s.label)} · ${s.dist.toFixed(1)} km away ${badge}
      ${s.rating?`<br>★ ${s.rating.toFixed(1)} from ${s.ratings} Google review${s.ratings===1?'':'s'}`:''}
      ${s.derived?'<br><span class="chip">name inferred</span> OpenStreetMap has no name on this ramp itself — this is the named park or lot around it.':''}</div>

    <div class="shopblk">
      <div class="sblbl">Hours</div>
      ${hoursBlock}
    </div>

    ${svc.length?`<div class="shopblk"><div class="sblbl">Services</div>
      <div>${svc.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
      <div class="hint2">Only what the source records. A shop may well offer more.</div></div>`:''}

    ${addr?`<div class="shopblk"><div class="sblbl">Address</div><div class="sbval">${esc(addr)}</div></div>`:''}

    <div class="row2" style="margin-top:6px">
      ${phone?`<a class="btn alt" style="text-align:center;text-decoration:none;display:block" href="tel:${esc(phone.replace(/[^\d+]/g,''))}">📞 Call</a>`:''}
      <a class="btn alt" style="text-align:center;text-decoration:none;display:block"
         href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">🧭 Directions</a>
    </div>
    ${web?`<a class="btn alt" style="text-align:center;text-decoration:none;display:block;margin-top:8px" href="${esc(web)}" target="_blank" rel="noopener">Website</a>`:''}
    <button class="btn alt" onclick="showShopList()">‹ Back to list</button>
    <div class="hint2" style="margin-top:10px">${isG?'Listing from Google Places.':'Data from OpenStreetMap contributors.'} Hours change — ring before a long drive.</div>
  `);
}

/* ============ RENDER ============ */
let marker=null, ring=null, state={};
const out=()=>document.getElementById('out');

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function titleCase(s){return s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());}
function tackleFor(common){
  if(!common) return null;
  const k=ALIAS[common.toLowerCase().trim()];
  return k?T[k]||null:null;
}
function ago(d){
  if(!d) return '';
  const days=Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/864e5);
  if(isNaN(days)) return d;
  if(days<=0) return 'today';
  if(days===1) return 'yesterday';
  if(days<30) return days+' days ago';
  if(days<365) return Math.round(days/30)+' months ago';
  return Math.round(days/365)+' years ago';
}

function status(msg){
  out().innerHTML=`<div class="status"><span class="spin"></span>${esc(msg)}</div>`;
}

function render(){
  const {name,type,lat,lng,counts,recent,radius,idsrc,fishErr} = state;
  const label={salt:'Saltwater',fresh:'Freshwater',brack:'Brackish / tidal',unk:'Type unknown'}[type];
  const cls={salt:'salt',fresh:'fresh',brack:'brack',unk:'unk'}[type];

  const targets=[], others=[];
  if(state.offline && state.fallbackSp){
    state.fallbackSp.forEach(k=>{
      const t=T[k]; if(!t) return;
      const common=Object.keys(ALIAS).find(a=>ALIAS[a]===k)||k;
      targets.push({c:{count:null},t,common,key:k,photo:null});
    });
  } else {
    (counts||[]).forEach(c=>{
      const tx=c.taxon||{};
      const common=tx.preferred_common_name||tx.name;
      const key=common?ALIAS[common.toLowerCase().trim()]:null;
      const t=key?T[key]||null:null;
      const photo=tx.default_photo?(tx.default_photo.medium_url||tx.default_photo.square_url):null;
      (t?targets:others).push({c,t,common,key,photo});
    });
  }

  let h='';
  h+=`<div class="loc">${esc(name||'Unnamed water')}</div>`;
  h+=`<div class="sub">${lat.toFixed(4)}, ${lng.toFixed(4)} · identified via ${esc(idsrc)}</div>`;
  h+=`<div class="pill ${cls}">${label}</div>`;

  h+=`<div class="tabs">
        <button class="tab ${state.tab==='common'?'on':''}" onclick="setTab('common')">Fish here</button>
        <button class="tab ${state.tab==='recent'?'on':''}" onclick="setTab('recent')">Recent</button>
        <button class="tab ${state.tab==='cond'?'on':''}" onclick="setTab('cond')">Tides</button>
        <button class="tab ${state.tab==='feed'?'on':''}" onclick="setTab('feed')">Community</button>
      </div>`;

  if(state.offline || state.idErr || fishErr){
    h+=`<div class="err">
          Live data is unreachable from this browser${state.offline?' — showing the built-in offline list for this area':''}.
          <br><a href="#" onclick="runDiagnostics();return false;" style="color:#9a3412;font-weight:700">Run a connection test →</a>
        </div>`;
  }

  if(state.tab==='common'){
    h+=`<div class="hint">${state.offline
      ? 'Built-in species list for this area — live records unavailable right now. Tap a fish for bait, rigging and technique.'
      : `Ranked by verified iNaturalist records within ${radius} km of your tap. Tap a fish for bait, rigging and technique.`}</div>`;
    if(!targets.length && !others.length){
      h+=`<div class="nod">No fish records logged within ${radius} km yet. That usually means the spot is lightly documented, not that it is empty. Try tapping a nearby pass, bridge or main basin.</div>`;
    }
    targets.forEach((x,i)=>{
      const t=x.t, sci=x.c.taxon&&x.c.taxon.name;
      h+=`<div class="card">
        <div class="chead" onclick="tog(this)">
          ${x.photo
            ? `<img class="fphoto" src="${esc(x.photo)}" alt="${esc(x.common)}" loading="lazy">`
            : `<div class="fphoto ph">${t.e}</div>`}
          <div style="flex:1;min-width:0">
            <div><span class="rank">#${i+1}</span><span class="fname">${esc(titleCase(x.common))}</span></div>
            <div class="sci">${esc(sci||'')}</div>
            <div class="cnt">${x.c.count==null?'commonly caught here':x.c.count+' record'+(x.c.count===1?'':'s')+' nearby'} · ${esc(t.d)} · ⭐ ${t.s}/10</div>
          </div><div class="arrow">▼</div>
        </div>
        <div class="det">${detailHTML(t,x.key,x.photo,x.common)}</div>
      </div>`;
    });
    if(others.length){
      h+=`<div class="lbl" style="margin-top:16px">Also recorded here</div><div class="nod">`;
      h+=others.slice(0,18).map(o=>`${esc(titleCase(o.common||'unknown'))} <span style="color:#9aa5b1">(${o.c.count})</span>`).join(' · ');
      h+=`</div>`;
    }
  } else if(state.tab==='recent'){
    h+=`<div class="hint">Most recent verified fish records within ${radius} km, newest first. Tap one for bait, rigging and legal limits.</div>`;
    if(!(recent||[]).length){
      h+=`<div class="nod">No recent records within ${radius} km.</div>`;
    }
    (recent||[]).forEach(o=>{
      const tx=o.taxon||{}, cn=tx.preferred_common_name||tx.name||'Unidentified fish';
      const key=cn?ALIAS[cn.toLowerCase().trim()]:null;
      const t=key?T[key]||null:null;
      const raw=(o.photos&&o.photos[0]&&o.photos[0].url)||'';
      const thumb=raw?raw.replace('square','small'):'';
      const big=raw?raw.replace('square','medium'):'';
      const place=o.place_guess||'';
      const meta=`<div class="obsmeta">
            📅 <b>Recorded:</b> ${esc(ago(o.observed_on))}${o.observed_on?' ('+esc(o.observed_on)+')':''}<br>
            ${place?`📍 <b>Where:</b> ${esc(place)}<br>`:''}
            ${tx.name?`🔬 <b>Species:</b> <i>${esc(tx.name)}</i><br>`:''}
            ${o.id?`<a class="rlink" href="https://www.inaturalist.org/observations/${o.id}" target="_blank" rel="noopener">See the original record →</a>`:''}
          </div>`;
      h+=`<div class="card">
        <div class="chead" onclick="tog(this)">
          ${thumb
            ? `<img class="fphoto" src="${esc(thumb)}" alt="${esc(cn)}" loading="lazy">`
            : `<div class="fphoto ph">${t?t.e:'🐟'}</div>`}
          <div style="flex:1;min-width:0">
            <div class="fname">${esc(titleCase(cn))}</div>
            <div class="sci">${esc(tx.name||'')}</div>
            <div class="cnt">${esc(ago(o.observed_on))}${place?' · '+esc(place.slice(0,34)):''}</div>
          </div><div class="arrow">▼</div>
        </div>
        <div class="det">${detailHTML(t,key,big,cn,meta)}</div>
      </div>`;
    });
  } else if(state.tab==='cond'){
    h+=condHTML();
  } else {
    h+=feedHTML();
  }

  h+=`<div class="foot">
        Water body from OpenStreetMap (Overpass API). Fish records and identification photos from iNaturalist — verified public observations, so they show what is actually documented in the area rather than a guess.<br><br>
        <b>Limits shown were checked against FWC on ${REG_CHECKED} and are a starting point, not legal advice.</b> Florida manages redfish, snook and seatrout by region, and reef fish seasons can change by executive order mid-season. Confirm on myfwc.com before you keep anything, and carry the right licence and permits.
      </div>`;
  out().innerHTML=h;
}

/* ============ LOOKUP ============ */
let seq=0;
async function lookup(lat,lng,radiusOverride){
  const my=++seq;
  const radius = radiusOverride || (map.getZoom()>=12 ? 8 : (map.getZoom()>=10 ? 15 : 25));

  if(marker) map.removeLayer(marker);
  if(ring) map.removeLayer(ring);
  marker=L.circleMarker([lat,lng],{radius:7,fillColor:'#e2622c',color:'#fff',weight:2,fillOpacity:.95}).addTo(map);
  ring=L.circle([lat,lng],{radius:radius*1000,color:'#0b5fa5',weight:1,fillOpacity:.05,dashArray:'4 4'}).addTo(map);

  status('Identifying the water body…');
  let id, idErr=null;
  try{ id = await identify(lat,lng); }
  catch(err){ id={name:null,type:'unk',src:'lookup failed',tags:{}}; idErr=err.message||'network error'; }
  if(my!==seq) return;

  const gaz = gazLookup(lat,lng);
  if(!id.name && gaz){ id={name:gaz.n, type:gaz.t, src:'offline list', tags:{}}; }

  status(`${id.name||'Water'} — pulling fish records within ${radius} km…`);
  let data={counts:[],recent:[],err:null};
  try{ data = await fishHere(lat,lng,radius); }
  catch(err){ data={counts:[],recent:[],err:err.message||'network error'}; }
  if(my!==seq) return;

  // If live records are unavailable, fall back to the built-in species list
  const offline = (!data.counts.length && !!data.err && !!gaz);

  state = {name:id.name, type:id.type, idsrc:id.src, lat, lng, radius,
           counts:data.counts, recent:data.recent, tab:'common', condDay:'today',
           fishErr:data.err, idErr, offline, fallbackSp: gaz?gaz.sp:null,
           tide:null, tideErr:null};
  FEED=null; FEED_ERR=null;
  render();

  // tides load in the background so the fish list is not held up
  if(id.type!=='fresh'){
    tidesFor(lat,lng)
      .then(t=>{ if(my===seq){ state.tide=t; if(state.tab==='cond') render(); } })
      .catch(e=>{ if(my===seq){ state.tideErr=e.message||'network error'; if(state.tab==='cond') render(); } });
  }
}

/* ============ LOCATE ME ============ */
let meDot=null;
function locateMe(){
  const btn=document.getElementById('b-loc');
  if(!navigator.geolocation){
    out().innerHTML='<div class="err">This browser does not support location.</div>';
    return;
  }
  btn.textContent='📍 Locating…';
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.textContent='📍 Locate me';
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(meDot) map.removeLayer(meDot);
    meDot=L.circleMarker([lat,lng],{radius:6,fillColor:'#0b5fa5',color:'#fff',weight:2,fillOpacity:1}).addTo(map);
    map.setView([lat,lng],14);
    lookup(lat,lng,8);
  }, err=>{
    btn.textContent='📍 Locate me';
    const msg = err.code===1
      ? 'Location permission was denied. Allow location for this site, or just tap the map.'
      : 'Could not get your location ('+(err.message||'unknown')+'). Tap the map instead.';
    out().innerHTML='<div class="err">'+esc(msg)+'</div>';
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
</script>
</body>
</html>
