/* Google Places gives far better small-business coverage than OSM, which is
   volunteer-mapped and thin in rural Florida. Optional: needs the user's own
   API key. Without it we fall back to OSM plus a Google Maps deep link. */
function gKey(){ return (CFG.GOOGLE_PLACES_KEY||'').trim() || localStorage.getItem('bc_gkey') || ''; }

async function fetchPlacesGoogle(lat,lng,radiusM){
  const key=gKey(); if(!key) return null;
  const queries=['bait and tackle shop','fishing tackle store'];
  const seen={}, out=[];
  for(const q of queries){
    const res=await fetch('https://places.googleapis.com/v1/places:searchText',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Goog-Api-Key':key,
        'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.location,'+
          'places.regularOpeningHours,places.currentOpeningHours,places.nationalPhoneNumber,'+
          'places.websiteUri,places.rating,places.userRatingCount,places.businessStatus'},
      body:JSON.stringify({textQuery:q,maxResultCount:20,
        locationBias:{circle:{center:{latitude:lat,longitude:lng},radius:Math.min(radiusM,50000)}}})
    });
    if(!res.ok){
      const t=await res.text().catch(()=>'');
      throw new Error('Google Places '+res.status+(t?': '+t.slice(0,140):''));
    }
    const d=await res.json();
    (d.places||[]).forEach(p=>{
      if(!p.location||seen[p.id]) return;
      seen[p.id]=1;
      const oh=p.currentOpeningHours||p.regularOpeningHours||null;
      out.push({
        id:'g'+p.id, kind:'shop', icon:'🪱', label:'Bait & tackle', src:'google',
        name:(p.displayName&&p.displayName.text)||'Bait & tackle', named:true,
        lat:p.location.latitude, lng:p.location.longitude,
        dist:haversineKm(lat,lng,p.location.latitude,p.location.longitude),
        gOpenNow: oh&&typeof oh.openNow==='boolean' ? oh.openNow : null,
        gHours: oh&&oh.weekdayDescriptions ? oh.weekdayDescriptions : null,
        rating:p.rating||null, ratings:p.userRatingCount||0,
        closed: p.businessStatus && p.businessStatus!=='OPERATIONAL',
        tags:{ 'addr:full':p.formattedAddress||'', phone:p.nationalPhoneNumber||'',
               website:p.websiteUri||'', shop:'fishing' }
      });
    });
  }
  return out.filter(s=>!s.closed);
}

async function fetchShops(lat,lng,radiusM){
  const r=radiusM||25000;
  const q=`[out:json][timeout:25];(`+
    `nwr(around:${r},${lat},${lng})["shop"="fishing"];`+
    `nwr(around:${r},${lat},${lng})["shop"="bait"];`+
    `nwr(around:${r},${lat},${lng})["shop"="outdoor"];`+
    `nwr(around:${r},${lat},${lng})["shop"="hunting"];`+
    `nwr(around:${r},${lat},${lng})["shop"="sports"]["sport"~"fishing"];`+
    `nwr(around:${r},${lat},${lng})["fishing"="yes"]["shop"];`+
    `nwr(around:${r},${lat},${lng})["leisure"="marina"];`+
    `nwr(around:${r},${lat},${lng})["leisure"="slipway"];`+
    `nwr(around:${r},${lat},${lng})["leisure"="fishing"];`+
    `);out tags center 120;`;
  const d=await overpass(q);
  const list=(d.elements||[]).map(e=>{
    const t=e.tags||{};
    const c=e.center||(e.lat!=null?{lat:e.lat,lon:e.lon}:null);
    if(!c) return null;
    let kind='shop', icon='🪱', label='Bait & tackle';
    if(t.leisure==='marina'){ kind='marina'; icon='⚓'; label='Marina'; }
    else if(t.leisure==='slipway'){ kind='ramp'; icon='🛥️'; label='Boat ramp'; }
    else if(t.leisure==='fishing'){ kind='pier'; icon='🎣'; label='Fishing spot'; }
    else if(t.shop==='outdoor'||t.shop==='hunting'||t.shop==='sports'){ label='Outdoor & sports'; }
    const nm = t.name || t.operator || t.brand || t.ref || null;
    return { id:(e.type||'n')+e.id, kind, icon, label,
      name:nm, named:!!nm, lat:c.lat, lng:c.lon, tags:t,
      dist:haversineKm(lat,lng,c.lat,c.lon) };
  }).filter(Boolean).sort((a,b)=>a.dist-b.dist);

  await nameTheUnnamed(list);
  list.forEach(s=>{
    if(!s.name) s.name = s.kind==='ramp'?'Unnamed boat ramp'
                       : s.kind==='marina'?'Unnamed marina'
                       : s.kind==='pier'?'Unnamed fishing spot':'Bait & tackle';
  });
  return list;
}

/* OSM rarely puts a name on a slipway itself — the name usually lives on the
   park, marina or parking area around it. One extra query borrows it, and the
   result is flagged so the UI can say the name was inferred. */
async function nameTheUnnamed(list){
  const blanks=list.filter(s=>!s.name).slice(0,14);
  if(!blanks.length) return;
  const clauses=blanks.map(s=>
    `way(around:300,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["leisure"];`+
    `way(around:300,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["amenity"~"parking|boat_rental|marina"];`+
    `nwr(around:300,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["boundary"="protected_area"];`+
    `node(around:400,${s.lat.toFixed(5)},${s.lng.toFixed(5)})["name"]["place"];`
  ).join('');
  try{
    const d=await overpass(`[out:json][timeout:25];(${clauses});out tags center 150;`);
    const anchors=(d.elements||[]).map(e=>{
      const c=e.center||(e.lat!=null?{lat:e.lat,lon:e.lon}:null);
      return (c&&e.tags&&e.tags.name)?{name:e.tags.name,lat:c.lat,lng:c.lon,tags:e.tags}:null;
    }).filter(Boolean);
    blanks.forEach(s=>{
      let best=null,bd=1e9;
      anchors.forEach(a=>{
        const dd=haversineKm(s.lat,s.lng,a.lat,a.lng);
        if(dd<bd){ bd=dd; best=a; }
      });
      if(best && bd<0.6){
        const n=best.name;
        s.name = /ramp|launch|landing|marina|pier|dock/i.test(n)
          ? n
          : n + (s.kind==='ramp'?' boat ramp':s.kind==='marina'?' marina':'');
        s.derived=true;
      }
    });
  }catch(e){ console.warn('name enrichment failed:',e.message); }
}

/* Opening-hours reader for the common formats. OSM allows far more
   complexity than this; anything it cannot parse is reported as unknown
   rather than guessed at, because a wrong "Open now" sends someone
   driving to a locked door. */
const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
function readHours(spec){
  if(!spec) return {state:'unknown', today:null};
  const s=spec.trim();
  if(/^24\/7$/i.test(s)) return {state:'open', today:'Open 24 hours'};
  if(/PH|easter|sunrise|sunset|week|\bJan\b|\bFeb\b|\bMar\b|\bApr\b|\bMay\b|\bJun\b|\bJul\b|\bAug\b|\bSep\b|\bOct\b|\bNov\b|\bDec\b/i.test(s))
    return {state:'unknown', today:s};
  const now=new Date(), di=now.getDay(), mins=now.getHours()*60+now.getMinutes();
  let todayRanges=null;
  for(const rule of s.split(';')){
    const r=rule.trim(); if(!r) continue;
    const m=r.match(/^([A-Za-z,\-]+)?\s*(.*)$/); if(!m) continue;
    const dayPart=(m[1]||'').trim(), timePart=(m[2]||'').trim();
    let days=[];
    if(!dayPart||/^\d/.test(r)){ days=[0,1,2,3,4,5,6]; }
    else{
      for(const tok of dayPart.split(',')){
        const rg=tok.trim().match(/^([A-Za-z]{2})\s*-\s*([A-Za-z]{2})$/);
        if(rg){
          let a=DAYS.indexOf(rg[1]), b=DAYS.indexOf(rg[2]);
          if(a<0||b<0) continue;
          for(let i=a;;i=(i+1)%7){ days.push(i); if(i===b) break; }
        } else {
          const i=DAYS.indexOf(tok.trim()); if(i>=0) days.push(i);
        }
      }
    }
    if(!days.includes(di)) continue;
    const tp = timePart || dayPart;
    if(/^off|closed$/i.test(tp.trim())){ todayRanges=[]; continue; }
    const ranges=[...tp.matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)]
      .map(x=>[ +x[1]*60 + +x[2], +x[3]*60 + +x[4] ]);
    if(ranges.length) todayRanges=ranges;
  }
  if(todayRanges===null) return {state:'unknown', today:s};
  if(!todayRanges.length) return {state:'closed', today:'Closed today'};
  const open=todayRanges.some(([a,b]) => b<a ? (mins>=a||mins<b) : (mins>=a&&mins<b));
  const fmt=n=>{const h=Math.floor(n/60)%24,m=n%60;const ap=h<12?'am':'pm';const hh=h%12===0?12:h%12;
                return hh+(m?':'+String(m).padStart(2,'0'):'')+ap;};
  return {state:open?'open':'closed',
          today:todayRanges.map(([a,b])=>fmt(a)+'–'+fmt(b)).join(', ')};
}

function shopIcon(s){

async function toggleShops(){
  const btn=document.getElementById('b-shop');
  if(shopsOn){
    if(shopLayer) map.removeLayer(shopLayer);
    shopsOn=false; btn.classList.remove('on');
    return;
  }
  btn.classList.add('on');
  btn.innerHTML='⏳<span class="lw"> Finding…</span>';
  openModal(`<div class="mtitle">Searching…</div>
    <div class="msub"><span class="spin"></span> Looking for bait shops, marinas and ramps near the middle of your map.</div>`);
  const c=map.getCenter();
  GERR=null;
  try{
    let google=null;
    try{ google=await fetchPlacesGoogle(c.lat,c.lng,50000); }
    catch(e){ GERR=e.message; console.warn('google places failed:',e.message); }

    SHOPS=await fetchShops(c.lat,c.lng,25000);
    if(!SHOPS.length && !(google&&google.length)) SHOPS=await fetchShops(c.lat,c.lng,60000);

    if(google&&google.length){
      // Google for the shops, OSM for ramps and marinas it does not cover well
      const osmOther=SHOPS.filter(s=>s.kind!=='shop');
      const merged=[...google,...osmOther];
      // drop OSM shops that duplicate a Google result within 150 m
      SHOPS.filter(s=>s.kind==='shop').forEach(o=>{
        if(!google.some(g=>haversineKm(g.lat,g.lng,o.lat,o.lng)<0.15)) merged.push(o);
      });
      SHOPS=merged.sort((a,b)=>a.dist-b.dist);
    }
    if(shopLayer) map.removeLayer(shopLayer);
    shopLayer=L.layerGroup();
    SHOPS.forEach((s,i)=>{
      L.marker([s.lat,s.lng],{icon:shopIcon(s)})
        .on('click',()=>openShop(i))
        .addTo(shopLayer);
    });
    shopLayer.addTo(map);
    shopsOn=true;
    btn.innerHTML='🪱<span class="lw"> Shops</span>';
    showShopList();
  }catch(e){
    btn.classList.remove('on');
    btn.innerHTML='🪱<span class="lw"> Shops</span>';
    openModal(`<div class="mtitle">Could not load shops</div>
      <div class="msub">${esc(e.message||'network error')}</div>
      <button class="btn" onclick="closeModal()">OK</button>`);
  }
}

  if(t.parking||t.amenity==='parking') svc.push('Parking');

  const addr = t['addr:full'] ||
    [t['addr:housenumber'],t['addr:street'],t['addr:city'],t['addr:state']].filter(Boolean).join(' ');

  openModal(`
    <div class="mtitle">${s.icon} ${esc(s.name)}</div>
    <div class="msub">${esc(s.label)} · ${mi(s.dist)} mi away ${badge}
      ${s.rating?`<br>★ ${s.rating.toFixed(1)} from ${s.ratings} Google review${s.ratings===1?'':'s'}`:''}

      <div class="sblbl">Hours</div>

/* ============================================================
   WEATHER & BAROMETRIC PRESSURE  (Open-Meteo — free, no key)
   Barometric trend is the most useful weather signal in fishing: a
   falling glass ahead of a front switches fish on, a high flat glass
   behind one shuts them down. Competitors show the number; showing
   the trend and what it means is the edge.
   ============================================================ */
const OM='https://api.open-meteo.com/v1/forecast';
let WX=null, WX_ERR=null;

async function fetchWeather(lat,lng){
  const p=new URLSearchParams({
    latitude:lat.toFixed(4), longitude:lng.toFixed(4),
    current:'temperature_2m,apparent_temperature,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation,weather_code,is_day',
    hourly:'temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,cloud_cover,precipitation_probability',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_probability_max',
    temperature_unit:'fahrenheit', wind_speed_unit:'mph', precipitation_unit:'inch',
    timezone:'auto', past_hours:'12', forecast_days:'7'
  });
  const d=await getJSON(OM+'?'+p.toString(),20000);
  if(!d||!d.current) throw new Error('weather response had no current conditions');
  return d;
}

const COMPASS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass=d=>COMPASS[Math.round((d%360)/22.5)%16];

const WXCODE={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Part cloud','⛅'],3:['Overcast','☁️'],
 45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Drizzle','🌦️'],
 61:['Light rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Snow','🌨️'],
 80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','⛈️'],
 95:['Thunderstorm','⛈️'],96:['Thunderstorm','⛈️'],99:['Thunderstorm','⛈️']};
const wxDesc=c=>WXCODE[c]||['—','🌡️'];

/* Pressure trend across roughly the last six hours, in millibars. */
function pressureTrend(wx){
  if(!wx||!wx.hourly||!wx.hourly.surface_pressure) return null;
  const times=wx.hourly.time||[], vals=wx.hourly.surface_pressure||[];
  const now=Date.now();
  let iNow=-1;
  for(let i=0;i<times.length;i++){
    if(new Date(times[i]).getTime()<=now) iNow=i; else break;
  }
  if(iNow<1) return null;
  const back=Math.max(0,iNow-6);
  const cur=vals[iNow], past=vals[back];
  if(cur==null||past==null) return null;
  const delta=cur-past, hrs=iNow-back;
  let word,meaning,effect;
  if(delta<=-2.0){ word='falling fast'; effect=3;
    meaning='A sharp drop means weather is coming. Fish very often feed hard in the hours ahead of a front — this is usually the best window you will get all week.'; }
  else if(delta<=-0.7){ word='falling'; effect=2;
    meaning='Slowly falling pressure tends to switch fish on. Worth getting out.'; }
  else if(delta<0.7){ word='steady'; effect=0;
    meaning='The glass is holding. Fish settle into normal patterns, so tide and light matter more than pressure today.'; }
  else if(delta<2.0){ word='rising'; effect=-1;
    meaning='Rising pressure usually follows a front through. Fish tend to drop deeper and get pickier for a while.'; }
  else { word='rising fast'; effect=-2;
    meaning='A sharp rise behind a front is the classic tough bite. Downsize your bait, slow everything down, and fish tight to cover.'; }
  const series=[];
  for(let i=back;i<=iNow;i++) if(vals[i]!=null) series.push(vals[i]);
  return {cur,past,delta,hrs,word,meaning,effect,series};
}

/* Wind decides whether you can fish at all, and where. */
function windRead(wx){
  if(!wx||!wx.current) return null;
  const c=wx.current, s=c.wind_speed_10m, g=c.wind_gusts_10m, d=c.wind_direction_10m;
  if(s==null) return null;
  let band,note,effect;
  if(s<4){ band='glass calm'; effect=-1;
    note='Barely a breath. The surface will be slick and fish spook easily — lighten the leader and lengthen your casts.'; }
  else if(s<11){ band='light'; effect=2;
    note='A light ripple is close to ideal. It hides your outline without making the boat hard to handle.'; }
  else if(s<18){ band='moderate'; effect=1;
    note='Workable. Fish the wind-blown bank if you can get to it — moving water stacks bait against the shoreline.'; }
  else if(s<26){ band='strong'; effect=-2;
    note='Hard work on open water. Stay in protected creeks, canals and backwaters.'; }
  else { band='very strong'; effect=-3;
    note='Small boats should stay off open water. Fish from shore or wait it out.'; }
  return {speed:Math.round(s), gust:g==null?null:Math.round(g), dir:d, band, note, effect,
          arrow:d==null?'':compass(d)};
}

/* ============================================================
   BITE SCORE
   One 0-100 number from the things that genuinely move a bite.
   Every component is shown with its own contribution, so the score
   can be argued with rather than merely believed.
   ============================================================ */
function biteScore(lat,lng,when,wx,tide){
  const at=when||new Date();
  const sol=solunar(lat,lng,at);
  const parts=[];
  let score=42;                      // an ordinary hour on ordinary water

  const inWin=sol.periods.find(p=>at>=p.start&&at<=p.end);
  if(inWin){
    const v=inWin.kind==='major'?18:10;
    score+=v; parts.push({k:'Feeding period',v,d:inWin.label+' — '+inWin.kind+' period'});
  } else {
    let best=null;
    sol.periods.forEach(p=>{
      const gap=Math.min(Math.abs(at-p.start),Math.abs(at-p.end));
      if(!best||gap<best.gap) best={p,gap};
    });
    if(best&&best.gap<45*60000){ score+=5; parts.push({k:'Feeding period',v:5,d:'just outside a feeding window'}); }
    else parts.push({k:'Feeding period',v:0,d:'no major or minor period running'});
  }

  const ph=sol.phase.phase;
  const dm=Math.min(Math.abs(ph-0),Math.abs(ph-1),Math.abs(ph-0.5));
  if(dm<0.05){ score+=8; parts.push({k:'Moon',v:8,d:phaseName(ph)+' — strongest tides of the month'}); }
  else if(dm<0.12){ score+=4; parts.push({k:'Moon',v:4,d:phaseName(ph)+' — tides building'}); }
  else parts.push({k:'Moon',v:0,d:phaseName(ph)});

  const sr=sol.sun.rise, ss=sol.sun.set;
  const nearT=(t,m)=>t&&Math.abs(at-t)<m*60000;
  if(nearT(sr,75)||nearT(ss,75)){ score+=12; parts.push({k:'Light',v:12,d:'first or last light — the prime window most days'}); }
  else if(sr&&ss&&(at<sr||at>ss)){ score+=4; parts.push({k:'Light',v:4,d:'after dark — good around lights and structure'}); }
  else{
    const noon=new Date(at); noon.setHours(13,0,0,0);
    if(Math.abs(at-noon)<2.5*3600000){ score-=6; parts.push({k:'Light',v:-6,d:'harsh midday sun — fish hold deep or in shade'}); }
    else parts.push({k:'Light',v:0,d:'ordinary daylight'});
  }

  const pt=pressureTrend(wx);
  if(pt){ const v=pt.effect*4; score+=v;
    parts.push({k:'Pressure',v,d:Math.round(pt.cur)+' mb, '+pt.word+' '+(pt.delta>=0?'+':'')+pt.delta.toFixed(1)+' mb in '+pt.hrs+'h'}); }

  const w=windRead(wx);
  if(w){ const v=w.effect*3; score+=v;
    parts.push({k:'Wind',v,d:w.speed+' mph'+(w.arrow?' '+w.arrow:'')+' — '+w.band}); }

  const ts=tideStage(tide,at);
  if(ts){
    const v = ts.strength==='strong'?10 : ts.strength==='moderate'?5 : -6;
    score+=v; parts.push({k:'Tide',v,d:ts.label});
  } else parts.push({k:'Tide',v:0,d:'no tide data for this water'});

  score=Math.max(1,Math.min(100,Math.round(score)));
  return {score, parts, sol, pt, wind:w, tide:ts, at};
}

/* Sequential magnitude ramp — validated monotonic in lightness and at
   least 3.9:1 against the app's dark surface. The same ramp drives the
   hourly bars and the verdict chip, because both encode one quantity. */
const BITE_RAMP=['#1f8a72','#26a888','#2fc49e','#57dcb4','#8ff0cd'];
function biteBand(s){
  if(s>=78) return {t:'Prime', i:'●●●●', c:BITE_RAMP[4], idx:4};
  if(s>=62) return {t:'Strong',i:'●●●',       c:BITE_RAMP[3], idx:3};
  if(s>=46) return {t:'Fair',  i:'●●',             c:BITE_RAMP[2], idx:2};
  if(s>=30) return {t:'Slow',  i:'●',                   c:BITE_RAMP[1], idx:1};
  return      {t:'Tough', i:'○',                        c:BITE_RAMP[0], idx:0};
}

/* Score every hour of a day so the angler can pick a window. */
function hourlyBite(lat,lng,wx,tide,dayOffset){
  const base=new Date(); base.setHours(0,0,0,0);
  if(dayOffset) base.setDate(base.getDate()+dayOffset);
  const rows=[];
  for(let h=0;h<24;h++){
    const t=new Date(base.getTime()+h*3600000);
    const s=biteScore(lat,lng,t,wx,tide).score;
    rows.push({h,t,score:s,band:biteBand(s)});
  }
  return rows;
}

   TODAY — the headline view
   Charts follow the magnitude rule: one measure, one sequential
   ramp, direct labels only where they earn their place, and a
   hover layer because an HTML chart is interactive by nature.

function todayHTML(){
  const st=state||{};
  if(st.lat==null) return '<div class="nod">Tap the map to get a forecast for that water.</div>';
  const b=biteScore(st.lat,st.lng,new Date(),WX,st.tide);
  const band=biteBand(b.score);
  let h='';

  /* ---- hero ---- */
  h+=`<div class="hero">
    <div class="heroTop">
      <div>
        <div class="heroLbl">Bite score now</div>
        <div class="heroNum" style="color:${band.c}">${b.score}<span class="heroOf">/100</span></div>
        <div class="heroBand" style="color:${band.c}">
          <span class="heroDots" aria-hidden="true">${band.i}</span> ${band.t}
        </div>
      </div>
      <div class="heroMoon">
        <div class="hmIcon">${phaseEmoji(b.sol.phase.phase)}</div>
        <div class="hmTxt">${esc(phaseName(b.sol.phase.phase))}<br>${Math.round(b.sol.phase.illum*100)}% lit</div>
      </div>
    </div>
    <div class="heroWhy">${esc(biteSummary(b,band))}</div>
  </div>`;

  /* ---- condition strip ---- */
  const c=WX&&WX.current;
  const cells=[];
  if(c){
    const wd=wxDesc(c.weather_code);
    cells.push(['Air', c.temperature_2m!=null?Math.round(c.temperature_2m)+'\u00B0':'\u2014', wd[1]]);
    if(b.wind) cells.push(['Wind '+b.wind.arrow, b.wind.speed, '\uD83D\uDCA8']);
    if(b.pt)   cells.push(['mb', Math.round(b.pt.cur), b.pt.delta<-0.2?'\u2193':b.pt.delta>0.2?'\u2191':'\u2192']);
    if(c.cloud_cover!=null) cells.push(['Cloud', Math.round(c.cloud_cover)+'%', '\u2601\uFE0F']);
  }
  if(st.tide&&st.tide.temp) cells.push(['Water', Math.round(st.tide.temp)+'\u00B0', '\uD83C\uDF0A']);
  cells.push(['Sunrise', fmtT(b.sol.sun.rise), '\uD83C\uDF05']);
  cells.push(['Sunset', fmtT(b.sol.sun.set), '\uD83C\uDF07']);
  if(cells.length) h+=`<div class="strip">`+cells.map(x=>
      `<div class="stripCell"><div class="scIco">${x[2]}</div><div class="scVal">${esc(x[1])}</div><div class="scLbl">${esc(x[0])}</div></div>`
    ).join('')+`</div>`;

  if(WX_ERR) h+=`<div class="msg bad" style="margin-top:10px">Weather unavailable: ${esc(WX_ERR)}. Score is running on moon, light and tide alone.</div>`;
  else if(!WX) h+=`<div class="nod" style="padding:8px 0"><span class="spin"></span>Loading weather…</div>`;

  /* ---- hourly timeline ---- */
  h+=hourlyChart(st);

  /* ---- pressure ---- */
  if(b.pt) h+=pressureCard(b.pt);

  /* ---- wind ---- */
  if(b.wind) h+=`<div class="panel">
      <div class="pTitle">💨 Wind — ${esc(b.wind.speed+' mph '+b.wind.arrow)}${b.wind.gust?`, gusting ${b.wind.gust}`:''}</div>
      <div class="pBody">${esc(b.wind.note)}</div>
    </div>`;

  /* ---- breakdown ---- */
  h+=`<div class="panel">
    <div class="pTitle">How that score was built</div>
    <div class="pBody" style="margin-bottom:8px">Starting from an ordinary hour on ordinary water, then adjusted:</div>
    ${b.parts.map(p=>`
      <div class="bdRow">
        <div class="bdK">${esc(p.k)}</div>
        <div class="bdD">${esc(p.d)}</div>
        <div class="bdV ${p.v>0?'up':p.v<0?'dn':'nil'}">${p.v>0?'+':''}${p.v||'0'}</div>
      </div>`).join('')}
    <div class="pFoot">Weighted from the factors anglers have relied on for decades — feeding periods, moon, light, barometric trend, wind and current. It is a guide to <i>when</i> to go, not a promise about what you will catch.</div>
  </div>`;

  /* ---- 7 day ---- */
  h+=weekHTML(st);
  return h;
}

function biteSummary(b,band){
  const bits=[];
  const top=b.parts.filter(p=>p.v>0).sort((x,y)=>y.v-x.v)[0];
  const bot=b.parts.filter(p=>p.v<0).sort((x,y)=>x.v-y.v)[0];
  if(band.idx>=3) bits.push('Conditions are lining up');
  else if(band.idx===2) bits.push('An average window');
  else bits.push('Not the best window');
  if(top) bits.push('helped most by '+top.d.toLowerCase());
  if(bot) bits.push('held back by '+bot.d.toLowerCase());
  return bits.join(', ')+'.';
}

/* Hourly bars. One measure, so a sequential ramp and no legend —
   the title names it. Rounded data-ends, 2px gaps, hover per bar. */
function hourlyChart(st){
  const rows=hourlyBite(st.lat,st.lng,WX,st.tide,state.dayOff||0);
  const nowH=new Date().getHours();
  const isToday=!(state.dayOff);
  const best=rows.reduce((a,r)=>r.score>a.score?r:a,rows[0]);
  // pad the plot box so edge labels and the current-hour ring are not clipped
  const PAD=4, W=100, H=50, PW=W-PAD*2, n=rows.length;
  const bw=PW/n, gap=Math.min(0.9,bw*0.22);
  const bars=rows.map(r=>{
    const hgt=Math.max(1.8,(r.score/100)*H);
    const x=PAD+r.h*bw+gap/2, y=H-hgt, w=bw-gap;
    const cur=isToday&&r.h===nowH;
    return '<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+w.toFixed(2)+'" height="'+hgt.toFixed(2)+
      '" rx="'+Math.min(1.5,w/2).toFixed(2)+'" fill="'+r.band.c+'" class="hb"'+
      (cur?' stroke="#eef4f8" stroke-width="0.6"':'')+
      '><title>'+String(r.h).padStart(2,'0')+':00 — '+r.score+'/100, '+r.band.t+'</title></rect>';
  }).join('');
  const lab=[0,6,12,18,23];
  const ticks=lab.map(i=>{
    const cx=PAD+i*bw+bw/2;
    const anchor=i===0?'start':i===23?'end':'middle';
    const x=i===0?PAD:i===23?W-PAD:cx;
    const t=i===0?'12a':i===12?'12p':i>12?(i-12)+'p':i+'a';
    return '<text x="'+x.toFixed(2)+'" y="'+(H+6)+'" class="hbx" text-anchor="'+anchor+'">'+t+'</text>';
  }).join('');
  return '<div class="panel">'+
    '<div class="pTitle">Hour by hour'+(isToday?' today':' tomorrow')+
      '<button class="pSwap" onclick="setDayOff('+(isToday?1:0)+')">'+(isToday?'tomorrow \u203A':'\u2039 today')+'</button></div>'+
    '<div class="chartWrap"><svg viewBox="0 0 '+W+' '+(H+9)+'" preserveAspectRatio="none" class="hchart" role="img" '+
      'aria-label="Bite score for each hour'+(isToday?' today':' tomorrow')+', peak '+best.score+' out of 100 at '+best.h+':00">'+
      '<line x1="'+PAD+'" y1="'+H+'" x2="'+(W-PAD)+'" y2="'+H+'" class="hbase"/>'+bars+ticks+
    '</svg></div>'+
    '<div class="pBody">Best window '+(isToday?'today':'tomorrow')+' is <b style="color:'+best.band.c+'">'+
      String(best.h).padStart(2,'0')+':00</b> at '+best.score+'/100 ('+best.band.t.toLowerCase()+
      '). Tap a bar for its exact score.</div></div>';
}

function setDayOff(d){ state.dayOff=d; render(); }

/* Pressure over the last six hours. One line, one series, no legend. */
function pressureCard(pt){
  const s=pt.series;
  if(!s||s.length<2) return '';
  const min=Math.min(...s), max=Math.max(...s), span=Math.max(0.6,max-min);
  // inset the plot so the stroke and the end dot cannot clip on any edge
  const W=100,H=26,PX=3,PY=4, PW=W-PX*2, PH=H-PY*2;
  const pts=s.map((v,i)=>[PX+(i/(s.length-1))*PW, PY+PH-((v-min)/span)*PH]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');
  const last=pts[pts.length-1];
  const col=pt.effect>0?BITE_RAMP[4]:pt.effect<0?'#fab219':'#9db2c4';
  return '<div class="panel">'+
    '<div class="pTitle">Barometric pressure \u2014 '+esc(pt.word)+'</div>'+
    '<div class="sparkRow">'+
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="spark" role="img" '+
        'aria-label="Surface pressure over the last '+pt.hrs+' hours, '+esc(pt.word)+
        ', '+(pt.delta>=0?'up ':'down ')+Math.abs(pt.delta).toFixed(1)+' millibars">'+
        '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<circle cx="'+last[0].toFixed(2)+'" cy="'+last[1].toFixed(2)+'" r="1.8" fill="'+col+'" stroke="#0e1f2e" stroke-width="0.7"/>'+
      '</svg>'+
      '<div class="sparkNum"><div class="snV" style="color:'+col+'">'+(pt.delta>=0?'+':'')+pt.delta.toFixed(1)+'</div>'+
      '<div class="snL">mb / '+pt.hrs+'h</div></div>'+
    '</div>'+
    '<div class="pBody">'+esc(pt.meaning)+'</div>'+
    '<div class="pFoot">Now '+Math.round(pt.cur)+' mb, was '+Math.round(pt.past)+' mb '+pt.hrs+' hours ago.</div></div>';
}

/* Seven-day outlook. */
function weekHTML(st){
  if(!WX||!WX.daily||!WX.daily.time) return '';
  const D=WX.daily, days=D.time||[];
  if(!days.length) return '';
  let h=`<div class="panel"><div class="pTitle">Next seven days</div><div class="week">`;
  days.slice(0,7).forEach((dt,i)=>{
    const date=new Date(dt+'T12:00:00');
    const off=Math.round((date-new Date(new Date().setHours(12,0,0,0)))/DAYMS);
    const rows=hourlyBite(st.lat,st.lng,WX,st.tide,off);
    const peak=rows.reduce((a,r)=>r.score>a.score?r:a,rows[0]);
    const wd=wxDesc(D.weather_code?D.weather_code[i]:null);
    const nm=i===0?'Today':date.toLocaleDateString([],{weekday:'short'});
    return h+=`<div class="wDay">
      <div class="wName">${esc(nm)}</div>
      <div class="wIco" title="${esc(wd[0])}">${wd[1]}</div>
      <div class="wBar"><span style="height:${Math.max(8,peak.score)}%;background:${peak.band.c}"></span></div>
      <div class="wScore" style="color:${peak.band.c}">${peak.score}</div>
      <div class="wTemp">${D.temperature_2m_max?Math.round(D.temperature_2m_max[i])+'°':''}</div>
    </div>`;
  });
  h+=`</div><div class="pFoot">Peak bite score for each day, from moon and light. Every day carries today's pressure and wind, because no forecast that far out is loaded — so treat the later days as the moon and sun picture, not a weather call.</div></div>`;
  return h;
}

/* ============================================================
   RAIN RADAR  (RainViewer — free, no key)
   Windy's animated wind field needs a paid tile key, so this shows
   live precipitation instead: for fishing, seeing the squall coming
   is the more useful of the two, and wind already appears as data.
   ============================================================ */
let radarLayer=null, radarOn=false, radarFrames=null, radarLegend=null;

async function radarFrame(){
  if(radarFrames) return radarFrames;
  const d=await getJSON('https://api.rainviewer.com/public/weather-maps.json',15000);
  const past=(d&&d.radar&&d.radar.past)||[];
  if(!past.length) throw new Error('radar returned no frames');
  radarFrames={host:d.host||'https://tilecache.rainviewer.com', frame:past[past.length-1]};
  return radarFrames;
}

async function toggleRadar(){
  const btn=document.getElementById('b-radar');
  if(radarOn){
    if(radarLayer) map.removeLayer(radarLayer);
    if(radarLegend){ radarLegend.remove(); radarLegend=null; }
    radarOn=false; btn.classList.remove('on');
    return;
  }
  btn.classList.add('on'); btn.innerHTML='⏳';
  try{
    const f=await radarFrame();
    if(radarLayer) map.removeLayer(radarLayer);
    /* RainViewer only renders its mosaic over a narrow zoom band. Ask for a
       tile outside it and you do not get a 404 you can catch — you get a
       perfectly valid PNG with "Zoom Level Not Supported" painted into it,
       which is why this looked like grey boxes rather than a failure. Their
       API documents a maximum of 7; an independent implementation that hit
       the same placeholder settled on 4-9. Staying inside both and letting
       Leaflet stretch outside it costs nothing real: a radar mosaic is about
       1 km per pixel, so there is no detail past zoom 7 to lose. */
    radarLayer=L.tileLayer(f.host+f.frame.path+'/256/{z}/{x}/{y}/2/1_1.png',
      {opacity:0.62, maxZoom:22, minNativeZoom:4, maxNativeZoom:7,
       pane:'radarTiles', attribution:'RainViewer'});
    radarLayer.addTo(map);
    radarOn=true;
    btn.innerHTML='\u{1F327}️<span class="lw"> Radar</span>';
    radarLegend=L.control({position:'bottomright'});
    radarLegend.onAdd=function(){
      const el=L.DomUtil.create('div','dlegend');
      const age=Math.round((Date.now()/1000-f.frame.time)/60);
      el.innerHTML='<div class="dlt">Rain radar</div>'+
        '<div class="dlr">Live precipitation. Heavier colour means heavier rain.</div>'+
        '<div class="dlnote">Radar is about 1 km per pixel, so it stays coarse and goes soft as you zoom right in — that is the data, not a loading problem.</div>'+
        '<div class="dlnote">Frame is '+age+' min old. A squall line crossing your water usually'+
        ' means a pressure drop just ahead of it — often the best short window of the day,'+
        ' but get off the water before the lightning arrives.</div>';
      L.DomEvent.disableClickPropagation(el);
      return el;
    };
    radarLegend.addTo(map);
  }catch(e){
    radarOn=false; btn.classList.remove('on');
    btn.innerHTML='\u{1F327}️<span class="lw"> Radar</span>';
    openModal('<div class="mtitle">Radar unavailable</div>'+
      '<div class="msub">'+esc(e.message||'network error')+'</div>'+
      '<button class="btn" onclick="closeModal()">OK</button>');
  }
}

/* ============================================================
   SAVED SPOTS
   Private by design. The Supabase spots table is owner-only at the
   database level, so a saved spot is never visible to anyone else.
   Signed out, it lives on this device only.
   ============================================================ */
let MYSPOTS=null, spotSaveLayer=null;

function localSpots(){
  try{ return JSON.parse(localStorage.getItem('bc_spots')||'[]'); }catch(e){ return []; }
}
function setLocalSpots(a){
  try{ localStorage.setItem('bc_spots',JSON.stringify(a.slice(0,200))); }catch(e){}
}

async function loadMySpots(){
  if(sb&&ME){
    try{
      const {data,error}=await sb.from('spots').select('*').order('created_at',{ascending:false});
      if(error) throw error;
      MYSPOTS=(data||[]).map(s=>({...s,remote:true}));
      return MYSPOTS;
    }catch(e){ console.warn('spots load failed:',e.message); }
  }
  MYSPOTS=localSpots();
  return MYSPOTS;
}

function openSaveSpot(){
  const st=state||{};
  if(st.lat==null) return openModal(`<div class="mtitle">Pick a spot first</div>
    <div class="msub">Tap the map where you want to save, then save it.</div>
    <button class="btn" onclick="closeModal()">OK</button>`);
  openModal(`
    <div class="mtitle">Save this spot</div>
    <div class="msub">📍 ${esc(st.name||'this water')} · ${st.lat.toFixed(4)}, ${st.lng.toFixed(4)}<br>
      Saved spots are private to you${ME?'':' and stored on this device until you sign in'}.</div>
    <div id="formmsg"></div>
    <div class="fld"><label>Name it</label>
      <input id="spn" placeholder="the dock light, second bar, oyster point…" autocapitalize="words"></div>
    <div class="fld"><label>Notes</label>
      <textarea id="spnote" placeholder="what works here, which tide, what you have caught"></textarea></div>
    <button class="btn" id="spgo" onclick="doSaveSpot()">Save spot</button>
    <button class="btn alt" onclick="showMySpots()">See my saved spots</button>
  `);
}

async function doSaveSpot(){
  const st=state||{};
  const name=(document.getElementById('spn').value||'').trim();
  if(!name) return setMsg('Give it a name so you recognise it later.');
  const notes=(document.getElementById('spnote').value||'').trim()||null;
  const b=document.getElementById('spgo'); b.disabled=true; b.textContent='Saving…';
  const rec={name, lat:st.lat, lng:st.lng, notes,
             water:st.name||null, created_at:new Date().toISOString()};
  try{
    if(sb&&ME){
      // `water` needs the v21 migration; retry without it so an un-migrated
      // database still saves the spot rather than failing outright
      let {error}=await sb.from('spots')
        .insert({user_id:ME.id,name,lat:st.lat,lng:st.lng,notes,water:st.name||null});
      if(error && /water/i.test(error.message||'')){
        console.warn('spots.water column missing — run the v21 migration; saving without it');
        ({error}=await sb.from('spots').insert({user_id:ME.id,name,lat:st.lat,lng:st.lng,notes}));
      }
      if(error) throw error;
    } else {
      const a=localSpots(); a.unshift({...rec,id:'l'+Date.now()}); setLocalSpots(a);
    }
    MYSPOTS=null;
    await loadMySpots();
    showMySpots();
  }catch(e){
    b.disabled=false; b.textContent='Save spot';
    setMsg(e.message||'Could not save that spot.');
  }
}

async function showMySpots(){
  openModal(`<div class="mtitle">My spots</div>
    <div class="msub"><span class="spin"></span>Loading…</div>`);
  const list=await loadMySpots();
  const rows=(list||[]).map((s,i)=>`
    <button class="slrow" onclick="gotoSpot(${i})">
      <div class="slic">📌</div>
      <div style="flex:1;min-width:0">
        <div class="slname">${esc(s.name)}</div>
        <div class="slsub">${s.water?esc(s.water)+' · ':''}${(+s.lat).toFixed(3)}, ${(+s.lng).toFixed(3)}${s.remote?'':' <span class="chip">this device</span>'}</div>
      </div><div class="arrow">›</div>
    </button>`).join('');
  openModal(`
    <div class="mtitle">My spots</div>
    <div class="msub">${(list&&list.length)||0} saved${ME?' to your account':' on this device'}.
      ${ME?'Private to you — the database enforces that, not just the app.':'Sign in to keep them across devices.'}</div>
    ${rows||'<div class="nod">Nothing saved yet. Tap the map, then ＋ Save spot.</div>'}
    <button class="btn" onclick="closeModal();openSaveSpot()">Save the current spot</button>
    <button class="btn alt" onclick="closeModal()">Close</button>
  `);
}

function gotoSpot(i){
  const s=MYSPOTS&&MYSPOTS[i]; if(!s) return;
  closeModal();
  map.setView([+s.lat,+s.lng],15);
  lookup(+s.lat,+s.lng);
  if(s.notes) setTimeout(()=>openModal(`<div class="mtitle">📌 ${esc(s.name)}</div>
    <div class="msub">${esc(s.water||'')}</div>
    <div class="panel"><div class="pBody">${esc(s.notes)}</div></div>
    <button class="btn alt" onclick="closeModal()">Close</button>`),900);
}

    how:'Anchor up-current and let a chum line drift back over it, or drop straight down and work just off the bottom.',
    species:['mangrovesnapper','grouper','cuda','kingfish']},
  shoal:    {icon:'⛰️', label:'Shoal / sandbar', base:7, tide:'moving', sun:'lowlight',
    why:'A bar is a depth change, and depth changes are where fish hunt. Bait sweeping over the top drops into the trough behind it.',
    how:'Fish the deep side of the bar, casting up onto the shallow top and dragging the bait over the edge.',
    species:['redfish','seatrout','flounder','pompano']},
  marker:   {icon:'🚩', label:'Channel marker', base:6, tide:'moving', sun:'any',
    why:'A marker sits on the line between channel and shallows — a permanent depth edge, with a piling for structure.',
    how:'Cast to the base of the marker and work the drop-off away from it.',
    species:['mangrovesnapper','seatrout','jack']},
  pier:     {icon:'🎣', label:'Fishing pier', base:7, tide:'moving', sun:'any',
    why:'Reaches past the breakers into deeper water, with pilings holding bait the whole way out. Shore access without a boat.',
    how:'Fish the end for pelagics, the pilings for structure feeders. Watch which way the current runs and cast up into it.',
    species:['spanish','pompano','snook','sheepshead']},
  ramp:     {icon:'🛥️', label:'Boat ramp', base:3, tide:'any', sun:'any',
    why:'Access point rather than a spot. Useful for getting on the water near everything else on this list.',
    how:'Launch here and work the structure nearby.',
    species:[]}
};

/* Where in the tide cycle are we right now, and how hard is water moving? */
/* Takes the hour being scored. It used to read the wall clock regardless, so
   all 24 hourly bars and all 7 daily peaks got the SAME tide adjustment — the
   one for right now — even though tide is worth up to 16 points of spread and
   the whole point of the chart is which hour to fish. */
function tideStage(tide,when){
  if(!tide||!tide.preds||!tide.preds.length) return null;
  const now=when?new Date(when):new Date();
  const next=tide.preds.find(p=>p.t>=now);
  const prevs=tide.preds.filter(p=>p.t<now);
  const prev=prevs.length?prevs[prevs.length-1]:null;
  if(!next) return null;
  const minsTo=Math.round((next.t-now)/60000);
  const dir = next.hi ? 'incoming' : 'falling';
  let strength='moderate', phase='mid';
  if(prev){
    const span=(next.t-prev.t)/60000;
    const through=1-(minsTo/span);          // 0 at last turn, 1 at next turn
    if(through<0.25||through>0.85){ strength='slack'; phase= through>0.85?'late':'early'; }
    else if(through>=0.35&&through<=0.65){ strength='strong'; phase='mid'; }
    else { phase = through<0.5?'early':'late'; }
  }
  return {dir,strength,phase,minsTo,next,
    label:`${dir} tide, ${strength==='slack'?'near slack water':strength+' flow'}`};
}

/* Pull real mapped structure around a point. */
async function fetchSpots(lat,lng,radiusM){
  const r=radiusM||12000, ll=`${lat.toFixed(5)},${lng.toFixed(5)}`;
  const q=`[out:json][timeout:30];(`+
    `nwr(around:${r},${ll})["natural"="strait"];`+
    `nwr(around:${r},${ll})["natural"="cape"];`+
    `nwr(around:${r},${ll})["natural"="reef"];`+
    `nwr(around:${r},${ll})["natural"="shoal"];`+
    `nwr(around:${r},${ll})["natural"="wetland"]["wetland"~"mangrove|tidalflat"];`+
    `nwr(around:${r},${ll})["man_made"="pier"];`+
    `nwr(around:${r},${ll})["man_made"~"breakwater|groyne"];`+
    `nwr(around:${r},${ll})["leisure"="marina"];`+
    `nwr(around:${r},${ll})["leisure"="slipway"];`+
    `nwr(around:${r},${ll})["leisure"="fishing"];`+
    `way(around:${r},${ll})["bridge"]["highway"];`+
    `node(around:${r},${ll})["seamark:type"~"buoy_lateral|beacon_lateral"];`+
    `);out tags center 200;`;
  const d=await overpass(q);
  const out=[];
  (d.elements||[]).forEach(e=>{
    const t=e.tags||{};
    const c=e.center||(e.lat!=null?{lat:e.lat,lon:e.lon}:null);
    if(!c) return;
    let k=null;
    if(t.natural==='strait') k='inlet';
    else if(t.natural==='cape') k='point';
    else if(t.natural==='reef') k='reef';
    else if(t.natural==='shoal') k='shoal';
    else if(t.wetland==='mangrove') k='mangrove';
    else if(t.wetland==='tidalflat') k='flat';
    else if(t.man_made==='pier') k = /fish/i.test(t.name||'') ? 'pier' : 'dock';
    else if(t.man_made==='breakwater'||t.man_made==='groyne') k='jetty';
    else if(t.leisure==='marina') k='dock';
    else if(t.leisure==='slipway') k='ramp';
    else if(t.leisure==='fishing') k='pier';
    else if(t.bridge&&t.highway) k='bridge';
    else if(t['seamark:type']) k='marker';
    if(!k) return;
    out.push({ id:(e.type||'n')+e.id, kind:k, name:t.name||null,
      lat:c.lat, lng:c.lon, tags:t,
      dist:haversineKm(lat,lng,c.lat,c.lon) });
  });
  // creek mouths: a named waterway running close to the tapped water
  return dedupeSpots(out);
}

/* OSM maps long features as many segments; collapse near-identical hits. */
function dedupeSpots(list){
  const keep=[];
  list.sort((a,b)=>a.dist-b.dist).forEach(s=>{
    if(keep.some(k=>k.kind===s.kind && haversineKm(k.lat,k.lng,s.lat,s.lng)<0.45)) return;
    keep.push(s);
  });
  return keep;
}

/* Score a spot against what the water and sky are doing right now. */
function scoreSpot(s,ctx){
  const st=STRUCTURE[s.kind]; if(!st) return null;
  let score=st.base;
  const reasons=[], against=[];
  // Set when the one condition this structure depends on is actively wrong.
  // Other bonuses must never be able to paper over that.
  let mismatch=false;

  // --- tide match ---
  if(ctx.tide){
    const T=ctx.tide;
    if(st.tide==='falling'){
      if(T.dir==='falling'&&T.strength!=='slack'){ score+=3; reasons.push(`the tide is falling with ${T.strength} flow, which is exactly when this spot works`); }
      else if(T.dir==='falling'){ score+=1; reasons.push('the tide is falling, though flow is near slack'); }
      else { score-=3; mismatch=true; against.push('it really wants a falling tide, and water is currently coming in'); }
    } else if(st.tide==='incoming'){
      if(T.dir==='incoming'&&T.strength!=='slack'){ score+=3; reasons.push('water is pushing in, flooding the shallows and bringing fish up with it'); }
      else if(T.dir==='incoming'){ score+=1; reasons.push('water is starting to push in'); }
      else { score-=3; mismatch=true; against.push('it fishes best on an incoming tide, and water is currently draining'); }
    } else if(st.tide==='high'){
      if(T.dir==='incoming'&&T.phase==='late'){ score+=3; reasons.push('the tide is near the top, so fish can get right up into the roots'); }
      else if(T.dir==='incoming'){ score+=2; reasons.push('the tide is building toward high water'); }
      else if(T.dir==='falling'&&T.phase==='early'){ score+=1; reasons.push('water is high but starting to drop, which pulls fish back out of the cover'); }
      else { score-=3; mismatch=true; against.push('the water is low, so there may not be enough of it up in the cover'); }
    } else if(st.tide==='moving'){
      if(T.strength==='strong'){ score+=3; reasons.push('water is moving hard, and this spot needs current to fish well'); }
      else if(T.strength==='moderate'){ score+=2; reasons.push('there is decent current running'); }
      else { score-=3; mismatch=true; against.push('the tide is near slack, so there is little current to work with'); }
    }
  }

  // --- light match ---
  if(st.sun==='night'&&ctx.dark){ score+=3; reasons.push('it is dark, which is when this spot comes alive'); }
  else if(st.sun==='night'&&!ctx.dark){ score-=2; against.push('it is a great deal better after dark'); }
  if(st.sun==='lowlight'&&ctx.lowlight){ score+=2; reasons.push('low light right now — prime window for sight feeding'); }

  // --- solunar overlap ---
  if(ctx.solActive){ score+=2; reasons.push(`a ${ctx.solActive} feeding period is running right now`); }

  // --- distance: a great spot an hour away is not a great spot today ---
  if(s.dist<3) score+=1;
  else if(s.dist>12) score-=3;
  else if(s.dist>8)  score-=2;
  else if(s.dist>5)  score-=1;

  // --- species overlap with what is actually recorded nearby ---
  const hits=(st.species||[]).filter(k=>ctx.localKeys.has(k));
  if(hits.length>=2){ score+=1; reasons.push('species recorded near here line up with what this structure holds'); }

  return {...s, st, score, reasons, against, hits, mismatch};
}

/* A spot whose defining condition is wrong can never be called prime, no
   matter how many secondary bonuses it collects. Saying "Prime right now"
   about a creek mouth on a rising tide would just be a lie with a colour. */
function bandFor(score,mismatch){
  if(mismatch) return score>=10
    ? {t:'Wrong tide for it', c:'#b08a2e', k:'ok'}
    : {t:'Off-peak', c:'#8b95a1', k:'off'};
  if(score>=13) return {t:'Prime right now', c:'#0a8f5f', k:'prime'};
  if(score>=10) return {t:'Good right now',  c:'#4a9d3f', k:'good'};
  if(score>=7)  return {t:'Worth a look',    c:'#b08a2e', k:'ok'};
  return {t:'Off-peak', c:'#8b95a1', k:'off'};
}

let SPOTS=null, SPOTS_ERR=null, spotLayer=null;

async function loadSpots(){
  const st=state||{};
  if(st.lat==null) return;
  SPOTS_ERR=null; SPOTS=null;
  if(state.tab==='spots') render();
  try{
    const raw=await fetchSpots(st.lat,st.lng,12000);
    const ctx=spotContext();
    // spots whose defining condition is wrong sink below every spot whose isn't
    SPOTS=raw.map(s=>scoreSpot(s,ctx)).filter(Boolean)
             .sort((a,b)=>(a.mismatch?1:0)-(b.mismatch?1:0) || b.score-a.score)
             .slice(0,20);
    paintSpotPins();
  }catch(e){
    SPOTS_ERR=e.message||'could not load structure';
    SPOTS=[];
  }
  if(state.tab==='spots') render();
}

/* Everything the scorer needs to know about right now. */
function spotContext(){
  const st=state||{};
  const sol=solunar(st.lat,st.lng);
  const now=new Date();
  const sr=sol.sun.rise, ss=sol.sun.set;
  const dark = (sr&&ss) ? (now<sr||now>ss) : (now.getHours()<6||now.getHours()>20);
  const near=(t)=>t&&Math.abs(now-t)<75*60000;
  const lowlight = near(sr)||near(ss);
  const active=sol.periods.find(p=>p.active);
  const localKeys=new Set();
  (st.counts||[]).forEach(c=>{
    const n=c.taxon&&(c.taxon.preferred_common_name||c.taxon.name);
    const k=n?ALIAS[n.toLowerCase().trim()]:null;
    if(k) localKeys.add(k);
  });
  if(st.offline&&st.fallbackSp) st.fallbackSp.forEach(k=>localKeys.add(k));
  return {tide:tideStage(st.tide), dark, lowlight,
          solActive:active?(active.kind==='major'?'major':'minor'):null,
          localKeys, sol};
}

function paintSpotPins(){
  if(spotLayer) map.removeLayer(spotLayer);
  if(!SPOTS||!SPOTS.length) return;
  spotLayer=L.layerGroup();
  SPOTS.slice(0,12).forEach((s,i)=>{
    const b=bandFor(s.score,s.mismatch);
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',iconSize:[28,28],iconAnchor:[14,14],
      html:`<div style="width:28px;height:28px;border-radius:50%;background:${b.c};border:2px solid #fff;
        box-shadow:0 1px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
        font-size:13px">${s.st.icon}</div>`})})
      .on('click',()=>openSpot(i)).addTo(spotLayer);
  });
  spotLayer.addTo(map);
}

function spotsHTML(){
  const st=state||{};
  if(st.lat==null) return `<div class="nod">Tap the map first, then Bitecast can rank the structure around that spot against the tide and light right now.</div>`;
  let h='';
  const ctx=spotContext();
  const bits=[];
  if(ctx.tide) bits.push('🌊 '+ctx.tide.label);
  bits.push(ctx.dark?'🌙 after dark':ctx.lowlight?'🌅 low light':'☀️ daylight');
  if(ctx.solActive) bits.push('🎣 '+ctx.solActive+' feeding period running');
  h+=`<div class="sctx">${bits.map(b=>esc(b)).join(' · ')}</div>`;
  h+=`<div class="hint">Structure within 7 miles, ranked against those conditions. Every spot says why it made the list — and why it might not be the one today.</div>`;

  if(SPOTS_ERR) h+=msg('Could not load structure: '+SPOTS_ERR);
  if(SPOTS===null) return h+`<div class="nod"><span class="spin"></span>Reading the structure around here…</div>`;
  if(!SPOTS.length){
    /* "No structure within 7 miles" is a strong claim and it was being made
       whenever the lookup came back empty for ANY reason. If the water itself
       had to be named from the offline list, Overpass never answered, and we
       know nothing about the structure here — say that instead of asserting
       there is none. */
    if(st.idsrc==='offline list' || st.idErr)
      return h+`<div class="nod">The structure lookup did not come back, so this list is empty — it does not mean there is nothing here. OpenStreetMap was unreachable or too busy. Pull down to try again in a moment.</div>`;
    return h+`<div class="nod">No mapped structure within 7 miles. OpenStreetMap is thin in rural areas — try tapping nearer a pass, bridge or developed shoreline.</div>`;
  }

  SPOTS.forEach((s,i)=>{
    const b=bandFor(s.score,s.mismatch);
    h+=`<div class="card">
      <div class="chead" onclick="tog(this)">
        <div class="slic" style="background:${b.c}22">${s.st.icon}</div>
        <div style="flex:1;min-width:0;text-align:left">
          <div class="slname">${esc(s.name||s.st.label)}</div>
          <div class="slsub">${esc(s.st.label)} · ${mi(s.dist)} mi
            <span class="ob" style="background:${b.c}1f;color:${b.c}">${b.t}</span></div>
        </div><div class="arrow">▼</div>
      </div>
      <div class="det">${spotDetail(s,b)}</div>
    </div>`;
  });
  h+=`<div class="foot">Structure from OpenStreetMap. Ranking is a reading of tide stage, daylight and feeding periods against how each kind of structure normally fishes — it is a starting point, not a guarantee. Local knowledge beats it every time.</div>`;
  return h;
}

function spotDetail(s,b){
  let h='';
  h+=`<div class="whyblk" style="border-left-color:${b.c}">
        <div class="whyt" style="color:${b.c}">${b.t}</div>`;
  if(s.reasons.length){
    h+=`<div class="whyl">Because ${s.reasons.map(r=>esc(r)).join('; and ')}.</div>`;
  } else {
    h+=`<div class="whyl">Nothing in the current conditions is pushing this one up or down.</div>`;
  }
  if(s.against.length){
    h+=`<div class="whyl agn">Working against it: ${s.against.map(r=>esc(r)).join('; ')}.</div>`;
  }
  h+=`</div>`;
  h+=`<div class="lbl">Why fish hold here</div><div class="sbval">${esc(s.st.why)}</div>`;
  h+=`<div class="lbl">How to fish it</div><div class="sbval">${esc(s.st.how)}</div>`;
  if(s.hits.length){
    const names=s.hits.map(k=>{
      const a=Object.keys(ALIAS).find(x=>ALIAS[x]===k)||k;
      return titleCase(a);
    });
    h+=`<div class="lbl">Recorded near here</div>
        <div>${names.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div>
        <div class="hint2">These are species with verified records nearby that also relate to this kind of structure.</div>`;
  }
  h+=`<div class="row2" style="margin-top:10px">
      <button class="btn alt" onclick="map.setView([${s.lat},${s.lng}],15);closeModal()">Show on map</button>
      <a class="btn alt" style="text-align:center;text-decoration:none;display:block"
         href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}"
         target="_blank" rel="noopener">🧭 Directions</a>
    </div>`;
  return h;
}

function openSpot(i){
  const s=SPOTS&&SPOTS[i]; if(!s) return;
  const b=bandFor(s.score,s.mismatch);
  openModal(`<div class="mtitle">${s.st.icon} ${esc(s.name||s.st.label)}</div>
    <div class="msub">${esc(s.st.label)} · ${mi(s.dist)} mi away</div>
    ${spotDetail(s,b)}
    <button class="btn alt" onclick="closeModal()">Close</button>`);
}

/* ============ RENDER ============ */
let marker=null, ring=null, state={};
const out=()=>document.getElementById('out');

function esc(s){return (s==null?'':String(s))
  .replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));}

/* Anyone can edit an OpenStreetMap website tag, and esc() only makes a value
   safe to sit INSIDE an attribute — it does not stop the value itself being
   javascript:. In an href that is script execution in our origin, which holds
   the signed-in Supabase session. Only ever emit http(s). */
function safeUrl(u){
  const s=String(u==null?'':u).trim();
  return /^https?:\/\//i.test(s) ? s : '';
}
function titleCase(s){return s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());}
function ago(d){
  if(!d) return '';
  const days=Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/864e5);
  if(isNaN(days)) return d;
  if(days<=0) return 'today';
  if(days===1) return 'yesterday';
  if(days<30) return days+' days ago';
  if(days<365) return Math.round(days/30)+' months ago';
  return Math.round(days/365)+' years ago';
}

function status(msg){
  out().innerHTML=`<div class="status"><span class="spin"></span>${esc(msg)}</div>`;
}

function render(){
  const {name,type,lat,lng,counts,recent,radius,idsrc,fishErr} = state;
  /* Reachable with nothing tapped yet: "See the community feed" in the profile
     sheet calls setTab('feed') then render(). Without this guard lat.toFixed
     throws and the whole panel goes blank, including every later render when
     weather and tide resolve. */
  if(lat==null){
    out().innerHTML='<div class="empty"><div class="ic">\uD83D\uDDFA\uFE0F</div>'+
      '<div style="font-weight:600;color:var(--ink);margin-bottom:6px">Where do you want to fish?</div>'+
      '<div style="font-size:12px">Tap a lake, river, bay, flat, inlet or the open Gulf, and the rest fills in.</div></div>';
    return;
  }
  const label={salt:'Saltwater',fresh:'Freshwater',brack:'Brackish / tidal',unk:'Type unknown'}[type];
  const cls={salt:'salt',fresh:'fresh',brack:'brack',unk:'unk'}[type];

  const targets=[], others=[];
  if(state.offline && state.fallbackSp){
    state.fallbackSp.forEach(k=>{
      const t=T[k]; if(!t) return;
      const common=Object.keys(ALIAS).find(a=>ALIAS[a]===k)||k;
      targets.push({c:{count:null},t,common,key:k,photo:null});
    });
  } else {
    (counts||[]).forEach(c=>{
      const tx=c.taxon||{};
      const common=tx.preferred_common_name||tx.name;
      const key=common?ALIAS[common.toLowerCase().trim()]:null;
      const t=key?T[key]||null:null;
      const photo=tx.default_photo?(tx.default_photo.medium_url||tx.default_photo.square_url):null;
      (t?targets:others).push({c,t,common,key,photo});
    });
  }

  let h='';
  h+=`<div class="loc">${esc(name||'Unnamed water')}</div>`;
  h+=`<div class="sub">${lat.toFixed(4)}, ${lng.toFixed(4)} · identified via ${esc(idsrc)}</div>`;
  h+=`<div class="pill ${cls}">${label}</div>`;

  h+=`<div class="tabs">
        <button class="tab ${state.tab==='today'?'on':''}" onclick="setTab('today')">Forecast</button>
        <button class="tab ${state.tab==='common'?'on':''}" onclick="setTab('common')">Fish</button>
        <button class="tab ${state.tab==='spots'?'on':''}" onclick="setTab('spots')">Spots</button>
        <button class="tab ${state.tab==='cond'?'on':''}" onclick="setTab('cond')">Tides</button>
        <button class="tab ${state.tab==='recent'?'on':''}" onclick="setTab('recent')">Recent</button>
        <button class="tab ${state.tab==='feed'?'on':''}" onclick="setTab('feed')">Community</button>
      </div>`;

  if(state.offline || state.idErr || fishErr){
    h+=`<div class="err">
          Live data is unreachable from this browser${state.offline?' — showing the built-in offline list for this area':''}.
          <br><a href="#" onclick="runDiagnostics();return false;" style="color:#ffc9b0;font-weight:700">Run a connection test →</a>
        </div>`;
  }

  if(state.tab==='today'){
    h+=todayHTML();
  } else if(state.tab==='common'){
    h+=`<div class="hint">${state.offline
      ? 'Built-in species list for this area — live records unavailable right now. Tap a fish for bait, rigging and technique.'
      : `Ranked by verified iNaturalist records within ${mi(radius,0)} miles of your tap. Tap a fish for bait, rigging and technique.`}</div>`;
    if(!targets.length && !others.length){
      h+=`<div class="nod">No fish records logged within ${mi(radius,0)} miles yet. That usually means the spot is lightly documented, not that it is empty. Try tapping a nearby pass, bridge or main basin.</div>`;
    }
    targets.forEach((x,i)=>{
      const t=x.t, sci=x.c.taxon&&x.c.taxon.name;
      h+=`<div class="card">
        <div class="chead" onclick="tog(this)">
          ${x.photo
            ? `<img class="fphoto" src="${esc(x.photo)}" alt="${esc(x.common)}" loading="lazy">`
            : `<div class="fphoto ph">${t.e}</div>`}
          <div style="flex:1;min-width:0">
            <div><span class="rank">#${i+1}</span><span class="fname">${esc(titleCase(x.common))}</span></div>
            <div class="sci">${esc(sci||'')}</div>
            <div class="cnt">${x.c.count==null?'commonly caught here':x.c.count+' record'+(x.c.count===1?'':'s')+' nearby'} · ${esc(t.d)} · ⭐ ${t.s}/10</div>
          </div><div class="arrow">▼</div>
        </div>
        <div class="det">${detailHTML(t,x.key,x.photo,x.common)}</div>
      </div>`;
    });
    if(others.length){
      h+=`<div class="lbl" style="margin-top:16px">Also recorded here</div><div class="nod">`;
      h+=others.slice(0,18).map(o=>`${esc(titleCase(o.common||'unknown'))} <span style="color:var(--ink3)">(${o.c.count})</span>`).join(' · ');
      h+=`</div>`;
    }
  } else if(state.tab==='recent'){
    h+=`<div class="hint">Most recent verified fish records within ${mi(radius,0)} miles, newest first. Tap one for bait, rigging and legal limits.</div>`;
    if(!(recent||[]).length){
      h+=`<div class="nod">No recent records within ${mi(radius,0)} miles.</div>`;
    }
    (recent||[]).forEach(o=>{
      const tx=o.taxon||{}, cn=tx.preferred_common_name||tx.name||'Unidentified fish';
      const key=cn?ALIAS[cn.toLowerCase().trim()]:null;
      const t=key?T[key]||null:null;
      const raw=(o.photos&&o.photos[0]&&o.photos[0].url)||'';
      const thumb=raw?raw.replace('square','small'):'';
      const big=raw?raw.replace('square','medium'):'';
      const place=o.place_guess||'';
      const meta=`<div class="obsmeta">
            📅 <b>Recorded:</b> ${esc(ago(o.observed_on))}${o.observed_on?' ('+esc(o.observed_on)+')':''}<br>
            ${place?`📍 <b>Where:</b> ${esc(place)}<br>`:''}
            ${tx.name?`🔬 <b>Species:</b> <i>${esc(tx.name)}</i><br>`:''}
            ${o.id?`<a class="rlink" href="https://www.inaturalist.org/observations/${o.id}" target="_blank" rel="noopener">See the original record →</a>`:''}
          </div>`;
      h+=`<div class="card">
        <div class="chead" onclick="tog(this)">
          ${thumb
            ? `<img class="fphoto" src="${esc(thumb)}" alt="${esc(cn)}" loading="lazy">`
            : `<div class="fphoto ph">${t?t.e:'🐟'}</div>`}
          <div style="flex:1;min-width:0">
            <div class="fname">${esc(titleCase(cn))}</div>
            <div class="sci">${esc(tx.name||'')}</div>
            <div class="cnt">${esc(ago(o.observed_on))}${place?' · '+esc(place.slice(0,34)):''}</div>
          </div><div class="arrow">▼</div>
        </div>
        <div class="det">${detailHTML(t,key,big,cn,meta)}</div>
      </div>`;
    });
  } else if(state.tab==='cond'){
    h+=condHTML();
  } else if(state.tab==='spots'){
    h+=spotsHTML();
  } else {
    h+=feedHTML();
  }

  h+=`<div class="foot">
        Water body from OpenStreetMap (Overpass API). Fish records and identification photos from iNaturalist — verified public observations, so they show what is actually documented in the area rather than a guess.<br><br>
        <b>Limits shown were checked against FWC on ${REG_CHECKED} and are a starting point, not legal advice.</b> Florida manages redfish, snook and seatrout by region, and reef fish seasons can change by executive order mid-season. Confirm on myfwc.com before you keep anything, and carry the right licence and permits.
      </div>`;
  out().innerHTML=h;
  try{ paintPeek(); }catch(e){}
}

function sheetSize(mode){
  const s=document.getElementById('side');
  s.classList.remove('big','small','mid');
  if(mode==='big') s.classList.add('big');
  else if(mode==='small') s.classList.add('small');
  else if(mode==='mid') s.classList.add('mid');
  const b=document.getElementById('b-full');
  if(b) b.innerHTML = mode==='small'
    ? '\u2921<span class="lw"> Exit full</span>'
    : '\u2922<span class="lw"> Full map</span>';
  setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 290);
}
function currentSheet(){
  const s=document.getElementById('side');
  if(s.classList.contains('big')) return 'big';
  if(s.classList.contains('small')) return 'small';
  if(s.classList.contains('mid')) return 'mid';
  return 'peek';
}
/* The handle cycles: peek -> half -> full panel -> map only -> peek */
function toggleSheetSize(){
  const now=currentSheet();
  sheetSize(now==='peek'?'mid':now==='mid'?'big':now==='big'?'small':'peek');
}
function toggleFullMap(){
  sheetSize(currentSheet()==='small'?'mid':'small');
}

/* Keep the collapsed strip meaningful — the score should be readable
   without opening anything, which is the whole point of it. */
function paintPeek(){
  const el=document.getElementById('pkScore'),
        nm=document.getElementById('pkName'),
        sb=document.getElementById('pkSub');
  if(!el||!nm||!sb) return;
  const st=state||{};
  if(st.lat==null){
    el.textContent='\u2014'; el.style.color='var(--ink3)';
    el.style.borderColor='var(--line2)'; el.style.background='var(--s2)';
    nm.textContent='Tap the water to start';
    sb.textContent='Bitecast \u2014 forecast, species, tides and limits';
    return;
  }
  const b=biteScore(st.lat,st.lng,new Date(),WX,st.tide);
  const bd=biteBand(b.score);
  el.textContent=b.score;
  el.style.color=bd.c;
  el.style.borderColor=bd.c+'66';
  el.style.background=bd.c+'1a';
  nm.textContent=st.name||'Unnamed water';
  const bits=[bd.t];
  if(b.wind) bits.push(b.wind.speed+' mph '+b.wind.arrow);
  if(b.pt) bits.push(Math.round(b.pt.cur)+' mb '+(b.pt.delta<-0.2?'\u2193':b.pt.delta>0.2?'\u2191':'\u2192'));
  if(b.tide) bits.push(b.tide.dir);
  sb.textContent=bits.join(' \u00B7 ');
}

function setTab(t){
  state.tab=t; render();
  if(t==='feed' && sb && FEED===null) loadFeed();
  if(t==='spots' && SPOTS===null && state.lat!=null) loadSpots();
}
function tog(el){
  const d=el.parentElement.querySelector('.det');
  d.classList.toggle('on');
  el.querySelector('.arrow').textContent=d.classList.contains('on')?'▲':'▼';
}

/* ============ LOOKUP ============ */
let seq=0;
async function lookup(lat,lng,radiusOverride){
  const my=++seq;
  // bring the panel up so the results are visible, from peek or full-map
  try{ const cs=currentSheet(); if(cs==='small'||cs==='peek') sheetSize('mid'); }catch(e){}
  const radius = radiusOverride || (map.getZoom()>=12 ? 8 : (map.getZoom()>=10 ? 15 : 25));

  if(marker) map.removeLayer(marker);
  if(ring) map.removeLayer(ring);
  marker=L.circleMarker([lat,lng],{radius:7,fillColor:'#e2622c',color:'#fff',weight:2,fillOpacity:.95}).addTo(map);
  ring=L.circle([lat,lng],{radius:radius*1000,color:'#0b5fa5',weight:1,fillOpacity:.05,dashArray:'4 4'}).addTo(map);

  status('Identifying the water body…');
  let id, idErr=null;
  try{ id = await identify(lat,lng); }
  catch(err){ id={name:null,type:'unk',src:'lookup failed',tags:{}}; idErr=err.message||'network error'; }
  if(my!==seq) return;

  const gaz = gazLookup(lat,lng);
  if(!id.name && gaz){ id={name:gaz.n, type:gaz.t, src:'offline list', tags:{}}; }

  status(`${id.name||'Water'} — pulling fish records within ${mi(radius,0)} miles…`);
  let data={counts:[],recent:[],err:null};
  try{ data = await fishHere(lat,lng,radius); }
  catch(err){ data={counts:[],recent:[],err:err.message||'network error'}; }
  if(my!==seq) return;

  // If live records are unavailable, fall back to the built-in species list
  const offline = (!data.counts.length && !!data.err && !!gaz);

  state = {name:id.name, type:id.type, idsrc:id.src, lat, lng, radius,
           counts:data.counts, recent:data.recent, tab:'today', condDay:'today', dayOff:0,
           fishErr:data.err, idErr, offline, fallbackSp: gaz?gaz.sp:null,
           tide:null, tideErr:null};
  FEED=null; FEED_ERR=null;
  SPOTS=null; SPOTS_ERR=null;
  if(spotLayer){ map.removeLayer(spotLayer); spotLayer=null; }
  render();

  // tides and weather load in the background so the fish list is not held up
  if(id.type!=='fresh'){
    tidesFor(lat,lng)
      .then(t=>{ if(my===seq){ state.tide=t; if(state.tab==='cond'||state.tab==='today') render(); } })
      .catch(e=>{ if(my===seq){ state.tideErr=e.message||'network error'; if(state.tab==='cond'||state.tab==='today') render(); } });
  }
  WX=null; WX_ERR=null;
  fetchWeather(lat,lng)
    .then(w=>{ if(my===seq){ WX=w; if(state.tab==='today'||state.tab==='cond') render(); } })
    .catch(e=>{ if(my===seq){ WX_ERR=e.message||'network error';
        console.warn('weather failed:',e.message); if(state.tab==='today') render(); } });
}

map.on('click', e=> lookup(e.latlng.lat, e.latlng.lng));

/* boot accounts */
initSupabase();
paintAcct();
try{ paintPeek(); }catch(e){}

/* ============ LOCATE ME ============ */
let meDot=null;
function locateMe(){
  const btn=document.getElementById('b-loc');
  if(!navigator.geolocation){
    out().innerHTML='<div class="err">This browser does not support location.</div>';
    return;
  }
  btn.textContent='📍 Locating…';
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.textContent='📍 Locate me';
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(meDot) map.removeLayer(meDot);
    meDot=L.circleMarker([lat,lng],{radius:6,fillColor:'#0b5fa5',color:'#fff',weight:2,fillOpacity:1}).addTo(map);
    map.setView([lat,lng],14);
    lookup(lat,lng,8);
  }, err=>{
    btn.textContent='📍 Locate me';
    const msg = err.code===1
      ? 'Location permission was denied. Allow location for this site, or just tap the map.'
      : 'Could not get your location ('+(err.message||'unknown')+'). Tap the map instead.';
    out().innerHTML='<div class="err">'+esc(msg)+'</div>';
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
